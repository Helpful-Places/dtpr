id: input_dataset
name:
  - locale: en
    value: Input Dataset
  - locale: fr
    value: Ensemble de données d'entrée
description:
  - locale: en
    value: >-
      The runtime input — the live data this deployed system processes when it operates. Distinct
      from training data.
  - locale: fr
    value: >-
      L’entrée d’exécution — les données en direct que ce système déployé traite lorsqu’il
      fonctionne. Distinct des données d’entraînement.
prompt:
  - locale: en
    value: What live data does this AI system process at runtime?
  - locale: fr
    value: "Quelles données en direct ce système d’IA traite-t-il à l’exécution\_?"
required: false
order: 6
datachain_type: ai
shape: circle
context:
  id: pii
  name:
    - locale: en
      value: Personal Information
    - locale: fr
      value: Informations personnelles
  description:
    - locale: en
      value: >-
        How identifiable the data is when this system processes it. The element name says what the
        data is about; this colour says how directly it identifies a person.
    - locale: fr
      value: >-
        À quel point les données sont identifiables lorsque ce système les traite. Le nom de
        l’élément indique de quoi parlent les données ; cette couleur indique dans quelle mesure
        elles identifient directement une personne.
  values:
    - id: de_identified
      name:
        - locale: en
          value: Anonymous
        - locale: fr
          value: Anonyme
      description:
        - locale: en
          value: >-
            Data about people with the link to who is broken. Stripped of identifiers, blurred,
            aggregated, or noised so this system can’t reasonably tie a record back to an
            individual.
        - locale: fr
          value: >-
            Données concernant des personnes dont le lien à l’identité est rompu. Privées
            d’identifiants, floutées, agrégées ou bruitées pour que ce système ne puisse pas
            raisonnablement relier un enregistrement à un individu.
      color: "#4A90D9"
    - id: pseudonymous
      name:
        - locale: en
          value: Pseudonymous
        - locale: fr
          value: Pseudonyme
      description:
        - locale: en
          value: >-
            Each person’s data is tied to a token (hash, ID, template) that lets this system
            recognise the same person across events, but the token itself doesn’t reveal a name.
            Reidentification is possible with extra information.
        - locale: fr
          value: >-
            Les données de chaque personne sont liées à un jeton (hachage, identifiant, modèle) qui
            permet à ce système de reconnaître la même personne d’un événement à l’autre, mais le
            jeton lui-même ne révèle pas de nom. La réidentification est possible avec des
            informations supplémentaires.
      color: "#9575CD"
    - id: identifiable
      name:
        - locale: en
          value: Identifiable
        - locale: fr
          value: Identifiable
      description:
        - locale: en
          value: >-
            The data either contains a direct identifier (name, address, account name, recognisable
            face or voice, plate number) or carries a token this system uses to look up legal
            identity during processing.
        - locale: fr
          value: >-
            Les données contiennent un identifiant direct (nom, adresse, nom de compte, visage ou
            voix reconnaissable, plaque d’immatriculation) ou portent un jeton que ce système
            utilise pour rechercher l’identité légale pendant le traitement.
      color: "#FFD700"
element_variables:
  - id: additional_description
    label:
      - locale: en
        value: Description
      - locale: fr
        value: Description
    required: true
