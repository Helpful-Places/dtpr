notes: |
  Structural metadata pass — adds shared ProvenanceRef, sources[] on
  DatachainType/Category/Element/InstanceElement, authoring_guidance and
  examples[] on Category/Element. Element.citation deprecated in favor of
  Element.sources (kept valid for one beta). Also lands the icon
  design-pass priority queue from .context/icon-design-pass.md (20 SVGs
  revised to the post-PR-#281 house style).

  Element-light vocabulary primitive — adds `kind` discriminator on
  Category.element_variables[] (default `localized_text` preserves
  backwards compatibility), introduces `multi_select_enum` variable kind
  with vocabulary-level sources[] and Element-light options[] (id, name,
  description, applies_to[], optional sources / authoring_guidance /
  examples; no symbol_id by design). InstanceElement.variables[].value
  is polymorphic on declared kind: LocaleValueArray for localized_text,
  list of option ids for multi_select_enum. New semantic rules:
  VARIABLE_OPTION_DUPLICATE, VARIABLE_OPTION_APPLIES_TO_UNKNOWN,
  VARIABLE_OPTIONS_EMPTY (warning), VARIABLE_REQUIRED_EMPTY_OPTIONS,
  INSTANCE_VARIABLE_VALUE_SHAPE, INSTANCE_VARIABLE_VALUE_DUPLICATE,
  INSTANCE_VARIABLE_OPTION_UNKNOWN, INSTANCE_VARIABLE_OPTION_NOT_APPLICABLE.
  Lands `risks_mitigation.specific_harms` as the first multi_select_enum
  vocabulary shell, sourced from AAAIC (Abercrombie et al. 2024,
  arXiv:2407.01294); options[] empty pending dtpr-element-design.
