id: input_sensitive_personal
category_id: input_dataset
title:
  - locale: en
    value: Sensitive personal information
  - locale: fr
    value: Informations personnelles sensibles
description:
  - locale: en
    value: >-
      Health, finances, beliefs, sexuality, immigration status, or other personal information that
      carries legal and social risk. The AI takes in this kind of protected data. Examples:
      insurance eligibility at a clinic kiosk, a benefits-application status, a self-declared
      pronoun.
  - locale: fr
    value: >-
      Santé, finances, convictions, sexualité, situation migratoire ou autres informations
      personnelles porteuses de risque légal et social. L'IA reçoit ce type de données protégées.
      Exemples : éligibilité à une assurance sur une borne de clinique, état d'une demande de
      prestation, pronom auto-déclaré.
citation:
  - locale: en
    value: >-
      Categories drawn from GDPR Article 9 "special categories of personal data" and Apple App Store
      privacy "Sensitive Info" / "Health & Fitness" / "Financial Info" labels.
symbol_id: sensitive_personal
variables: []
