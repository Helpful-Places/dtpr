id: output_sensitive_personal
category_id: output_dataset
title:
  - locale: en
    value: Sensitive personal information
  - locale: fr
    value: Informations personnelles sensibles
description:
  - locale: en
    value: >-
      The AI produces output about health, finances, beliefs, sexuality, immigration status, or
      other categories that carry legal and social risk. Examples: a triage priority assigned at a
      clinic, an eligibility result sent to a benefits portal, an inferred protected attribute
      exported downstream.
  - locale: fr
    value: >-
      L'IA produit une sortie portant sur la santé, les finances, les convictions, la sexualité, la
      situation migratoire ou d'autres catégories porteuses de risque légal et social. Exemples :
      une priorité de triage attribuée en clinique, un résultat d'éligibilité envoyé à un portail de
      prestations, un attribut protégé inféré et exporté.
citation:
  - locale: en
    value: >-
      Categories drawn from GDPR Article 9 "special categories of personal data" and Apple App Store
      privacy "Sensitive Info" / "Health & Fitness" / "Financial Info" labels.
symbol_id: sensitive_personal
variables: []
