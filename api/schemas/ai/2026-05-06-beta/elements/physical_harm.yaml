id: physical_harm
category_id: risks_mitigation
title:
  - locale: en
    value: Physical harm
  - locale: fr
    value: Préjudice physique
description:
  - locale: en
    value: >-
      The risk that the AI system's outputs lead to physical injury to individuals or damage to
      property. This includes risks from autonomous vehicles, robotic actuation, faulty navigation
      guidance, or critical-infrastructure errors that put bodies or property in harm's way.
      Mitigations may include rigorous safety testing, fail-safe defaults, geofencing of hazardous
      behavior, and human oversight of high-stakes physical actions.
  - locale: fr
    value: >-
      Le risque que les résultats du système d'IA entraînent des blessures physiques pour des
      personnes ou des dommages matériels. Cela inclut les risques liés aux véhicules autonomes, à
      l'actionnement robotique, à des indications de navigation erronées ou à des erreurs
      d'infrastructures critiques mettant en danger des corps ou des biens. Les mesures
      d'atténuation peuvent inclure des tests de sécurité rigoureux, des paramètres par défaut à
      sécurité intégrée, le géorepérage des comportements dangereux et la supervision humaine des
      actions physiques à enjeux élevés.
symbol_id: risks_physical
