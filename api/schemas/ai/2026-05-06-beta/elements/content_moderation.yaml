id: content_moderation
category_id: purpose
title:
  - locale: en
    value: Content Moderation
  - locale: fr
    value: Modération de contenu
description:
  - locale: en
    value: >-
      Filters, ranks, or removes user-generated content based on policies — for example, comment
      moderation on a public-facing kiosk, image filtering, or hate-speech detection.
  - locale: fr
    value: >-
      Filtre, classe ou retire du contenu généré par les utilisateurs selon des politiques — par
      exemple, la modération de commentaires sur une borne publique, le filtrage d'images, ou la
      détection de discours haineux.
citation:
  - locale: en
    value: >-
      Content-moderation duties for online platforms framed by the EU Digital Services Act
      (Regulation (EU) 2022/2065) — particularly Articles 14–17 (notice-and-action, statements of
      reasons, internal complaint handling). AIAAIC repository documents recurring moderation
      failures across speech, image, and recommender systems.
  - locale: fr
    value: >-
      Obligations de modération de contenu pour les plateformes en ligne encadrées par le Règlement
      européen sur les services numériques (Règlement (UE) 2022/2065), en particulier les Articles
      14 à 17.
symbol_id: content_moderation
variables: []
