id: input_decision
category_id: input_dataset
title:
  - locale: en
    value: A decision about you
  - locale: fr
    value: Une décision à propos de vous
description:
  - locale: en
    value: >-
      An eligibility, classification, ranking, or yes/no that another system already made about a
      person. The AI takes in this prior decision and uses it as input. Examples: a credit score
      from another model, an access-allow flag from upstream, a triage class assigned earlier in the
      pipeline.
  - locale: fr
    value: >-
      Une éligibilité, classification, hiérarchisation, ou un oui/non qu'un autre système a déjà
      décidé sur une personne. L'IA reçoit cette décision antérieure et l'utilise en entrée.
      Exemples : un score de crédit issu d'un autre modèle, un drapeau d'accès autorisé venant
      d'amont, une classe de triage attribuée plus tôt dans le pipeline.
sources:
  - type: regulation
    title: EU AI Act Article 3(1) — output classes (predictions, content, recommendations, decisions)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    citation: Regulation (EU) 2024/1689, Article 3(1).
symbol_id: dm_accept-or-deny
