id: output_physical_action
category_id: output_dataset
title:
  - locale: en
    value: A physical action
  - locale: fr
    value: Une action physique
description:
  - locale: en
    value: >-
      The AI triggers something in the physical world — a door unlocking, a light turning on, an
      alert sounding, signage changing, HVAC adjusting. Examples: a turnstile that opens on facial
      match, a public-address alert played automatically, an HVAC adjustment commanded by a building
      model.
  - locale: fr
    value: >-
      L'IA déclenche quelque chose dans le monde physique : une porte qui se déverrouille, une
      lumière qui s'allume, une alerte qui retentit, une signalétique qui change, un système CVC qui
      s'ajuste. Exemples : un tourniquet qui s'ouvre sur reconnaissance faciale, une alerte de
      sonorisation diffusée automatiquement, un ajustement CVC commandé par un modèle de bâtiment.
citation:
  - locale: en
    value: >-
      Output class implicit in EU AI Act Article 3(1) — outputs that "influence physical or virtual
      environments"; pairs with the agentic_mode element in this schema.
symbol_id: physical_action
variables: []
