id: biometric_recognition
category_id: processing
title:
  - locale: en
    value: Biometric Recognition
  - locale: fr
    value: Reconnaissance biométrique
description:
  - locale: en
    value: >-
      AI systems that identify or verify a specific person from biological signals — face,
      fingerprint, voice, iris, or gait. Distinct from generic computer vision because the output is
      tied to a named individual. Many jurisdictions restrict or prohibit biometric recognition in
      publicly accessible spaces.
  - locale: fr
    value: >-
      Systèmes d'IA qui identifient ou vérifient une personne précise à partir de signaux
      biologiques — visage, empreinte digitale, voix, iris ou démarche. Distinct de la vision par
      ordinateur générique car la sortie est liée à un individu nommé. De nombreuses juridictions
      restreignent ou interdisent la reconnaissance biométrique dans les espaces accessibles au
      public.
