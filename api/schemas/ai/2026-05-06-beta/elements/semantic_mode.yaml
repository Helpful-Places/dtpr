id: semantic_mode
category_id: functional_modes
title:
  - locale: en
    value: Semantic — understands and remembers
  - locale: fr
    value: Sémantique — comprend et se souvient
description:
  - locale: en
    value: >-
      Understands and remembers — pulls meaning from text or speech, finds related ideas, and
      grounds the system in saved context. The system reads language and returns matches, intents,
      summaries, or links to relevant prior knowledge. It does not generate new content. Examples:
      matching a customer's question to the right help article, retrieving the policy clause that
      applies to a case, recognizing the topic of a recorded sentence.
  - locale: fr
    value: >-
      Comprend et se souvient — extrait du sens d'un texte ou d'une parole, trouve des idées liées
      et ancre le système dans un contexte enregistré. Le système lit du langage et renvoie des
      correspondances, des intentions, des résumés ou des liens vers des connaissances pertinentes.
      Il ne génère pas de nouveau contenu. Exemples : faire correspondre la question d'un client à
      l'article d'aide approprié, retrouver la clause de politique applicable à un dossier,
      reconnaître le sujet d'une phrase enregistrée.
symbol_id: mode_semantic
variables: []
