title:
  - locale: en
    value: About a body
  - locale: fr
    value: À propos d'un corps
description:
  - locale: en
    value: >-
      The AI produces output containing biological signals from a person's body — face templates,
      voice embeddings, gait vectors, gesture sequences. Examples: an enrolled face template stored
      downstream, a voice embedding for later matching, a gait signature exported to another system.
  - locale: fr
    value: >-
      L'IA produit une sortie contenant des signaux biologiques du corps d'une personne : modèles
      faciaux, empreintes vocales, vecteurs de démarche, séquences de gestes. Exemples : un modèle
      facial enrôlé stocké en aval, une empreinte vocale pour appariement ultérieur, une signature
      de démarche exportée vers un autre système.
