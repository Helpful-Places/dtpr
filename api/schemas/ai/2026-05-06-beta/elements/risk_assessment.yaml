id: risk_assessment
category_id: purpose
title:
  - locale: en
    value: Risk Assessment & Triage
  - locale: fr
    value: Évaluation des risques et triage
description:
  - locale: en
    value: >-
      Scores or prioritizes individuals or cases for further attention or action — for example,
      recidivism scoring, hospital triage, child-welfare risk flags. Distinct from Planning &
      Decision-making, which forecasts at a population or system level.
  - locale: fr
    value: >-
      Note ou hiérarchise des personnes ou des cas pour une attention ou une action accrue — par
      exemple, notation de récidive, triage hospitalier, signalements de risque en protection de
      l'enfance. À distinguer de Planification et prise de décision, qui prévoit à l'échelle d'une
      population ou d'un système.
citation:
  - locale: en
    value: >-
      Risk profiling of natural persons listed as Annex III high-risk under the EU AI Act
      (Regulation (EU) 2024/1689), Article 6(2) — including law-enforcement profiling (Annex III §6)
      and individual risk assessment in the administration of justice (§8). AIAAIC repository
      documents incidents in COMPAS recidivism scoring (US), Dutch SyRI welfare-fraud risk, and UK
      Gangs Matrix.
  - locale: fr
    value: >-
      Le profilage de risque des personnes physiques est classé à haut risque à l'Annexe III du
      Règlement (UE) 2024/1689 (loi européenne sur l'IA), Article 6(2) — y compris le profilage
      policier (Annexe III §6) et l'évaluation individuelle du risque dans l'administration de la
      justice (§8).
symbol_id: risk_assessment
variables: []
