id: agentic_mode
category_id: functional_modes
title:
  - locale: en
    value: Agentic — acts
  - locale: es
    value: Agentivo — actúa
  - locale: fr
    value: Agentique — agit
  - locale: pt
    value: Agêntico — atua
description:
  - locale: en
    value: >-
      Acts — plans a goal into steps and carries them out, calling tools, browsing, scheduling, or composing
      multi-step workflows on the user's or operator's behalf. The output is an action taken in software, not a piece
      of content returned. Examples: booking a meeting, filing a return, escalating a ticket, running a campaign loop.
  - locale: es
    value: >-
      Actúa — planifica una meta en pasos y los ejecuta, llamando a herramientas, navegando, programando o componiendo
      flujos de trabajo de varios pasos en nombre del usuario o del operador. La salida es una acción realizada en el
      software, no contenido devuelto. Ejemplos: reservar una reunión, presentar una devolución, escalar un ticket,
      ejecutar un ciclo de campaña.
  - locale: fr
    value: >-
      Agit — décompose un objectif en étapes et les exécute, en appelant des outils, en naviguant, en planifiant ou en
      composant des flux de travail à plusieurs étapes pour le compte de l'utilisateur ou de l'opérateur. La sortie
      est une action réalisée dans un logiciel, pas un contenu renvoyé. Exemples : réserver une réunion, déposer une
      demande de remboursement, escalader un ticket, exécuter une boucle de campagne.
  - locale: pt
    value: >-
      Atua — decompõe um objetivo em passos e executa-os, chamando ferramentas, navegando, agendando ou compondo
      fluxos de trabalho de vários passos em nome do utilizador ou do operador. O resultado é uma ação realizada em
      software, não conteúdo devolvido. Exemplos: marcar uma reunião, submeter uma devolução, escalar um pedido,
      executar um ciclo de campanha.
citation:
