id: political_economic_harm
category_id: risks_mitigation
title:
  - locale: en
    value: Political & economic harm
  - locale: es
    value: Daño político y económico
  - locale: fr
    value: Préjudice politique et économique
  - locale: km
    value: គ្រោះថ្នាក់នយោបាយ និងសេដ្ឋកិច្ច
  - locale: pt
    value: Dano político e econômico
  - locale: tl
    value: Pinsalang pampulitika at pang-ekonomiya
description:
  - locale: en
    value: >-
      The risk that the AI system manipulates political discourse, interferes with elections, concentrates market
      power, or damages public institutions. This includes risks of synthetic media targeting voters, opaque
      ad-targeting, competitive distortion from monopoly access to data and compute, and erosion of institutional
      trust. Mitigations may include disclosure of synthetic content, antitrust attention to AI markets, audit access
      for regulators, and political-ad transparency requirements.
  - locale: es
    value: >-
      El riesgo de que el sistema de IA manipule el discurso político, interfiera con las elecciones, concentre poder
      de mercado o dañe a las instituciones públicas. Esto incluye riesgos de medios sintéticos dirigidos a votantes,
      segmentación opaca de anuncios, distorsión competitiva por acceso monopolístico a datos y cómputo, y erosión de
      la confianza institucional. Las medidas de mitigación pueden incluir divulgación del contenido sintético,
      atención antimonopolio a los mercados de IA, acceso de auditoría para reguladores y requisitos de transparencia
      en la publicidad política.
  - locale: fr
    value: >-
      Le risque que le système d'IA manipule le discours politique, interfère avec les élections, concentre le pouvoir
      de marché ou porte atteinte aux institutions publiques. Cela inclut les risques liés aux médias synthétiques
      ciblant les électeurs, au ciblage publicitaire opaque, à la distorsion concurrentielle due à l'accès
      monopolistique aux données et au calcul, et à l'érosion de la confiance institutionnelle. Les mesures
      d'atténuation peuvent inclure la divulgation des contenus synthétiques, l'attention antitrust portée aux marchés
      de l'IA, l'accès d'audit pour les régulateurs et des obligations de transparence pour les publicités politiques.
  - locale: km
    value: >-
      ហានិភ័យដែលប្រព័ន្ធ AI រៀបចំការសន្ទនានយោបាយ ជ្រៀតជ្រែកការបោះឆ្នោត ប្រមូលផ្តុំអំណាចទីផ្សារ
      ឬបំផ្លាញស្ថាប័នសាធារណៈ។ នេះរួមបញ្ចូលហានិភ័យនៃប្រព័ន្ធផ្សព្វផ្សាយសំយោគដែលផ្តោតទៅអ្នកបោះឆ្នោត
      ការផ្តោតការផ្សាយពាណិជ្ជកម្មស្រអាប់ ការបង្ខូចការប្រកួតប្រជែងដោយការចូលប្រើទិន្នន័យ និងគណនាដោយម៉ូណូប៉ូលី
      និងការកាត់បន្ថយទំនុកចិត្តស្ថាប័ន។ ការបន្ធូរបន្ថយអាចរួមមានការបង្ហាញមាតិកាសំយោគ
      ការយកចិត្តទុកដាក់ប្រឆាំងម៉ូណូប៉ូលីលើទីផ្សារ AI ការចូលប្រើសវនកម្មសម្រាប់និយតករ
      និងតម្រូវការតម្លាភាពនៃការផ្សាយពាណិជ្ជកម្មនយោបាយ។
  - locale: pt
    value: >-
      O risco de que o sistema de IA manipule o discurso político, interfira em eleições, concentre poder de mercado
      ou prejudique instituições públicas. Isso inclui riscos de mídia sintética dirigida a eleitores, segmentação
      opaca de anúncios, distorção competitiva por acesso monopolístico a dados e computação, e erosão da confiança
      institucional. As mitigações podem incluir divulgação de conteúdo sintético, atenção antitruste a mercados de
      IA, acesso de auditoria para reguladores e requisitos de transparência em publicidade política.
  - locale: tl
    value: >-
      Ang panganib na manipulahin ng AI system ang pampulitikang diskurso, makialam sa mga halalan, kumonsentra ng
      kapangyarihan sa merkado, o sirain ang mga pampublikong institusyon. Kabilang dito ang mga panganib ng synthetic
      media na nakatuon sa mga botante, opaque na ad-targeting, competitive distortion mula sa monopoly access sa
      data at compute, at pag-erode ng tiwala sa institusyon. Maaaring kabilang sa mga mitigasyon ang pagsisiwalat ng
      synthetic content, antitrust na atensyon sa mga merkado ng AI, audit access para sa mga regulator, at mga
      kinakailangan sa transparency ng political ads.
