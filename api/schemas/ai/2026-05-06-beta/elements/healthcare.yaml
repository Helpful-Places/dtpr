id: healthcare
category_id: purpose
title:
  - locale: en
    value: Healthcare
  - locale: fr
    value: Soins de santé
description:
  - locale: en
    value: >-
      Supports clinical care for individuals — for example, diagnosis assistance, treatment
      recommendations, patient triage, or health chatbots. Distinct from Environmental Health, which
      monitors the physical environment.
  - locale: fr
    value: >-
      Soutient les soins cliniques aux personnes — par exemple, aide au diagnostic, recommandations
      de traitement, triage des patients ou chatbots de santé. À distinguer de Santé
      environnementale, qui surveille l'environnement physique.
citation:
  - locale: en
    value: >-
      Clinical-AI governance under the WHO Ethics and Governance of Artificial Intelligence for
      Health (2021); medical-device AI regulated by the EU Medical Device Regulation (Regulation
      (EU) 2017/745) and In Vitro Diagnostic Regulation (Regulation (EU) 2017/746), with EU AI Act
      (Regulation (EU) 2024/1689) Annex II overlay for safety components.
  - locale: fr
    value: >-
      Gouvernance de l'IA clinique selon le rapport de l'OMS *Éthique et gouvernance de
      l'intelligence artificielle pour la santé* (2021) ; l'IA des dispositifs médicaux est encadrée
      par le Règlement (UE) 2017/745 et le Règlement (UE) 2017/746, avec la superposition de
      l'Annexe II du Règlement (UE) 2024/1689 (loi européenne sur l'IA).
symbol_id: healthcare
