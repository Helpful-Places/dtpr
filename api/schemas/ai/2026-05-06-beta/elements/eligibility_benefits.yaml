id: eligibility_benefits
category_id: purpose
title:
  - locale: en
    value: Eligibility & Public Benefits
  - locale: fr
    value: Éligibilité et prestations publiques
description:
  - locale: en
    value: >-
      Determines eligibility for, or distribution of, government benefits and essential public
      services — for example, welfare allocation, housing assistance, child-services risk scoring.
  - locale: fr
    value: >-
      Détermine l'éligibilité ou la distribution de prestations publiques et de services publics
      essentiels — par exemple, l'attribution d'aides sociales, l'aide au logement, l'évaluation du
      risque en protection de l'enfance.
citation:
  - locale: en
    value: >-
      AI used by or on behalf of public authorities to evaluate eligibility for essential public
      assistance benefits and services listed as Annex III high-risk under the EU AI Act (Regulation
      (EU) 2024/1689), Article 6(2) and Annex III §5(a). AIAAIC repository documents recurring harms
      in welfare-fraud detection and child-services scoring (e.g., SyRI, Robodebt).
  - locale: fr
    value: >-
      Les systèmes d'IA utilisés par les autorités publiques ou pour leur compte pour évaluer
      l'éligibilité aux prestations et services publics essentiels sont classés à haut risque à
      l'Annexe III du Règlement (UE) 2024/1689 (loi européenne sur l'IA), Article 6(2) et Annexe III
      §5(a).
symbol_id: eligibility_benefits
variables: []
