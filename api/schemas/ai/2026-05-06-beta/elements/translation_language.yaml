id: translation_language
category_id: purpose
title:
  - locale: en
    value: Translation & Language Access
  - locale: fr
    value: Traduction et accès linguistique
description:
  - locale: en
    value: >-
      Translates speech, text, or signs to make a place or service accessible across languages — for
      example, real-time interpretation at a service counter, multilingual signage.
  - locale: fr
    value: >-
      Traduit la parole, le texte ou la signalétique pour rendre un lieu ou un service accessible
      dans plusieurs langues — par exemple, l'interprétation en temps réel à un guichet, la
      signalétique multilingue.
citation:
  - locale: en
    value: >-
      Language access in public-facing services framed by the Council of Europe European Charter for
      Regional or Minority Languages (1992) and accessibility duties under the EU Web Accessibility
      Directive (Directive (EU) 2016/2102) and WCAG 2.2 multilingual support.
  - locale: fr
    value: >-
      L'accès linguistique aux services publics est encadré par la Charte européenne des langues
      régionales ou minoritaires du Conseil de l'Europe (1992) et les obligations d'accessibilité de
      la Directive (UE) 2016/2102 et des WCAG 2.2.
symbol_id: translation_language
variables: []
