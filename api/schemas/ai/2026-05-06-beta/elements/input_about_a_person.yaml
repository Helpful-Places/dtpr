id: input_about_a_person
category_id: input_dataset
title:
  - locale: en
    value: About a person
  - locale: fr
    value: À propos d'une personne
description:
  - locale: en
    value: >-
      Names, faces, voices, account IDs, or anything that identifies a specific individual. The AI
      takes in data that is about a person. Examples: a transit-card account ID, a stored profile, a
      name on a kiosk login.
  - locale: fr
    value: >-
      Noms, visages, voix, identifiants de compte ou tout élément identifiant une personne précise.
      L'IA reçoit des données qui concernent une personne. Exemples : l'identifiant d'une carte de
      transport, un profil enregistré, un nom saisi à la connexion d'une borne.
symbol_id: personal
