id: text-to-speech
category_id: ai__processing
title:
  - locale: en
    value: Text-to-Speech
  - locale: fr
    value: Synthèse vocale
description:
  - locale: en
    value: >-
      Technology that converts written text into spoken voice output. These systems analyze text and
      generate synthetic speech that mimics human voice patterns, intonations, and pronunciations.
      Text-to-Speech is commonly used in accessibility tools, virtual assistants, and automated
      customer service systems.
  - locale: fr
    value: >-
      Technologie qui convertit un texte écrit en une sortie vocale. Ces systèmes analysent le texte
      et génèrent une parole synthétique qui imite les modèles, les intonations et les
      prononciations de la voix humaine. La synthèse vocale est couramment utilisée dans les outils
      d'accessibilité, les assistants virtuels et les systèmes automatisés de service à la
      clientèle.
