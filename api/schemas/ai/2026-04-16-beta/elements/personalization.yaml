id: personalization
category_id: ai__decision
title:
  - locale: en
    value: Personalization
  - locale: fr
    value: Personnalisation
description:
  - locale: en
    value: >-
      A decision-making process where the AI/algorithm tailors content, recommendations, or services
      to specific individuals based on their preferences, behaviors, or characteristics. The system
      analyzes personal data to customize experiences. Examples include content recommendations,
      personalized learning paths, or targeted communications from public services.
  - locale: fr
    value: >-
      Processus décisionnel dans lequel l'IA/l'algorithme adapte le contenu, les recommandations ou
      les services à des personnes spécifiques en fonction de leurs préférences, de leurs
      comportements ou de leurs caractéristiques. Le système analyse les données personnelles pour
      personnaliser les expériences. Les exemples incluent des recommandations de contenu, des
      parcours d'apprentissage personnalisés ou des communications ciblées de la part des services
      publics.
