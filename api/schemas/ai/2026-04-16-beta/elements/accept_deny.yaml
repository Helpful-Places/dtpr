id: accept_deny
category_id: ai__decision
title:
  - locale: en
    value: Accept or deny
  - locale: fr
    value: Accepter ou refuser
description:
  - locale: en
    value: >-
      A binary decision-making process where the AI/algorithm evaluates information against specific
      criteria to produce a yes/no outcome. The system processes inputs through predetermined rules
      or learned patterns to determine if a request, application, or condition meets the required
      threshold for approval. Examples include civil service applications, school admissions, loan
      approvals, or benefit eligibility determinations.
  - locale: fr
    value: >-
      Processus décisionnel binaire dans lequel l'IA/l'algorithme évalue les informations par
      rapport à des critères spécifiques pour produire un résultat oui/non. Le système traite les
      entrées à l'aide de règles prédéterminées ou de modèles appris afin de déterminer si une
      requête, une demande ou une condition atteint le seuil requis pour être approuvée. Les
      exemples incluent les demandes de la fonction publique, les admissions dans les écoles, les
      approbations de prêts ou les déterminations d'éligibilité aux prestations.
