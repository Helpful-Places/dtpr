title:
  - locale: en
    value: Matching
  - locale: fr
    value: Correspondance
description:
  - locale: en
    value: >-
      A decision-making process where the AI/algorithm pairs entities (people, resources,
      opportunities) based on compatibility or optimal fit. The system evaluates multiple variables
      to determine the most appropriate connections. Examples include housing assistance placement,
      job applicant matching, or pairing service providers with community needs.
  - locale: fr
    value: >-
      Processus décisionnel dans lequel l'IA/l'algorithme associe des entités (personnes,
      ressources, opportunités) sur la base de la compatibilité ou de l'adéquation optimale. Le
      système évalue de multiples variables pour déterminer les connexions les plus appropriées. Les
      exemples incluent le placement de l'aide au logement, l'appariement des candidats à l'emploi
      ou l'appariement des prestataires de services avec les besoins de la communauté.
