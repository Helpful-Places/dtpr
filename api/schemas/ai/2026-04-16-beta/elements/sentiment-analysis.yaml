id: sentiment-analysis
category_id: ai__processing
title:
  - locale: en
    value: Sentiment Analysis
  - locale: fr
    value: Analyse des sentiments
description:
  - locale: en
    value: >-
      A technology that evaluates emotional tone and subjective information from text, images, or
      video. These systems analyze input data to determine whether the expressed sentiment is
      positive, negative, or neutral. In public spaces, sentiment analysis can be used to assess
      crowd mood, evaluate public response to services, or detect rising tensions. The technology
      typically works by identifying emotional indicators and comparing them against trained models
      of sentiment patterns.
  - locale: fr
    value: >-
      Technologie qui évalue le ton émotionnel et les informations subjectives d'un texte, d'une
      image ou d'une vidéo. Ces systèmes analysent les données d'entrée pour déterminer si le
      sentiment exprimé est positif, négatif ou neutre. Dans les espaces publics, l'analyse des
      sentiments peut être utilisée pour évaluer l'humeur de la foule, évaluer la réaction du public
      aux services ou détecter les tensions croissantes. La technologie fonctionne généralement en
      identifiant des indicateurs émotionnels et en les comparant à des modèles de sentiments
      formés.
