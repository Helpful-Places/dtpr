id: llm
category_id: ai__processing
title:
  - locale: en
    value: Large Language Model
  - locale: fr
    value: Grand modèle linguistique
description:
  - locale: en
    value: >-
      A type of AI system trained on vast amounts of text data that can understand, generate, and
      manipulate human language. These models can perform tasks like writing text, answering
      questions, summarizing content, and translating languages. They work by predicting what words
      are likely to come next in a sequence.
  - locale: fr
    value: >-
      Type de système d'IA formé sur de grandes quantités de données textuelles et capable de
      comprendre, de générer et de manipuler le langage humain. Ces modèles peuvent effectuer des
      tâches telles que rédiger des textes, répondre à des questions, résumer des contenus et
      traduire des langues. Ils fonctionnent en prédisant quels mots sont susceptibles de suivre
      dans une séquence.
