id: right_purpose_limitation
category_id: ai__rights
title:
  - locale: en
    value: Right to Purpose Limitation
  - locale: fr
    value: Limitation du droit à l'objet
description:
  - locale: en
    value: >-
      The right to ensure your data is only used for the specific purposes that were clearly stated
      when it was collected. This prevents organizations from using your data for new, unrelated
      purposes without your knowledge or consent. The data collector must specify and document the
      intended purposes before collection begins, and adhere to these limitations.
  - locale: fr
    value: >-
      Le droit de s'assurer que vos données ne sont utilisées qu'aux fins spécifiques qui ont été
      clairement énoncées lors de leur collecte. Cela empêche les organisations d'utiliser vos
      données à des fins nouvelles et sans rapport avec celles-ci, sans que vous en soyez informé ou
      que vous y consentiez. Le collecteur de données doit préciser et documenter les finalités
      prévues avant le début de la collecte et respecter ces limitations.
