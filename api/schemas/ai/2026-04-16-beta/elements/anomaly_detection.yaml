id: anomaly_detection
category_id: ai__decision
title:
  - locale: en
    value: Anomaly Detection
  - locale: fr
    value: Détection des anomalies
description:
  - locale: en
    value: >-
      A decision-making process where the AI/algorithm identifies unusual patterns or outliers that
      deviate from expected behavior. The system establishes a baseline of normal activity and flags
      significant deviations. Examples include fraud detection, infrastructure monitoring, or public
      health surveillance systems.
  - locale: fr
    value: >-
      Processus décisionnel dans lequel l'IA/l'algorithme identifie des modèles inhabituels ou des
      valeurs aberrantes qui s'écartent du comportement attendu. Le système établit une base
      d'activité normale et signale les écarts importants. Les exemples incluent la détection des
      fraudes, la surveillance des infrastructures ou les systèmes de surveillance de la santé
      publique.
