id: time-series-forecasting
category_id: ai__processing
title:
  - locale: en
    value: Time Series Forecasting
  - locale: fr
    value: Prévision des séries temporelles
description:
  - locale: en
    value: >-
      A method that analyzes historical data points collected over time to predict future values.
      This technology identifies patterns and trends in time-ordered data to make predictions about
      future events or behaviors. Common applications include weather forecasting, stock market
      prediction, demand planning, and resource management.
  - locale: fr
    value: >-
      Une méthode qui analyse les points de données historiques collectés au fil du temps pour
      prédire les valeurs futures. Cette technologie identifie des modèles et des tendances dans des
      données ordonnées dans le temps afin de faire des prédictions sur des événements ou des
      comportements futurs. Les applications courantes comprennent les prévisions météorologiques,
      les prévisions boursières, la planification de la demande et la gestion des ressources.
