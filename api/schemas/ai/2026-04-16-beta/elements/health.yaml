id: health
category_id: ai__purpose
title:
  - locale: en
    value: Health
  - locale: fr
    value: Santé
description:
  - locale: en
    value: >-
      Supports the measurement or monitoring of the aspects of the physical environment that impacts
      human health, such as radiation or air quality, or in specific contexts such as the workplace.
  - locale: fr
    value: >-
      Permet la mesure ou la surveillance des aspects de l'environnement physique qui ont un impact
      sur la santé humaine, comme les [rayonnements](https://fr.wikipedia.org/wiki/Radioprotection)
      ou la [qualité de l'air](https://fr.wikipedia.org/wiki/Pollution_de_l%27air), ou dans des
      contextes spécifiques comme le lieu de travail. Pour en savoir plus sur [la surveillance de
      l'environnement](https://fr.wikipedia.org/wiki/Observatoire_de_l%27environnement) et [la santé
      et la sécurité au travail](https://fr.wikipedia.org/wiki/Santé_et_sécurité_au_travail)
