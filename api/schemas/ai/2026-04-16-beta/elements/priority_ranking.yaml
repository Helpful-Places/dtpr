id: priority_ranking
category_id: ai__decision
title:
  - locale: en
    value: Priority ranking
  - locale: fr
    value: Classement des priorités
description:
  - locale: en
    value: >-
      A decision-making process where the AI/algorithm evaluates multiple items or requests and
      arranges them in order of importance or urgency based on specific criteria. The system assigns
      relative values to each item and sorts them accordingly. Examples include emergency response
      triage, customer service ticket ordering, maintenance request scheduling, or public project
      funding priorities.
  - locale: fr
    value: >-
      Processus décisionnel dans lequel l'IA/l'algorithme évalue plusieurs éléments ou demandes et
      les classe par ordre d'importance ou d'urgence sur la base de critères spécifiques. Le système
      attribue des valeurs relatives à chaque élément et les trie en conséquence. Les exemples
      incluent le triage des interventions d'urgence, la commande de tickets de service à la
      clientèle, la programmation des demandes de maintenance ou les priorités de financement des
      projets publics.
