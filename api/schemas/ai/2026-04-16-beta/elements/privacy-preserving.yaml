id: privacy-preserving
category_id: ai__processing
title:
  - locale: en
    value: Privacy-Preserving Transformation
  - locale: fr
    value: Transformation préservant la vie privée
description:
  - locale: en
    value: >-
      A technology that modifies data to remove or obscure personally identifiable information while
      preserving the underlying patterns needed for analysis. These systems apply techniques such as
      masking, tokenization, or aggregation to protect individual privacy. In public spaces,
      de-identification processing enables valuable insights from data collection without
      compromising personal information. The technology typically creates a barrier between raw
      collected data and the information used for decision-making.
  - locale: fr
    value: >-
      Technologie qui modifie les données afin de supprimer ou d'obscurcir les informations
      personnellement identifiables tout en préservant les modèles sous-jacents nécessaires à
      l'analyse. Ces systèmes appliquent des techniques telles que le masquage, la symbolisation ou
      l'agrégation pour protéger la vie privée des individus. Dans les espaces publics, le
      traitement de dépersonnalisation permet d'obtenir des informations précieuses à partir de la
      collecte de données sans compromettre les informations personnelles. La technologie crée
      généralement une barrière entre les données brutes collectées et les informations utilisées
      pour la prise de décision.
