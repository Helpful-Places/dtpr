id: right_contest
category_id: ai__rights
title:
  - locale: en
    value: Right to Contest
  - locale: fr
    value: Droit de contestation
description:
  - locale: en
    value: >-
      The right to challenge decisions made by an AI system that affect you, particularly when these
      decisions have legal or similarly significant effects. This includes the right to request
      human review of automated decisions, provide additional information, express your point of
      view, and have the decision reconsidered based on your input.
  - locale: fr
    value: >-
      Le droit de contester les décisions prises par un système d'IA qui vous concernent, en
      particulier lorsque ces décisions ont des effets juridiques ou des effets similaires
      importants. Cela inclut le droit de demander un examen humain des décisions automatisées, de
      fournir des informations supplémentaires, d'exprimer votre point de vue et d'obtenir que la
      décision soit réexaminée sur la base de votre contribution.
