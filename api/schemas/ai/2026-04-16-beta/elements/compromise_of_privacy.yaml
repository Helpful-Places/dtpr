id: compromise_of_privacy
category_id: ai__risks_mitigation
title:
  - locale: en
    value: Compromise of privacy
  - locale: fr
    value: Compromission de la vie privée
description:
  - locale: en
    value: >-
      The risk that the AI system could access, expose, or deduce private information about
      individuals without their consent. This includes risks of data breaches, misuse of collected
      data, or the system's ability to infer sensitive characteristics from seemingly non-sensitive
      inputs. Mitigations may include data minimization practices, robust security measures,
      differential privacy techniques, and rigorous access controls.
  - locale: fr
    value: >-
      Le risque que le système d'IA accède, expose ou déduise des informations privées sur des
      personnes sans leur consentement. Il s'agit notamment des risques de violation des données,
      d'utilisation abusive des données collectées ou de la capacité du système à déduire des
      caractéristiques sensibles à partir d'entrées apparemment non sensibles. Les mesures
      d'atténuation peuvent inclure des pratiques de minimisation des données, des mesures de
      sécurité robustes, des techniques de protection différentielle de la vie privée et des
      contrôles d'accès rigoureux.
