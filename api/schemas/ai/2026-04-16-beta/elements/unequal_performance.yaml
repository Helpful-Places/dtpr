id: unequal_performance
category_id: ai__risks_mitigation
title:
  - locale: en
    value: Unequal performance across groups
  - locale: fr
    value: Des performances inégales entre les groupes
description:
  - locale: en
    value: >-
      The risk that the AI system performs differently (typically worse) for certain demographic
      groups based on characteristics such as race, gender, age, disability status, or socioeconomic
      background. This can lead to biased or unfair outcomes that disproportionately impact
      vulnerable communities. Mitigations may include diverse training data, routine fairness
      audits, and regular performance monitoring across different demographic groups.
  - locale: fr
    value: >-
      Le risque que le système d'IA fonctionne différemment (généralement moins bien) pour certains
      groupes démographiques sur la base de caractéristiques telles que la race, le sexe, l'âge, le
      statut de handicapé ou le contexte socio-économique. Cela peut conduire à des résultats
      biaisés ou injustes qui ont un impact disproportionné sur les communautés vulnérables. Les
      mesures d'atténuation peuvent inclure des données de formation diversifiées, des audits
      d'équité de routine et un contrôle régulier des performances au sein de différents groupes
      démographiques.
