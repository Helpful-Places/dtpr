id: right_algorithmic_transparency
category_id: ai__rights
title:
  - locale: en
    value: Right to Algorithmic Transparency
  - locale: fr
    value: Droit à la transparence algorithmique
description:
  - locale: en
    value: >-
      The right to understand how an AI system makes decisions that affect you, including meaningful
      information about the logic involved, the significance of the processing, and the likely
      consequences. This information should be provided in clear, plain language that allows you to
      understand how the system works and how it arrived at a particular decision.
  - locale: fr
    value: >-
      Le droit de comprendre comment un système d'IA prend des décisions qui vous affectent, y
      compris des informations significatives sur la logique impliquée, la signification du
      traitement et les conséquences probables. Ces informations doivent être fournies dans un
      langage clair et simple qui vous permette de comprendre comment le système fonctionne et
      comment il est parvenu à une décision particulière.
