id: output_dataset
name:
  - locale: en
    value: Output Dataset
  - locale: fr
    value: Ensemble de données de sortie
description:
  - locale: en
    value: >-
      The output data this deployed system produces when it operates — decisions, content, and
      actions.
  - locale: fr
    value: >-
      Les données de sortie que ce système déployé produit lorsqu’il fonctionne — décisions,
      contenu et actions.
prompt:
  - locale: en
    value: What does this AI system produce?
  - locale: fr
    value: Que produit ce système d’IA ?
required: false
order: 9
datachain_type: ai
shape: circle
element_context:
  id: pii
  name:
    - locale: en
      value: Personal Information
    - locale: fr
      value: Informations personnelles
  description:
    - locale: en
      value: >-
        How identifiable the data is when this system produces it. The element name says what the
        output is about; this colour says how directly it identifies a person.
    - locale: fr
      value: >-
        À quel point les données sont identifiables lorsque ce système les produit. Le nom de
        l’élément indique de quoi parle la sortie ; cette couleur indique dans quelle mesure elle
        identifie directement une personne.
  values:
    - id: de_identified
      name:
        - locale: en
          value: Anonymized data
        - locale: fr
          value: Données anonymisées
      description:
        - locale: en
          value: >-
            Output about people with the link to who is broken. Stripped of identifiers, blurred,
            aggregated, or noised so the result can’t reasonably be tied back to an individual.
        - locale: fr
          value: >-
            Sortie concernant des personnes dont le lien à l’identité est rompu. Privée
            d’identifiants, floutée, agrégée ou bruitée pour que le résultat ne puisse pas
            raisonnablement être relié à un individu.
      color: "#4A90D9"
    - id: pseudonymous
      name:
        - locale: en
          value: Pseudonymous data
        - locale: fr
          value: Données pseudonymes
      description:
        - locale: en
          value: >-
            The output is labelled with a token (hash, ID, template) that lets this system tie the
            result to the same person across events without revealing a name. Reidentification is
            possible with extra information.
        - locale: fr
          value: >-
            La sortie est étiquetée avec un jeton (hachage, identifiant, modèle) qui permet à ce
            système de relier le résultat à la même personne d’un événement à l’autre sans révéler
            de nom. La réidentification est possible avec des informations supplémentaires.
      color: "#9575CD"
    - id: identifiable
      name:
        - locale: en
          value: Identifiable data
        - locale: fr
          value: Données identifiables
      description:
        - locale: en
          value: >-
            The output names a person directly (name, address, account, recognisable face or voice,
            plate) or carries a token this system resolves to legal identity in the same step.
        - locale: fr
          value: >-
            La sortie nomme une personne directement (nom, adresse, compte, visage ou voix
            reconnaissable, plaque) ou porte un jeton que ce système résout en identité légale dans
            la même étape.
      color: "#FFD700"
element_variables:
  - id: additional_description
    label:
      - locale: en
        value: Description
      - locale: fr
        value: Description
    required: true
