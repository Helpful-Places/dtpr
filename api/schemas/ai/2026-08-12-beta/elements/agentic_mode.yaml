id: agentic_mode
category_id: functional_modes
title:
  - locale: en
    value: Acting (Agentic AI)
  - locale: fr
    value: Agir (IA agentique)
description:
  - locale: en
    value: >-
      Acts — plans a goal into steps and carries them out, calling tools, browsing, scheduling, or
      composing multi-step workflows on the user's or operator's behalf. The output is an action
      taken in software, not a piece of content returned. Examples: booking a meeting, filing a
      return, escalating a ticket, running a campaign loop.
  - locale: fr
    value: >-
      Agit — décompose un objectif en étapes et les exécute, en appelant des outils, en naviguant,
      en planifiant ou en composant des flux de travail à plusieurs étapes pour le compte de
      l'utilisateur ou de l'opérateur. La sortie est une action réalisée dans un logiciel, pas un
      contenu renvoyé. Exemples : réserver une réunion, déposer une demande de remboursement,
      escalader un ticket, exécuter une boucle de campagne.
symbol_id: mode_agentic
