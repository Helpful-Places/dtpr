description:
  - locale: en
    value: The runtime output — the live data this deployed system produces when it operates, including decisions it makes, content it generates, and actions it triggers.
  - locale: es
    value: La salida en tiempo de ejecución — los datos en vivo que este sistema implementado produce cuando opera, incluyendo decisiones que toma, contenido que genera y acciones que activa.
  - locale: fr
    value: La sortie d’exécution — les données en direct que ce système déployé produit lorsqu’il fonctionne, y compris les décisions qu’il prend, le contenu qu’il génère et les actions qu’il déclenche.
  - locale: km
    value: លទ្ធផលនៅពេលដំណើរការ — ទិន្នន័យផ្ទាល់ដែលប្រព័ន្ធដាក់ពង្រាយនេះផលិតនៅពេលវាដំណើរការ រួមទាំងការសម្រេចចិត្តដែលវាធ្វើ មាតិកាដែលវាបង្កើត និងសកម្មភាពដែលវាបង្ក។
  - locale: pt
    value: A saída em tempo de execução — os dados ao vivo que este sistema implantado produz ao operar, incluindo decisões que toma, conteúdo que gera e ações que aciona.
  - locale: tl
    value: Ang runtime output — ang live na data na ginagawa ng naka-deploy na system kapag tumatakbo, kasama ang mga desisyong ginagawa nito, nilalamang nililikha nito, at mga aksyong tinatawag nito.
