id: output_operational_data
category_id: output_dataset
title:
  - locale: en
    value: Operational data
  - locale: fr
    value: Données opérationnelles
description:
  - locale: en
    value: >-
      The AI produces administrative output — schedules, routes, occupancy estimates, budget
      allocations, or other records about how a place or service runs. Not about any one person.
      Examples: an optimized trash-collection route, a school occupancy projection, a recommended
      budget allocation for next quarter.
  - locale: fr
    value: >-
      L'IA produit une sortie administrative : horaires, itinéraires, estimations d'occupation,
      allocations budgétaires ou autres registres sur le fonctionnement d'un lieu ou d'un service.
      Aucune personne en particulier n'est concernée. Exemples : une tournée de collecte des ordures
      optimisée, une projection d'occupation scolaire, une allocation budgétaire recommandée pour le
      trimestre suivant.
