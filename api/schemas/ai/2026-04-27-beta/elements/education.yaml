id: education
category_id: purpose
title:
  - locale: en
    value: Education & Learning
  - locale: fr
    value: Éducation et apprentissage
description:
  - locale: en
    value: >-
      Supports teaching, learning, assessment, or educational guidance — for example, tutoring
      assistants, automated grading, or library and museum recommenders.
  - locale: fr
    value: >-
      Soutient l'enseignement, l'apprentissage, l'évaluation ou l'orientation pédagogique — par
      exemple, des assistants de tutorat, la notation automatisée, ou des recommandations de
      bibliothèques et musées.
citation:
  - locale: en
    value: >-
      Education and vocational training listed as Annex III high-risk under the EU AI Act
      (Regulation (EU) 2024/1689), Article 6(2) and Annex III §3 — covering admission, evaluation of
      learning outcomes, and detection of prohibited behaviour during testing.
  - locale: fr
    value: >-
      L'éducation et la formation professionnelle sont classées à haut risque à l'Annexe III du
      Règlement (UE) 2024/1689 (loi européenne sur l'IA), Article 6(2) et Annexe III §3.
