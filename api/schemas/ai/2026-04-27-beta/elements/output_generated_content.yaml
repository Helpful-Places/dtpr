id: output_generated_content
category_id: output_dataset
title:
  - locale: en
    value: Generated content
  - locale: fr
    value: Contenu généré
description:
  - locale: en
    value: >-
      The AI produces new content — text, images, audio, or video that did not exist before.
      Examples: an LLM-written service advisory shown on a sign, a synthesized voice announcement
      played over a public-address system, a generated illustration on a digital kiosk.
  - locale: fr
    value: >-
      L'IA produit du contenu nouveau : du texte, des images, de l'audio ou de la vidéo qui
      n'existaient pas auparavant. Exemples : un avis de service rédigé par un LLM affiché sur un
      panneau, une annonce vocale synthétisée diffusée par un système de sonorisation, une
      illustration générée sur une borne numérique.
citation:
  - locale: en
    value: >-
      Output class "content" from EU AI Act Article 3(1); synthetic-content disclosure obligations
      under Art. 50; provenance under NIST AI 100-4 and C2PA.
symbol_id: generated_content
variables: []
