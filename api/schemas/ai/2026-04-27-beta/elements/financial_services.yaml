id: financial_services
category_id: purpose
title:
  - locale: en
    value: Financial Services
  - locale: fr
    value: Services financiers
description:
  - locale: en
    value: >-
      Supports lending, insurance, fraud detection, or other financial decisions about people — for
      example, credit scoring, insurance underwriting, transaction-fraud flagging.
  - locale: fr
    value: >-
      Soutient le crédit, l'assurance, la détection de fraude ou d'autres décisions financières
      concernant des personnes — par exemple, l'évaluation du crédit, la souscription d'assurance,
      le signalement de fraude transactionnelle.
citation:
  - locale: en
    value: >-
      Credit-scoring of natural persons and risk assessment / pricing in life and health insurance
      listed as Annex III high-risk under the EU AI Act (Regulation (EU) 2024/1689), Article 6(2)
      and Annex III §5(b) and §5(c).
  - locale: fr
    value: >-
      L'évaluation du crédit des personnes physiques et l'évaluation du risque et la tarification en
      assurance vie et santé sont classées à haut risque à l'Annexe III du Règlement (UE) 2024/1689
      (loi européenne sur l'IA), Article 6(2) et Annexe III §5(b) et §5(c).
