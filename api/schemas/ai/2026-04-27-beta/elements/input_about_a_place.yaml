id: input_about_a_place
category_id: input_dataset
title:
  - locale: en
    value: About a place
  - locale: es
    value: Sobre un lugar
  - locale: fr
    value: À propos d'un lieu
  - locale: pt
    value: Sobre um lugar
description:
  - locale: en
    value: >-
      Locations, routes, surroundings, or floor plans. The AI takes in data describing where something is. Examples:
      GPS coordinates from a phone, foot-traffic counts on a sidewalk, a map of building corridors.
  - locale: es
    value: >-
      Ubicaciones, rutas, entornos o planos. La IA recibe datos que describen dónde está algo. Ejemplos: coordenadas
      GPS de un teléfono, conteos de peatones en una acera, un mapa de corredores de un edificio.
  - locale: fr
    value: >-
      Lieux, itinéraires, environnement ou plans. L'IA reçoit des données décrivant l'endroit où se trouve quelque
      chose. Exemples : des coordonnées GPS d'un téléphone, des comptages de passages piétons, le plan des couloirs
      d'un bâtiment.
  - locale: pt
    value: >-
      Localizações, rotas, ambientes ou plantas. A IA recebe dados que descrevem onde está algo. Exemplos: coordenadas
      GPS de um telemóvel, contagens de peões num passeio, um mapa dos corredores de um edifício.
