id: marketing_personalization
category_id: purpose
title:
  - locale: en
    value: Marketing & Personalization
  - locale: fr
    value: Marketing et personnalisation
description:
  - locale: en
    value: >-
      Targets advertising, personalizes recommendations, or profiles audiences for marketing — for
      example, in-store loyalty offers, personalized signage, behavioural ad targeting.
  - locale: fr
    value: >-
      Cible la publicité, personnalise les recommandations ou profile les audiences à des fins
      marketing — par exemple, offres de fidélité en magasin, signalétique personnalisée, ciblage
      publicitaire comportemental.
citation:
  - locale: en
    value: >-
      Profiling and automated decisioning for marketing regulated under GDPR (Regulation (EU)
      2016/679), Article 22 (automated individual decision-making, including profiling);
      transparency duties for online platform advertising under EU Digital Services Act (Regulation
      (EU) 2022/2065), Articles 26 and 39.
  - locale: fr
    value: >-
      Le profilage et la prise de décision automatisée à des fins marketing sont encadrés par le
      RGPD (Règlement (UE) 2016/679), Article 22 ; obligations de transparence pour la publicité en
      ligne au titre du Règlement sur les services numériques (Règlement (UE) 2022/2065), Articles
      26 et 39.
symbol_id: marketing_personalization
variables: []
