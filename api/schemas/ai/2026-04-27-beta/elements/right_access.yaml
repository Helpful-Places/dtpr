id: right_access
category_id: rights
title:
  - locale: en
    value: Right to Access
  - locale: fr
    value: Droit d'accès
description:
  - locale: en
    value: >-
      The right to request and receive information about what personal data an AI system has
      collected about you, how this data is being used, and what decisions have been made using this
      information. This includes the right to obtain a copy of your data in a readable format.
  - locale: fr
    value: >-
      Le droit de demander et de recevoir des informations sur les données à caractère personnel
      qu'un système d'IA a collectées à votre sujet, sur la manière dont ces données sont utilisées
      et sur les décisions qui ont été prises sur la base de ces informations. Cela inclut le droit
      d'obtenir une copie de vos données dans un format lisible.
