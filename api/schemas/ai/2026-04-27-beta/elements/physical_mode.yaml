id: physical_mode
category_id: functional_modes
title:
  - locale: en
    value: Physical — moves
  - locale: es
    value: Físico — mueve
  - locale: fr
    value: Physique — déplace
  - locale: pt
    value: Físico — movimenta
description:
  - locale: en
    value: >-
      Moves — acts on the physical environment. The system drives motors, valves, signals, or other actuators and
      changes something in the world. Examples: steering a robot, changing a traffic-signal phase, opening a gate,
      adjusting an HVAC valve, releasing a parking-garage barrier.
  - locale: es
    value: >-
      Mueve — actúa sobre el entorno físico. El sistema acciona motores, válvulas, señales u otros actuadores y
      cambia algo en el mundo. Ejemplos: dirigir un robot, cambiar la fase de un semáforo, abrir una puerta, ajustar
      una válvula de climatización, levantar la barrera de un aparcamiento.
  - locale: fr
    value: >-
      Déplace — agit sur l'environnement physique. Le système commande des moteurs, des vannes, des signaux ou
      d'autres actionneurs et modifie quelque chose dans le monde. Exemples : piloter un robot, changer la phase d'un
      feu de circulation, ouvrir un portail, régler une vanne CVC, lever une barrière de parking.
  - locale: pt
    value: >-
      Movimenta — atua sobre o ambiente físico. O sistema aciona motores, válvulas, sinais ou outros atuadores e
      altera algo no mundo. Exemplos: conduzir um robô, mudar a fase de um semáforo, abrir um portão, ajustar uma
      válvula de AVAC, levantar uma cancela de estacionamento.
citation:
  - locale: en
    value: >-
      Verb framing ("moves") and the six-mode partition adapted from Narain Jashanmal, *AI Taxonomy — An Operational
      Framework for Precision in AI Discourse*, v1.1, January 2026. https://dropleaf.app/d/AlXez8scbd
  - locale: es
    value: >-
      El verbo orientador ("mueve") y la partición en seis modos están adaptados de Narain Jashanmal, *AI Taxonomy —
      An Operational Framework for Precision in AI Discourse*, v1.1, enero de 2026. https://dropleaf.app/d/AlXez8scbd
  - locale: fr
    value: >-
      Le verbe-cadre (« déplace ») et la partition en six modes sont adaptés de Narain Jashanmal, *AI Taxonomy — An
      Operational Framework for Precision in AI Discourse*, v1.1, janvier 2026. https://dropleaf.app/d/AlXez8scbd
  - locale: pt
    value: >-
      O verbo-âncora ("movimenta") e a partição em seis modos foram adaptados de Narain Jashanmal, *AI Taxonomy — An
      Operational Framework for Precision in AI Discourse*, v1.1, janeiro de 2026. https://dropleaf.app/d/AlXez8scbd
