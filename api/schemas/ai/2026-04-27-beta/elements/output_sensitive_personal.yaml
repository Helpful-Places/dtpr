id: output_sensitive_personal
category_id: output_dataset
title:
  - locale: en
    value: Sensitive personal information
  - locale: es
    value: Información personal sensible
  - locale: fr
    value: Informations personnelles sensibles
  - locale: pt
    value: Informação pessoal sensível
description:
  - locale: en
    value: >-
      The AI produces output about health, finances, beliefs, sexuality, immigration status, or other categories
      that carry legal and social risk. Examples: a triage priority assigned at a clinic, an eligibility result sent
      to a benefits portal, an inferred protected attribute exported downstream.
  - locale: es
    value: >-
      La IA produce una salida sobre salud, finanzas, creencias, sexualidad, situación migratoria u otras categorías
      con riesgo legal y social. Ejemplos: una prioridad de triaje asignada en una clínica, un resultado de
      elegibilidad enviado a un portal de prestaciones, un atributo protegido inferido y exportado.
  - locale: fr
    value: >-
      L'IA produit une sortie portant sur la santé, les finances, les convictions, la sexualité, la situation
      migratoire ou d'autres catégories porteuses de risque légal et social. Exemples : une priorité de triage
      attribuée en clinique, un résultat d'éligibilité envoyé à un portail de prestations, un attribut protégé
      inféré et exporté.
  - locale: pt
    value: >-
      A IA produz uma saída sobre saúde, finanças, crenças, sexualidade, situação migratória ou outras categorias com
      risco legal e social. Exemplos: uma prioridade de triagem atribuída numa clínica, um resultado de elegibilidade
      enviado para um portal de benefícios, um atributo protegido inferido e exportado.
citation:
  - locale: en
    value: >-
      Categories drawn from GDPR Article 9 "special categories of personal data" and Apple App Store privacy
      "Sensitive Info" / "Health & Fitness" / "Financial Info" labels.
symbol_id: sensitive_personal
variables: []
