  - locale: es
    value: >-
      El verbo orientador ("percibe") y la partición en seis modos están adaptados de Narain Jashanmal, *AI Taxonomy —
      An Operational Framework for Precision in AI Discourse*, v1.1, enero de 2026. https://dropleaf.app/d/AlXez8scbd
  - locale: fr
    value: >-
      Le verbe-cadre (« perçoit ») et la partition en six modes sont adaptés de Narain Jashanmal, *AI Taxonomy — An
      Operational Framework for Precision in AI Discourse*, v1.1, janvier 2026. https://dropleaf.app/d/AlXez8scbd
  - locale: pt
    value: >-
      O verbo-âncora ("perceciona") e a partição em seis modos foram adaptados de Narain Jashanmal, *AI Taxonomy — An
