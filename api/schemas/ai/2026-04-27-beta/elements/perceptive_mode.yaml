id: perceptive_mode
category_id: functional_modes
title:
  - locale: en
    value: Perceptive — senses
  - locale: fr
    value: Perceptif — perçoit
description:
  - locale: en
    value: >-
      Senses — turns raw camera, microphone, or scanned-document signals into structured detections,
      transcriptions, or extracted fields. The system reads pixels, audio, or document images and
      returns things the rest of the pipeline can use. Examples: detecting a vehicle in a camera
      frame, transcribing a spoken sentence, reading the fields off a paper form.
  - locale: fr
    value: >-
      Perçoit — transforme des signaux bruts de caméra, de microphone ou de documents numérisés en
      détections structurées, en transcriptions ou en champs extraits. Le système lit des pixels, de
      l'audio ou des images de documents et renvoie des éléments utilisables par la suite du
      pipeline. Exemples : détecter un véhicule dans une image, transcrire une phrase parlée, lire
      les champs d'un formulaire papier.
citation:
  - locale: en
    value: >-
      Verb framing ("senses") and the six-mode partition adapted from Narain Jashanmal, *AI Taxonomy
      — An Operational Framework for Precision in AI Discourse*, v1.1, January 2026.
      https://dropleaf.app/d/AlXez8scbd
  - locale: fr
    value: >-
      Le verbe-cadre (« perçoit ») et la partition en six modes sont adaptés de Narain Jashanmal,
      *AI Taxonomy — An Operational Framework for Precision in AI Discourse*, v1.1, janvier 2026.
      https://dropleaf.app/d/AlXez8scbd
