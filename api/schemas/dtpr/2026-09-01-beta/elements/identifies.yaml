id: identifies
category_id: action
title:
  - locale: en
    value: Identifies
  - locale: fr
    value: Identifie
  - locale: es
    value: Identifica
  - locale: pt
    value: Identifica
  - locale: fil
    value: Kumikilala
  - locale: km
    value: កំណត់អត្តសញ្ញាណ
  - locale: vi
    value: Nhận diện
  - locale: zh-Hans
    value: 识别
  - locale: zh-Hant
