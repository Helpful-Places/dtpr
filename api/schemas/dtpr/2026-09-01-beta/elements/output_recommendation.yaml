id: output_recommendation
category_id: output_dataset
title:
  - locale: en
    value: A recommendation or prediction
  - locale: fr
    value: Une recommandation ou prédiction
description:
  - locale: en
    value: >-
      The AI produces an advisory output — a suggestion, forecast, risk score, or ranking. Distinct
      from a binding decision because it advises rather than determines. Examples: a signage system
      suggesting an alternate route based on predicted crowding, a forecasted demand curve for
      tomorrow, a recommended next destination on a kiosk.
  - locale: fr
    value: >-
      L'IA produit une sortie consultative : une suggestion, prévision, score de risque ou
      classement. Distincte d'une décision contraignante parce qu'elle conseille sans trancher.
      Exemples : un système de signalisation proposant un itinéraire alternatif d'après l'affluence
      prévue, une courbe de demande prévue pour demain, une destination suggérée sur une borne.
sources:
  - type: regulation
    title: EU AI Act Article 3(1) — output classes "predictions, recommendations"
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    citation: Regulation (EU) 2024/1689, Article 3(1).
symbol_id: dm_priority-ranking_out
