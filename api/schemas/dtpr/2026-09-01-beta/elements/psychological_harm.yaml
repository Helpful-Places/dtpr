description:
  - locale: en
    value: >-
      The risk that this system causes emotional or mental-health impairment, directly or
      indirectly. This includes risks from addictive feedback loops, distress caused by
      surveillance, harassment via generated content, and anxiety from automated denials.
      Mitigations may include content warnings, well-being safeguards, age-appropriate design,
      accessible support channels, and rate limits on engagement-maximizing behavior.
  - locale: fr
    value: >-
      Le risque que ce système cause une atteinte émotionnelle ou à la santé mentale, directement ou
      indirectement. Cela inclut les risques liés à des boucles de rétroaction addictives, à la
      détresse causée par la surveillance, au harcèlement via du contenu généré et à l'anxiété liée
      aux refus automatisés. Les mesures d'atténuation peuvent inclure des avertissements de
      contenu, des garde-fous pour le bien-être, une conception adaptée à l'âge, des canaux
      d'assistance accessibles et des limites sur les comportements qui maximisent l'engagement.
  - locale: es
    value: >-
      El riesgo de que este sistema cause, directa o indirectamente, un deterioro emocional o de la
      salud mental. Esto incluye riesgos derivados de ciclos de retroalimentación adictivos, la
      angustia causada por la vigilancia, el acoso mediante contenido generado y la ansiedad por
      rechazos automatizados. Las medidas de mitigación pueden incluir advertencias de contenido,
      protecciones del bienestar, un diseño adecuado para cada edad, canales de apoyo accesibles y
      límites a los comportamientos que buscan maximizar la interacción.
  - locale: pt
    value: >-
      O risco de que este sistema cause prejuízo emocional ou à saúde mental, de forma direta ou
      indireta. Isso inclui riscos decorrentes de ciclos de estímulo viciantes, de sofrimento
      causado por vigilância, de assédio por meio de conteúdo gerado e de ansiedade provocada por
      recusas automatizadas. As medidas de mitigação podem incluir avisos de conteúdo, salvaguardas
      de bem-estar, design adequado à idade, canais de apoio acessíveis e limites de frequência para
      comportamentos que maximizam o engajamento.
  - locale: fil
    value: >-
      Ang panganib na magdulot ang sistemang ito ng pinsala sa damdamin o sa kalusugan ng isip,
      direkta man o hindi. Kasama rito ang mga panganib mula sa nakaaadik na feedback loop,
      pagkabagabag dahil sa pagmamanman, panliligalig gamit ang nilikhang nilalaman, at pagkabalisa
      dahil sa awtomatikong pagtanggi. Maaaring kabilang sa mga hakbang para mabawasan ang panganib
      ang mga babala sa nilalaman, pananggalang para sa kapakanan ng tao, disenyong angkop sa edad,
      madaling maabot na mapaghihingan ng tulong, at limitasyon sa mga kilos ng sistema na
      nilalayong pahabain nang husto ang paggamit ng tao.
  - locale: km
    value: >-
      ហានិភ័យដែលប្រព័ន្ធនេះបង្កការខូចខាតដល់អារម្មណ៍ ឬសុខភាពផ្លូវចិត្ត ដោយផ្ទាល់ ឬដោយប្រយោល។
      នេះរួមមានហានិភ័យពីវដ្តប្រតិកម្មដែលធ្វើឱ្យញៀន, ភាពតានតឹងដែលបង្កដោយការឃ្លាំមើល,
      ការយាយីតាមរយៈខ្លឹមសារដែលបង្កើតឡើង, និងការថប់បារម្ភពីការបដិសេធដោយស្វ័យប្រវត្តិ។
      វិធានការកាត់បន្ថយអាចរួមមាន ការព្រមានអំពីខ្លឹមសារ, វិធានការការពារសុខុមាលភាព,
      ការរចនាសមស្របតាមអាយុ, មធ្យោបាយសុំជំនួយដែលងាយចូលប្រើ,
      និងការដាក់កម្រិតលើឥរិយាបថដែលជំរុញឱ្យមានការចូលរួមអតិបរមា។
  - locale: vi
    value: >-
      Rủi ro hệ thống này gây tổn thương về cảm xúc hoặc sức khỏe tâm thần, một cách trực tiếp hoặc
      gián tiếp. Điều này bao gồm rủi ro từ các vòng lặp phản hồi gây nghiện, sự căng thẳng do bị
      theo dõi, quấy rối bằng nội dung do AI tạo ra, và lo âu vì bị từ chối tự động. Biện pháp giảm
      thiểu có thể gồm cảnh báo về nội dung, cơ chế bảo vệ sức khỏe tinh thần, thiết kế phù hợp với
      lứa tuổi, kênh hỗ trợ dễ tiếp cận, và giới hạn đối với hành vi nhằm tối đa hóa mức độ tương
      tác.
  - locale: zh-Hans
    value: >-
      本系统直接或间接造成情绪或心理健康受损的风险。这包括令人成瘾的反馈循环、监控引起的困扰、利用生成内容实施的骚扰，以及被自动拒绝所带来的焦虑等风险。缓解措施可包括内容警示、身心健康保障措施、适龄设计、便于使用的求助渠道，以及对追求用户黏性最大化的行为设置频率限制。
  - locale: zh-Hant
    value: >-
      這個系統直接或間接造成情緒或心理健康受損的風險。包括令人成癮的回饋循環、監控造成的困擾、利用生成內容進行的騷擾，以及遭自動化系統拒絕所引發的焦慮等風險。因應措施可包括內容警示、身心健康保護機制、適齡設計、容易取得的支援管道，以及對追求最高使用黏著度的行為設限。
  - locale: nl
    value: >-
      Het risico dat dit systeem direct of indirect emotionele schade of schade aan de geestelijke
      gezondheid veroorzaakt. Hieronder vallen risico's door verslavende feedbacklussen, stress door
      surveillance, intimidatie via gegenereerde content en angst door geautomatiseerde afwijzingen.
      Mogelijke maatregelen zijn waarschuwingen bij content, waarborgen voor welzijn, ontwerp dat
      past bij de leeftijd, toegankelijke hulpkanalen en grenzen aan gedrag dat is gericht op zo
      veel mogelijk gebruik.
  - locale: de
    value: >-
      Das Risiko, dass dieses System direkt oder indirekt das seelische Wohlbefinden oder die
      psychische Gesundheit beeinträchtigt. Dazu gehören Risiken durch süchtig machende
      Rückkopplungsschleifen, Belastung durch Überwachung, Belästigung durch generierte Inhalte und
      Ängste durch automatisierte Ablehnungen. Mögliche Gegenmaßnahmen sind Inhaltswarnungen,
      Schutzvorkehrungen für das Wohlbefinden, altersgerechte Gestaltung, leicht erreichbare
      Hilfsangebote und Begrenzungen für Verhalten, das auf möglichst intensive Nutzung abzielt.
