id: positioning_location
category_id: collection
title:
  - locale: en
    value: Positioning & Location
  - locale: fr
    value: Positionnement et localisation
description:
  - locale: en
    value: >-
      Determines where something is — GPS receivers in vehicles or apps, Bluetooth beacons, or
      indoor positioning systems. Produces location traces, one of the most revealing kinds of
      personal data when tied to a person or their device.
  - locale: fr
    value: >-
      Détermine où se trouve quelque chose — récepteurs GPS dans les véhicules ou les applis,
      balises Bluetooth ou systèmes de positionnement intérieur. Produit des traces de
      localisation, l'une des données personnelles les plus révélatrices lorsqu'elle est liée à une
      personne ou à son appareil.
symbol_id: map_pin
