description:
  - locale: en
    value: >-
      Determines where something is — GPS receivers in vehicles or apps, Bluetooth beacons, or
      indoor positioning systems. Produces location traces, one of the most revealing kinds of
      personal data when tied to a person or their device.
  - locale: fr
    value: >-
      Détermine où se trouve quelque chose — récepteurs GPS dans les véhicules ou les applis,
      balises Bluetooth ou systèmes de positionnement intérieur. Produit des traces de
      localisation, l'une des données personnelles les plus révélatrices lorsqu'elle est liée à une
      personne ou à son appareil.
  - locale: es
    value: >-
      Determina dónde está algo — receptores GPS en vehículos o aplicaciones, balizas Bluetooth o
      sistemas de posicionamiento en interiores. Produce rastros de ubicación, uno de los tipos de
      datos personales más reveladores cuando se vinculan con una persona o con su dispositivo.
  - locale: pt
    value: >-
      Determina onde algo está — receptores de GPS em veículos ou aplicativos, beacons Bluetooth ou
      sistemas de posicionamento em ambientes internos. Produz rastros de localização, um dos tipos
      mais reveladores de dados pessoais quando ligados a uma pessoa ou ao dispositivo dela.
  - locale: fil
    value: >-
      Inaalam kung nasaan ang isang bagay — mga GPS receiver sa mga sasakyan o app, Bluetooth
      beacon, o sistema ng pagpoposisyon sa loob ng gusali. Lumilikha ng mga bakas ng lokasyon, isa
      sa mga uri ng personal na data na pinakamaraming naibubunyag kapag naiugnay sa isang tao o sa
      kanilang device.
  - locale: km
    value: >-
      កំណត់ថាអ្វីមួយស្ថិតនៅទីណា — ឧបករណ៍ទទួល GPS ក្នុងយានយន្ត ឬកម្មវិធី, ឧបករណ៍បញ្ចេញសញ្ញា
      Bluetooth, ឬប្រព័ន្ធកំណត់ទីតាំងក្នុងអគារ។ វាបង្កើតដានទីតាំង
      ដែលជាប្រភេទទិន្នន័យផ្ទាល់ខ្លួនមួយដែលបង្ហាញព័ត៌មានច្រើនបំផុត នៅពេលភ្ជាប់ទៅនឹងបុគ្គល
      ឬឧបករណ៍របស់គាត់។
  - locale: vi
    value: >-
      Xác định một thứ gì đó đang ở đâu — bộ thu GPS trong xe hoặc ứng dụng, thiết bị phát tín hiệu
      Bluetooth, hoặc hệ thống định vị trong nhà. Tạo ra dấu vết vị trí, một trong những loại dữ
      liệu cá nhân tiết lộ nhiều nhất khi gắn với một người hoặc thiết bị của họ.
  - locale: zh-Hans
    value: 确定某物在哪里——车辆或应用中的GPS接收器、蓝牙信标或室内定位系统。会产生位置轨迹；当位置轨迹与某人或其设备相关联时，它是最能暴露个人情况的个人数据之一。
  - locale: zh-Hant
    value: 判定某物所在位置：車輛或應用程式中的GPS接收器、藍牙信標或室內定位系統。它會產生位置軌跡；當軌跡與某人或其裝置連結時，是最能透露個人隱私的個人資料之一。
  - locale: nl
    value: >-
      Bepaalt waar iets is: gps-ontvangers in voertuigen of apps, bluetoothbakens of systemen voor
      plaatsbepaling binnenshuis. Levert locatiesporen op, een van de meest onthullende soorten
      persoonsgegevens als ze aan een persoon of diens apparaat zijn gekoppeld.
  - locale: de
    value: >-
      Bestimmt, wo sich etwas befindet – GPS-Empfänger in Fahrzeugen oder Apps, Bluetooth-Beacons
      oder Systeme zur Ortung in Gebäuden. Erzeugt Standortverläufe, eine der aufschlussreichsten
      Arten personenbezogener Daten, wenn sie mit einer Person oder ihrem Gerät verknüpft sind.
symbol_id: map_pin
