description:
  - locale: en
    value: >-
      The system triggers something in the physical world — a door unlocking, a light turning on, an
      alert sounding, signage changing, HVAC adjusting. Examples: a turnstile that opens on facial
      match, a public-address alert played automatically, an HVAC adjustment commanded by a building
      model.
  - locale: fr
    value: >-
      Le système déclenche quelque chose dans le monde physique : une porte qui se déverrouille, une
      lumière qui s'allume, une alerte qui retentit, une signalétique qui change, un système CVC qui
      s'ajuste. Exemples : un tourniquet qui s'ouvre sur reconnaissance faciale, une alerte de
      sonorisation diffusée automatiquement, un ajustement CVC commandé par un modèle de bâtiment.
  - locale: es
    value: >-
      El sistema activa algo en el mundo físico — una puerta que se desbloquea, una luz que se
      enciende, una alerta que suena, un letrero que cambia, la climatización que se ajusta.
      Ejemplos: un torniquete que se abre al coincidir un rostro, una alerta que se emite
      automáticamente por altavoces, un ajuste de climatización ordenado por el modelo de un
      edificio.
  - locale: pt
    value: >-
      O sistema aciona algo no mundo físico — uma porta que destrava, uma luz que acende, um alerta
      que soa, uma sinalização que muda, a climatização que se ajusta. Exemplos: uma catraca que
      abre após a conferência do rosto, um alerta tocado automaticamente no sistema de som, um
      ajuste de climatização comandado por um modelo do prédio.
  - locale: fil
    value: >-
      May pinagagana ang sistema sa pisikal na mundo — pintong nabubuksan ang kandado, ilaw na
      sumisindi, alertong tumutunog, karatulang nagbabago, HVAC na nagbabago ng setting. Mga
      halimbawa: turnstile na bumubukas kapag tumugma ang mukha, alerto sa public address na
      awtomatikong ipinaririnig, pagbabago sa HVAC na iniutos ng isang modelo ng gusali.
  - locale: km
    value: >-
      ប្រព័ន្ធធ្វើឱ្យអ្វីមួយកើតឡើងក្នុងពិភពរូបវន្ត — ទ្វារដោះសោ, ភ្លើងភ្លឺឡើង,
      សំឡេងប្រកាសអាសន្នបន្លឺឡើង, ផ្លាកសញ្ញាផ្លាស់ប្តូរ, ប្រព័ន្ធ HVAC កែតម្រូវ។ ឧទាហរណ៍៖
      ច្រកទ្វារបង្វិលដែលបើកនៅពេលមុខផ្គូផ្គងគ្នា,
      ការប្រកាសអាសន្នដែលចាក់ដោយស្វ័យប្រវត្តិតាមប្រព័ន្ធបំពងសំឡេងសាធារណៈ, ការកែតម្រូវ HVAC
      ដែលបញ្ជាដោយម៉ូដែលអគារ។
  - locale: vi
    value: >-
      Hệ thống kích hoạt một điều gì đó trong thế giới vật lý — một cánh cửa mở khóa, một bóng đèn
      bật lên, một tiếng cảnh báo vang lên, biển báo thay đổi, hệ thống sưởi và điều hòa (HVAC) tự
      điều chỉnh. Ví dụ: cổng xoay mở ra khi khuôn mặt khớp, một cảnh báo tự động phát qua loa phát
      thanh công cộng, một lần điều chỉnh HVAC theo lệnh của mô hình tòa nhà.
  - locale: zh-Hans
    value: 系统触发物理世界中的某种变化——门解锁、灯亮起、警报响起、标牌内容变化、暖通空调调节。示例：人脸比对通过后开启的闸机、自动播放的广播警报、由建筑模型下令进行的暖通空调调节。
  - locale: zh-Hant
    value: 系統觸發實體世界中的某件事：門解鎖、燈亮起、警報響起、標示變換、空調調整。例如：臉部比對成功後開啟的驗票閘門、自動播放的廣播警示、由建築模型下令的空調調整。
  - locale: nl
    value: >-
      Het systeem zet iets in gang in de fysieke wereld: een deur die van het slot gaat, een lamp
      die aangaat, een alarm dat afgaat, borden die veranderen, een klimaatinstallatie die wordt
      bijgesteld. Voorbeelden: een toegangspoortje dat opengaat bij een gezichtsmatch, een
      waarschuwing die automatisch via de omroepinstallatie wordt afgespeeld, een aanpassing van de
      klimaatinstallatie in opdracht van een gebouwmodel.
  - locale: de
    value: >-
      Das System löst etwas in der physischen Welt aus – eine Tür wird entriegelt, ein Licht geht
      an, ein Alarm ertönt, eine Anzeige wechselt, Heizung oder Lüftung werden angepasst. Beispiele:
      ein Drehkreuz, das sich nach erfolgreichem Gesichtsabgleich öffnet, eine automatisch
      abgespielte Warndurchsage, eine von einem Gebäudemodell angeordnete Anpassung von Heizung oder
      Lüftung.
sources:
  - type: regulation
    title: EU AI Act Article 3(1) — outputs that "influence physical or virtual environments"
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    citation: Regulation (EU) 2024/1689, Article 3(1). Pairs with the agentic_mode element in this schema.
