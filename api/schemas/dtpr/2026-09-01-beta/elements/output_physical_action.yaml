    value: A physical action
  - locale: fr
    value: Une action physique
  - locale: es
    value: Una acción física
  - locale: pt
    value: Uma ação física
  - locale: fil
    value: Pisikal na aksiyon
  - locale: km
    value: សកម្មភាពរូបវន្ត
  - locale: vi
    value: Hành động vật lý
  - locale: zh-Hans
    value: 物理动作
  - locale: zh-Hant
    value: 實體動作
