  - locale: en
    value: Sensitive personal data
  - locale: fr
    value: Données personnelles sensibles
  - locale: es
    value: Datos personales sensibles
  - locale: pt
    value: Dados pessoais sensíveis
  - locale: fil
    value: Sensitibong personal na data
  - locale: km
    value: ទិន្នន័យផ្ទាល់ខ្លួនរសើប
  - locale: vi
    value: Dữ liệu cá nhân nhạy cảm
  - locale: zh-Hans
    value: 敏感个人数据
  - locale: zh-Hant
    value: 敏感個人資料
  - locale: nl
