    value: Operational data
  - locale: fr
    value: Données opérationnelles
  - locale: es
    value: Datos operativos
  - locale: pt
    value: Dados operacionais
  - locale: fil
    value: Data ng operasyon
  - locale: km
    value: ទិន្នន័យប្រតិបត្តិការ
  - locale: vi
    value: Dữ liệu vận hành
  - locale: zh-Hans
    value: 运营数据
  - locale: zh-Hant
