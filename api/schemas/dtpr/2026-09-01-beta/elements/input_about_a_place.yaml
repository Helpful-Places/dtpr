description:
  - locale: en
    value: >-
      Locations, routes, surroundings, or floor plans. The AI takes in data describing where
      something is. Examples: GPS coordinates from a phone, foot-traffic counts on a sidewalk, a map
      of building corridors.
  - locale: fr
    value: >-
      Lieux, itinéraires, environnement ou plans. L'IA reçoit des données décrivant l'endroit où se
      trouve quelque chose. Exemples : des coordonnées GPS d'un téléphone, des comptages de passages
      piétons, le plan des couloirs d'un bâtiment.
  - locale: es
    value: >-
      Ubicaciones, rutas, alrededores o planos de planta. La IA recibe datos que describen dónde
      está algo. Ejemplos: coordenadas GPS de un teléfono, conteos de peatones en una acera, un mapa
      de los pasillos de un edificio.
  - locale: pt
    value: >-
      Localizações, rotas, arredores ou plantas baixas. A IA recebe dados que descrevem onde algo
      está. Exemplos: coordenadas de GPS de um celular, contagens de pedestres em uma calçada, um
      mapa dos corredores de um prédio.
  - locale: fil
    value: >-
      Mga lokasyon, ruta, paligid, o floor plan. Tumatanggap ang AI ng data na naglalarawan kung
      nasaan ang isang bagay. Mga halimbawa: GPS coordinates mula sa telepono, bilang ng mga
      dumaraang naglalakad sa bangketa, mapa ng mga pasilyo ng gusali.
  - locale: km
    value: >-
      ទីតាំង, ផ្លូវធ្វើដំណើរ, បរិវេណជុំវិញ, ឬប្លង់អគារ។ AI
      ទទួលយកទិន្នន័យដែលពណ៌នាថាអ្វីមួយស្ថិតនៅទីណា។ ឧទាហរណ៍៖ កូអរដោនេ GPS ពីទូរសព្ទ,
      ចំនួនអ្នកដើរកាត់លើចិញ្ចើមផ្លូវ, ផែនទីច្រករបៀងក្នុងអគារ។
  - locale: vi
    value: >-
      Vị trí, tuyến đường, khu vực xung quanh hoặc sơ đồ mặt bằng. AI tiếp nhận dữ liệu mô tả một
      thứ gì đó đang ở đâu. Ví dụ: tọa độ GPS từ điện thoại, số lượt người đi bộ trên vỉa hè, bản đồ
      các hành lang trong một tòa nhà.
  - locale: zh-Hans
    value: 位置、路线、周边环境或平面图。AI接收描述某物所在位置的数据。示例：手机的GPS坐标、人行道上的人流计数、建筑走廊的地图。
  - locale: zh-Hant
    value: 位置、路線、周遭環境或樓層平面圖。AI接收描述某物所在位置的資料。例如：手機的GPS座標、人行道的人流計數、建築物走廊的地圖。
  - locale: nl
    value: >-
      Locaties, routes, omgevingen of plattegronden. De AI krijgt gegevens binnen die beschrijven
      waar iets is. Voorbeelden: gps-coördinaten van een telefoon, tellingen van voetgangers op een
      stoep, een kaart van de gangen in een gebouw.
  - locale: de
    value: >-
      Standorte, Routen, Umgebungen oder Grundrisse. Die KI nimmt Daten auf, die beschreiben, wo
      sich etwas befindet. Beispiele: GPS-Koordinaten eines Mobiltelefons, Zählungen des Fußverkehrs
      auf einem Gehweg, ein Plan der Flure eines Gebäudes.
symbol_id: spatial
