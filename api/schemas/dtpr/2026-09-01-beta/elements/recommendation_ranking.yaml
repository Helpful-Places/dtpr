description:
  - locale: en
    value: >-
      Techniques that suggest or order items for a person — services, listings, news, wayfinding
      options — based on preferences, behavior, or similarity to other people. Includes
      collaborative filtering, content-based recommenders, and learned ranking. Personalizes what
      each person sees from the same underlying catalog.
  - locale: fr
    value: >-
      Techniques qui suggèrent ou classent des éléments pour une personne — services, annonces,
      actualités, options d'orientation — selon ses préférences, son comportement ou sa similarité
      avec d'autres. Inclut le filtrage collaboratif, les recommandateurs basés sur le contenu et le
      classement appris. Personnalise ce que chaque personne voit dans un même catalogue.
  - locale: es
    value: >-
      Técnicas que sugieren u ordenan opciones para una persona — servicios, listados, noticias,
      opciones de orientación — según sus preferencias, su comportamiento o su similitud con otras
      personas. Incluye filtrado colaborativo, sistemas de recomendación basados en contenido y
      ranking aprendido. Personaliza lo que ve cada persona a partir del mismo catálogo de base.
  - locale: pt
    value: >-
      Técnicas que sugerem ou ordenam itens para uma pessoa — serviços, listagens, notícias, opções
      de orientação — com base em preferências, comportamento ou semelhança com outras pessoas.
      Incluem filtragem colaborativa, sistemas de recomendação baseados em conteúdo e ranking
      aprendido. Personalizam o que cada pessoa vê a partir do mesmo catálogo de base.
  - locale: fil
    value: >-
      Mga pamamaraang nagmumungkahi o nagsusunod-sunod ng mga item para sa isang tao — mga serbisyo,
      listing, balita, pagpipilian sa paghahanap ng daan — batay sa mga gusto, kilos, o pagkakatulad
      sa ibang tao. Kasama ang collaborative filtering, mga recommender na batay sa nilalaman, at
      learned ranking. Iniaangkop sa bawat tao ang nakikita nila mula sa iisang katalogo.
  - locale: km
    value: >-
      បច្ចេកទេសដែលស្នើ ឬរៀបលំដាប់ធាតុផ្សេងៗសម្រាប់បុគ្គលម្នាក់ — សេវា, បញ្ជីផ្សាយ, ព័ត៌មាន,
      ជម្រើសផ្លូវ — ដោយផ្អែកលើចំណូលចិត្ត, ឥរិយាបថ, ឬភាពស្រដៀងគ្នានឹងមនុស្សផ្សេងទៀត។
      រួមមានការច្រោះបែបសហការ, ប្រព័ន្ធផ្តល់អនុសាសន៍ផ្អែកលើខ្លឹមសារ,
      និងការរៀបចំណាត់ថ្នាក់ដែលម៉ូដែលរៀនបាន។ វាកំណត់អ្វីដែលបុគ្គលម្នាក់ៗឃើញតាមបុគ្គល
      ពីបញ្ជីមូលដ្ឋានតែមួយ។
  - locale: vi
    value: >-
      Các kỹ thuật gợi ý hoặc sắp thứ tự các mục cho một người — dịch vụ, tin đăng, tin tức, lựa
      chọn chỉ đường — dựa trên sở thích, hành vi hoặc sự giống nhau với những người khác. Bao gồm
      lọc cộng tác, hệ thống đề xuất dựa trên nội dung và xếp hạng bằng học máy. Cá nhân hóa những
      gì mỗi người thấy từ cùng một danh mục gốc.
  - locale: zh-Hans
    value: 根据偏好、行为或与他人的相似性，为个人推荐或排列服务、信息条目、新闻、导览选项等项目的技术。包括协同过滤、基于内容的推荐系统和学习排序。让每个人从同一份底层目录中看到个性化的内容。
  - locale: zh-Hant
    value: 依據偏好、行為或與他人的相似程度，為個人建議或排序項目（服務、刊登資訊、新聞、路線指引選項）的技術。包括協同過濾、內容式推薦系統及學習式排序。它讓每個人從同一份目錄中看到個人化的內容。
  - locale: nl
    value: >-
      Technieken die items voor een persoon voorstellen of ordenen (diensten, aanbiedingen, nieuws,
      routeopties) op basis van voorkeuren, gedrag of gelijkenis met andere mensen. Hieronder vallen
      collaboratief filteren, aanbevelingssystemen op basis van content en aangeleerde
      rangschikking. Bepalen per persoon wat die te zien krijgt uit hetzelfde onderliggende aanbod.
  - locale: de
    value: >-
      Verfahren, die einer Person Dinge vorschlagen oder für sie sortieren – Dienstleistungen,
      Angebote, Nachrichten, Wegoptionen – auf Grundlage von Vorlieben, Verhalten oder Ähnlichkeit
      zu anderen Personen. Dazu gehören kollaboratives Filtern, inhaltsbasierte Empfehlungssysteme
      und gelernte Rangfolgen. Sie personalisieren, was jede Person aus demselben zugrunde liegenden
      Katalog zu sehen bekommt.
symbol_id: processing_recommendation-systems
