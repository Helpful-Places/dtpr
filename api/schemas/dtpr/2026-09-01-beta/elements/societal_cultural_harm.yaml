    value: 社会与文化损害
  - locale: zh-Hant
    value: 社會與文化損害
description:
  - locale: en
    value: >-
      The risk that the AI system harms communities or culture through erosion of trust, loss of
      linguistic and cultural diversity, or unhealthy dependency on opaque systems. This includes
      risks of misinformation at scale, homogenization of cultural expression, replacement of local
      knowledge, and degradation of public-information ecosystems. Mitigations may include
      multilingual support, partnerships with affected communities, provenance signals on generated
      content, and investment in local-language and local-context models.
  - locale: fr
    value: >-
      Le risque que le système d'IA porte atteinte aux communautés ou à la culture par l'érosion de
      la confiance, la perte de diversité linguistique et culturelle ou une dépendance malsaine à
      des systèmes opaques. Cela inclut les risques de désinformation à grande échelle,
      d'homogénéisation de l'expression culturelle, de substitution des savoirs locaux et de
      dégradation des écosystèmes d'information publique. Les mesures d'atténuation peuvent inclure
      un support multilingue, des partenariats avec les communautés concernées, des signaux de
      provenance sur les contenus générés et des investissements dans des modèles spécifiques aux
      langues et aux contextes locaux.
  - locale: es
    value: >-
      El riesgo de que el sistema de IA dañe a las comunidades o a la cultura por la erosión de la
      confianza, la pérdida de diversidad lingüística y cultural o una dependencia poco saludable de
      sistemas opacos. Esto incluye riesgos de desinformación a gran escala, homogeneización de la
      expresión cultural, reemplazo del conocimiento local y deterioro de los ecosistemas de
      información pública. Las medidas de mitigación pueden incluir soporte multilingüe, alianzas
      con las comunidades afectadas, señales de procedencia en el contenido generado e inversión en
      modelos adaptados a los idiomas y contextos locales.
  - locale: pt
    value: >-
      O risco de que o sistema de IA prejudique comunidades ou a cultura por meio da erosão da
      confiança, da perda de diversidade linguística e cultural ou de uma dependência pouco saudável
      de sistemas opacos. Isso inclui riscos de desinformação em larga escala, de homogeneização da
      expressão cultural, de substituição do conhecimento local e de degradação dos ecossistemas de
      informação pública. As medidas de mitigação podem incluir suporte multilíngue, parcerias com
      as comunidades afetadas, sinais de procedência em conteúdo gerado e investimento em modelos
      voltados às línguas e aos contextos locais.
  - locale: fil
    value: >-
      Ang panganib na mapinsala ng sistemang AI ang mga komunidad o kultura dahil sa paghina ng
      tiwala, pagkawala ng pagkakaiba-iba ng wika at kultura, o di-malusog na pagdepende sa mga
      sistemang hindi malinaw kung paano gumagana. Kasama rito ang mga panganib ng malawakang maling
      impormasyon, pagkakapare-pareho ng pangkulturang pagpapahayag, pagpapalit sa lokal na
      kaalaman, at pagkasira ng mga pinagkukunan ng pampublikong impormasyon. Maaaring kabilang sa
      mga hakbang para mabawasan ang panganib ang suporta sa maraming wika, pakikipagtulungan sa mga
      apektadong komunidad, mga palatandaan ng pinagmulan sa nilikhang nilalaman, at pamumuhunan sa
      mga modelong para sa lokal na wika at lokal na konteksto.
  - locale: km
    value: >-
      ហានិភ័យដែលប្រព័ន្ធ AI ធ្វើឱ្យខូចខាតដល់សហគមន៍ ឬវប្បធម៌ តាមរយៈការធ្លាក់ចុះទំនុកចិត្ត,
      ការបាត់បង់ភាពចម្រុះនៃភាសានិងវប្បធម៌, ឬការពឹងផ្អែកមិនល្អលើប្រព័ន្ធដែលខ្វះតម្លាភាព។
      នេះរួមមានហានិភ័យនៃព័ត៌មានមិនពិតទ្រង់ទ្រាយធំ, ការធ្វើឱ្យការបង្ហាញវប្បធម៌ក្លាយជាដូចៗគ្នា,
      ការជំនួសចំណេះដឹងក្នុងមូលដ្ឋាន, និងការធ្លាក់ចុះគុណភាពនៃប្រព័ន្ធព័ត៌មានសាធារណៈ។
      វិធានការកាត់បន្ថយអាចរួមមាន ការគាំទ្រច្រើនភាសា, ភាពជាដៃគូជាមួយសហគមន៍ដែលរងផលប៉ះពាល់,
      សញ្ញាបញ្ជាក់ប្រភពលើខ្លឹមសារដែលបង្កើតឡើង, និងការវិនិយោគលើម៉ូដែលសម្រាប់ភាសា
      និងបរិបទក្នុងមូលដ្ឋាន។
  - locale: vi
    value: >-
      Rủi ro hệ thống AI gây hại cho cộng đồng hoặc văn hóa qua sự xói mòn lòng tin, mất đi sự đa
      dạng về ngôn ngữ và văn hóa, hoặc sự phụ thuộc không lành mạnh vào các hệ thống thiếu minh
      bạch. Điều này bao gồm rủi ro thông tin sai lệch trên diện rộng, sự đồng nhất hóa trong biểu
      đạt văn hóa, tri thức địa phương bị thay thế, và sự xuống cấp của hệ sinh thái thông tin công.
      Biện pháp giảm thiểu có thể gồm hỗ trợ đa ngôn ngữ, hợp tác với các cộng đồng bị ảnh hưởng,
      dấu hiệu cho biết nguồn gốc trên nội dung do AI tạo ra, và đầu tư vào các mô hình dành cho
      ngôn ngữ và bối cảnh địa phương.
  - locale: zh-Hans
    value: >-
      AI系统因信任受到侵蚀、语言和文化多样性丧失，或对不透明系统的不健康依赖，损害社区或文化的风险。这包括大规模虚假信息、文化表达趋同、本地知识被取代，以及公共信息生态恶化等风险。缓解措施可包括多语言支持、与受影响社区合作、为生成内容添加来源标识，以及投资开发适应本地语言和本地情境的模型。
  - locale: zh-Hant
    value: >-
      AI系統因侵蝕信任、使語言與文化多樣性流失，或造成對不透明系統的不健康依賴，而損害社群或文化的風險。包括大規模的錯誤資訊、文化表達趨於同質、在地知識遭到取代，以及公共資訊生態惡化等風險。因應措施可包括多語言支援、與受影響的社群合作、為生成內容加上來源標示，以及投資開發在地語言與在地脈絡的模型。
