    value: Societal & cultural harm
  - locale: fr
    value: Préjudice sociétal et culturel
  - locale: es
    value: Daño social y cultural
  - locale: pt
    value: Dano social e cultural
  - locale: fil
    value: Pinsala sa lipunan at kultura
  - locale: km
    value: ការខូចខាតដល់សង្គម និងវប្បធម៌
  - locale: vi
    value: Tổn hại xã hội và văn hóa
