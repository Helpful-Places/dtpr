description:
  - locale: en
    value: >-
      Senses vehicles on a road or in a space — radar, LiDAR, induction loops in the pavement,
      piezoelectric strips, or gantry-mounted detectors. Used to count traffic, measure speed, and
      detect congestion. License-plate cameras belong under Camera.
  - locale: fr
    value: >-
      Détecte les véhicules sur une route ou dans un espace — radar, LiDAR, boucles d'induction
      dans la chaussée, bandes piézoélectriques ou détecteurs montés sur portique. Sert à compter
      le trafic, mesurer la vitesse et détecter la congestion. Les caméras de plaques
      d'immatriculation relèvent de Caméra.
  - locale: es
    value: >-
      Detecta vehículos en una vía o en un espacio — radar, LiDAR, espiras de inducción en el
      pavimento, bandas piezoeléctricas o detectores montados en pórticos. Se usa para contar el
      tráfico, medir la velocidad y detectar congestión. Las cámaras de placas corresponden a
      Cámara.
  - locale: pt
    value: >-
      Detecta veículos em uma via ou em um espaço — radar, LiDAR, laços indutivos no pavimento,
      faixas piezoelétricas ou detectores instalados em pórticos. Usada para contar o fluxo de
      veículos, medir a velocidade e detectar congestionamentos. Câmeras de leitura de placas
      pertencem a Câmera.
  - locale: fil
    value: >-
      Sumasagap ng mga sasakyan sa kalsada o sa isang lugar — radar, LiDAR, induction loop sa
      kalsada, piezoelectric strip, o detector na nakakabit sa gantry. Ginagamit para bilangin ang
      mga sasakyan, sukatin ang bilis, at tuklasin ang pagsisikip. Ang mga kamera para sa plaka ay
      kabilang sa Kamera.
  - locale: km
    value: >-
      ចាប់សញ្ញាយានយន្តលើផ្លូវ ឬក្នុងទីកន្លែងមួយ — រ៉ាដា, LiDAR,
      រង្វិលអាំងឌុចស្យុងបង្កប់ក្នុងផ្ទៃផ្លូវ, បន្ទះព្យែហ្សូអេឡិចត្រិច,
      ឬឧបករណ៍រកឃើញដែលដំឡើងលើស៊ុមដែកពីលើផ្លូវ។ ប្រើដើម្បីរាប់ចរាចរណ៍, វាស់ល្បឿន, និងរកឃើញការកកស្ទះ។
      កាមេរ៉ាថតស្លាកលេខយានយន្តស្ថិតនៅក្រោម «កាមេរ៉ា»។
  - locale: vi
    value: >-
      Phát hiện xe cộ trên đường hoặc trong một không gian — radar, LiDAR, vòng cảm ứng từ dưới mặt
      đường, dải áp điện, hoặc đầu dò gắn trên giàn. Được dùng để đếm lưu lượng xe, đo tốc độ và
      phát hiện ùn tắc. Camera đọc biển số xe thuộc mục Camera.
  - locale: zh-Hans
    value: 感知道路上或某一空间内的车辆——雷达、激光雷达（LiDAR）、埋设在路面下的感应线圈、压电条或安装在龙门架上的检测器。用于统计车流量、测量车速和检测拥堵。车牌摄像头归入“摄像头”。
  - locale: zh-Hant
    value: 感測道路上或空間內的車輛：雷達、光達（LiDAR）、埋設在路面下的感應線圈、壓電感測條或裝設在門架上的偵測器。用於計算車流量、測量車速及偵測壅塞。車牌攝影機屬於「攝影機」。
  - locale: nl
    value: >-
      Neemt voertuigen waar op een weg of in een ruimte: radar, lidar, detectielussen in het wegdek,
      piëzo-elektrische strips of detectoren op een portaal. Wordt gebruikt om verkeer te tellen,
      snelheid te meten en files te detecteren. Kentekencamera's vallen onder Camera.
  - locale: de
    value: >-
      Erfasst Fahrzeuge auf einer Straße oder Fläche – Radar, LiDAR, Induktionsschleifen in der
      Fahrbahn, piezoelektrische Streifen oder an Schilderbrücken montierte Detektoren. Wird
      eingesetzt, um den Verkehr zu zählen, Geschwindigkeiten zu messen und Staus zu erkennen.
      Kennzeichenkameras gehören zu „Kamera“.
symbol_id: vehicle
