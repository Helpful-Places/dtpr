description:
  - locale: en
    value: Reduces water use and/or helps conserve water.
  - locale: fr
    value: >-
      Réduit la consommation d'eau et/ou contribue à sa conservation. Pour en savoir plus sur
      l'efficacité et la conservation de l'eau, ainsi que sur l'infrastructure verte.
  - locale: es
    value: Reduce el consumo de agua y/o ayuda a ahorrarla.
  - locale: pt
    value: Reduz o consumo de água e/ou ajuda a economizar água.
  - locale: fil
    value: Nagbabawas ng paggamit ng tubig at/o tumutulong magtipid ng tubig.
  - locale: km
    value: កាត់បន្ថយការប្រើទឹក និង/ឬជួយសន្សំសំចៃទឹក។
  - locale: vi
    value: Giảm mức sử dụng nước và/hoặc giúp tiết kiệm nước.
  - locale: zh-Hans
    value: 减少用水量和/或帮助节约用水。
  - locale: zh-Hant
    value: 減少用水及（或）協助節約用水。
  - locale: nl
    value: Vermindert het waterverbruik en/of helpt water te besparen.
  - locale: de
    value: Senkt den Wasserverbrauch und/oder hilft, Wasser zu sparen.
