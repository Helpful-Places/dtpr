  - locale: pt
    value: Emprego e trabalho
  - locale: fil
    value: Empleyo at trabaho
  - locale: km
    value: ការងារ និងការជួលបុគ្គលិក
  - locale: vi
    value: Việc làm và lao động
  - locale: zh-Hans
    value: 就业与工作
  - locale: zh-Hant
    value: 就業與工作
  - locale: nl
    value: Werk en personeel
  - locale: de
