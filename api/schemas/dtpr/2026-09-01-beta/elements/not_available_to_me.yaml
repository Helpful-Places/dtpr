id: not_available_to_me
category_id: access
title:
  - locale: en
    value: Not available to me
  - locale: fr
    value: Non disponible pour moi
  - locale: es
    value: No disponibles para mí
  - locale: pt
    value: Não disponíveis para mim
  - locale: fil
    value: Hindi ko maa-access
  - locale: km
    value: ខ្ញុំមិនអាចចូលប្រើបាន
  - locale: vi
    value: Tôi không thể truy cập
  - locale: zh-Hans
    value: 本人不可获取
  - locale: zh-Hant
    value: 我無法取得
description:
  - locale: en
    value: >-
      Not available to me or other individuals. As an individual, there isn't a way for you to
      access this data.
  - locale: fr
    value: >-
      Non disponible pour moi ou d'autres individus. En tant qu'individu, il n'y a aucun moyen pour
      vous d'accéder à ces données.
  - locale: es
    value: >-
      No disponibles para mí ni para otras personas. Usted, como particular, no tiene forma de
      acceder a estos datos.
  - locale: pt
    value: >-
      Não disponíveis para mim nem para outras pessoas. Como indivíduo, você não tem como acessar
      esses dados.
  - locale: fil
    value: >-
      Hindi ko maa-access, at hindi rin ng ibang indibidwal. Bilang indibidwal, wala kayong paraan
      para ma-access ang data na ito.
  - locale: km
    value: >-
      ខ្ញុំ ឬបុគ្គលផ្សេងទៀតមិនអាចចូលប្រើបានទេ។ ក្នុងនាមជាបុគ្គល
      អ្នកគ្មានមធ្យោបាយចូលប្រើទិន្នន័យនេះទេ។
  - locale: vi
    value: >-
      Tôi và các cá nhân khác đều không thể truy cập. Với tư cách cá nhân, bạn không có cách nào để
      truy cập dữ liệu này.
  - locale: zh-Hans
    value: 本人和其他个人均无法获取。您作为个人没有途径访问这些数据。
  - locale: zh-Hant
    value: 我或其他人都無法取得。您個人沒有任何方式可以存取這些資料。
symbol_id: not_available
