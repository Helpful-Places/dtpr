id: speech_audio
category_id: processing
title:
  - locale: en
    value: Speech & Audio
  - locale: fr
    value: Parole et audio
description:
  - locale: en
    value: >-
      AI systems that convert between spoken words and other formats, or that classify non-speech
      sound. Includes speech-to-text (transcription), text-to-speech (synthetic voice), keyword
      spotting, and audio event detection. Voice-as-identity (recognizing who is speaking) belongs
      in Biometric Recognition.
  - locale: fr
    value: >-
      Systèmes d'IA qui convertissent entre la parole et d'autres formats, ou qui classent les sons
      non vocaux. Inclut la transcription parole-vers-texte, la synthèse vocale, la détection de
      mots-clés et la détection d'événements sonores. La voix comme identité (reconnaître qui parle)
      relève de la reconnaissance biométrique.
symbol_id: waveform
