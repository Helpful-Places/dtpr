description:
  - locale: en
    value: >-
      Techniques that convert between spoken words and other formats, or that classify non-speech
      sound. Includes speech-to-text (transcription), text-to-speech (synthetic voice), keyword
      spotting, and audio event detection. Voice-as-identity (recognizing who is speaking) belongs
      in Biometric Recognition.
  - locale: fr
    value: >-
      Techniques qui convertissent entre la parole et d'autres formats, ou qui classent les sons non
      vocaux. Inclut la transcription parole-vers-texte, la synthèse vocale, la détection de
      mots-clés et la détection d'événements sonores. La voix comme identité (reconnaître qui parle)
      relève de la reconnaissance biométrique.
  - locale: es
    value: >-
      Técnicas que convierten las palabras habladas a otros formatos y viceversa, o que clasifican
      sonidos que no son habla. Incluye voz a texto (transcripción), texto a voz (voz sintética),
      detección de palabras clave y detección de eventos sonoros. La voz como identidad (reconocer
      quién habla) corresponde a Reconocimiento biométrico.
  - locale: pt
    value: >-
      Técnicas que convertem palavras faladas em outros formatos e vice-versa, ou que classificam
      sons que não são fala. Incluem conversão de fala em texto (transcrição), conversão de texto em
      fala (voz sintética), detecção de palavras-chave e detecção de eventos sonoros. A voz como
      identidade (reconhecer quem está falando) pertence a Reconhecimento biométrico.
  - locale: fil
    value: >-
      Mga pamamaraang naglilipat ng binigkas na salita sa ibang format at pabalik, o nag-uuri ng
      tunog na hindi pananalita. Kasama ang speech-to-text (transkripsiyon), text-to-speech
      (sintetikong boses), pagtuklas ng mga keyword, at pagtuklas ng mga pangyayaring may tunog. Ang
      boses bilang pagkakakilanlan (pagkilala kung sino ang nagsasalita) ay kabilang sa Pagkilalang
      biometric.
  - locale: km
    value: >-
      បច្ចេកទេសដែលបំប្លែងរវាងពាក្យសំដី និងទម្រង់ផ្សេងទៀត ឬដែលចាត់ថ្នាក់សំឡេងដែលមិនមែនជាសំដី។
      រួមមានការបំប្លែងសំដីជាអក្សរ, ការបំប្លែងអក្សរជាសំដី (សំឡេងសំយោគ), ការចាប់ពាក្យគន្លឹះ,
      និងការរកឃើញព្រឹត្តិការណ៍សំឡេង។ ការប្រើសំឡេងជាអត្តសញ្ញាណ (ស្គាល់ថានរណាកំពុងនិយាយ) ស្ថិតក្នុង
      «ការសម្គាល់ជីវមាត្រ»។
  - locale: vi
    value: >-
      Các kỹ thuật chuyển đổi giữa lời nói và các định dạng khác, hoặc phân loại những âm thanh
      không phải lời nói. Bao gồm chuyển lời nói thành văn bản (chép lời), chuyển văn bản thành lời
      nói (giọng nói tổng hợp), phát hiện từ khóa và phát hiện sự kiện âm thanh. Việc dùng giọng nói
      làm danh tính (nhận ra ai đang nói) thuộc về Nhận diện sinh trắc học.
  - locale: zh-Hans
    value: 在口语与其他形式之间进行转换，或对非语音声音进行分类的技术。包括语音转文字（转写）、文字转语音（合成语音）、关键词检出和声音事件检测。以声音识别身份（识别说话人是谁）属于“生物特征识别”。
  - locale: zh-Hant
    value: 在口語與其他格式之間轉換，或對非語音聲音進行分類的技術。包括語音轉文字（逐字稿）、文字轉語音（合成語音）、關鍵詞偵測及聲音事件偵測。以聲音作為身分（辨認說話者是誰）則屬於「生物特徵辨識」。
  - locale: nl
    value: >-
      Technieken die gesproken woorden omzetten naar andere vormen en omgekeerd, of die andere
      geluiden dan spraak indelen. Hieronder vallen spraak naar tekst (transcriptie), tekst naar
      spraak (computerstem), het herkennen van trefwoorden en het detecteren van bepaalde geluiden.
      Stem als identiteit (herkennen wie er spreekt) hoort bij Biometrische herkenning.
  - locale: de
    value: >-
      Verfahren, die gesprochene Worte in andere Formate umwandeln und umgekehrt oder Geräusche
      einordnen, die keine Sprache sind. Dazu gehören Sprache-zu-Text (Transkription),
      Text-zu-Sprache (synthetische Stimme), das Erkennen von Schlüsselwörtern und das Erkennen von
      Geräuschereignissen. Die Stimme als Identitätsmerkmal (erkennen, wer spricht) gehört zu
      „Biometrische Erkennung“.
symbol_id: waveform
