description:
  - locale: en
    value: >-
      The system produces output containing biological signals from a person's body — face
      templates, voice embeddings, gait vectors, gesture sequences. Examples: an enrolled face
      template stored downstream, a voice embedding for later matching, a gait signature exported to
      another system.
  - locale: fr
    value: >-
      Le système produit une sortie contenant des signaux biologiques du corps d'une personne :
      modèles faciaux, empreintes vocales, vecteurs de démarche, séquences de gestes. Exemples : un
      modèle facial enrôlé stocké en aval, une empreinte vocale pour appariement ultérieur, une
      signature de démarche exportée vers un autre système.
  - locale: es
    value: >-
      El sistema produce un resultado que contiene señales biológicas del cuerpo de una persona —
      plantillas faciales, representaciones numéricas de la voz, vectores de la forma de caminar,
      secuencias de gestos. Ejemplos: una plantilla facial registrada que se almacena en un sistema
      posterior, una representación numérica de la voz para compararla más adelante, una firma de la
      forma de caminar exportada a otro sistema.
  - locale: pt
    value: >-
      O sistema produz saídas que contêm sinais biológicos do corpo de uma pessoa — templates
      faciais, representações numéricas da voz, vetores do modo de andar, sequências de gestos.
      Exemplos: um template facial cadastrado e armazenado em uma etapa seguinte, uma representação
      numérica da voz para comparação posterior, uma assinatura do modo de andar exportada para
      outro sistema.
  - locale: fil
    value: >-
      Lumilikha ang sistema ng output na may mga senyales mula sa katawan ng isang tao — mga
      template ng mukha, voice embedding, gait vector, sunod-sunod na kumpas. Mga halimbawa:
      nakarehistrong template ng mukha na iniimbak sa susunod na sistema, voice embedding para sa
      pagtutugma sa hinaharap, gait signature na ine-export sa ibang sistema.
  - locale: km
    value: >-
      ប្រព័ន្ធបង្កើតលទ្ធផលដែលមានសញ្ញាជីវសាស្ត្រពីរាងកាយរបស់បុគ្គល — គំរូមុខ, ទិន្នន័យតំណាងសំឡេង,
      វ៉ិចទ័ររបៀបដើរ, លំដាប់កាយវិការ។ ឧទាហរណ៍៖ គំរូមុខដែលបានចុះបញ្ជីហើយរក្សាទុកក្នុងប្រព័ន្ធបន្ទាប់,
      ទិន្នន័យតំណាងសំឡេងសម្រាប់ផ្គូផ្គងនៅពេលក្រោយ, សញ្ញាសម្គាល់របៀបដើរដែលបញ្ជូនចេញទៅប្រព័ន្ធផ្សេង។
  - locale: vi
    value: >-
      Hệ thống tạo ra kết quả đầu ra chứa các tín hiệu sinh học từ cơ thể một người — mẫu khuôn mặt,
      mẫu giọng nói dạng số, vectơ dáng đi, chuỗi cử chỉ. Ví dụ: một mẫu khuôn mặt đã đăng ký được
      lưu ở hệ thống phía sau, một mẫu giọng nói dạng số để đối chiếu về sau, một mẫu đặc trưng dáng
      đi được xuất sang hệ thống khác.
  - locale: zh-Hans
    value: 系统产生的输出含有来自人体的生物信号——人脸模板、声纹向量、步态向量、手势序列。示例：存储在下游的已登记人脸模板、供日后比对的声纹向量、导出到另一个系统的步态特征。
  - locale: zh-Hant
    value: 系統產生含有人體生物訊號的輸出結果：臉部特徵範本、聲音嵌入向量、步態向量、手勢序列。例如：儲存在下游的已註冊臉部特徵範本、供日後比對的聲音嵌入向量、匯出到另一個系統的步態特徵。
  - locale: nl
    value: >-
      Het systeem levert uitvoer op met lichaamskenmerken van een persoon: gezichtstemplates,
      stemprofielen, loopprofielen, reeksen gebaren. Voorbeelden: een geregistreerde
      gezichtstemplate die verderop in de keten wordt opgeslagen, een stemprofiel om later mee te
      vergelijken, een loopprofiel dat naar een ander systeem wordt geëxporteerd.
  - locale: de
    value: >-
      Das System erzeugt Ergebnisse, die biologische Merkmale vom Körper einer Person enthalten –
      Gesichts-Templates, Stimm-Embeddings, Gangvektoren, Gestenabfolgen. Beispiele: ein
      registriertes Gesichts-Template, das in einem nachgelagerten System gespeichert wird, ein
      Stimm-Embedding für einen späteren Abgleich, eine Gangsignatur, die an ein anderes System
      exportiert wird.
