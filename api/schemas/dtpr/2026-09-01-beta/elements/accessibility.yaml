description:
  - locale: en
    value: Ensures that everyone has equal access to a space or a service.
  - locale: fr
    value: Garantit l'égalité d'accés de tous à un espace ou à un service.
  - locale: es
    value: Garantiza que todas las personas tengan igual acceso a un espacio o servicio.
  - locale: pt
    value: Garante que todas as pessoas tenham acesso igual a um espaço ou serviço.
  - locale: fil
    value: Tinitiyak na pantay-pantay ang access ng lahat sa isang lugar o serbisyo.
  - locale: km
    value: ធានាថាមនុស្សគ្រប់រូបអាចចូលប្រើទីកន្លែង ឬសេវាបានស្មើភាពគ្នា។
  - locale: vi
    value: Bảo đảm mọi người đều được tiếp cận bình đẳng với một không gian hoặc dịch vụ.
  - locale: zh-Hans
    value: 确保人人都能平等地使用某一空间或服务。
  - locale: zh-Hant
    value: 確保人人都能平等使用空間或服務。
  - locale: nl
    value: Zorgt ervoor dat iedereen gelijke toegang heeft tot een ruimte of dienst.
  - locale: de
    value: >-
      Stellt sicher, dass alle gleichberechtigten Zugang zu einem Ort oder einer Dienstleistung
      haben.
