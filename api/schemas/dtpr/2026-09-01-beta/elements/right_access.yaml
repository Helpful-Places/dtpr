id: right_access
category_id: rights
title:
  - locale: en
    value: Right to Access
  - locale: fr
    value: Droit d'accès
  - locale: es
    value: Derecho de acceso
  - locale: pt
    value: Direito de acesso
  - locale: fil
    value: Karapatan sa access
  - locale: km
    value: សិទ្ធិចូលប្រើ
  - locale: vi
    value: Quyền truy cập dữ liệu
  - locale: zh-Hans
    value: 查阅权
  - locale: zh-Hant
    value: 查閱資料的權利
description:
  - locale: en
    value: >-
      The right to request and receive information about what personal data an AI system has
      collected about you, how this data is being used, and what decisions have been made using this
      information. This includes the right to obtain a copy of your data in a readable format.
  - locale: fr
    value: >-
      Le droit de demander et de recevoir des informations sur les données à caractère personnel
      qu'un système d'IA a collectées à votre sujet, sur la manière dont ces données sont utilisées
      et sur les décisions qui ont été prises sur la base de ces informations. Cela inclut le droit
      d'obtenir une copie de vos données dans un format lisible.
  - locale: es
    value: >-
      El derecho a solicitar y recibir información sobre qué datos personales ha recopilado sobre
      usted un sistema de IA, cómo se están usando esos datos y qué decisiones se han tomado con esa
      información. Esto incluye el derecho a obtener una copia de sus datos en un formato legible.
  - locale: pt
    value: >-
      O direito de solicitar e receber informações sobre quais dados pessoais um sistema de IA
      coletou sobre você, como esses dados estão sendo usados e quais decisões foram tomadas com
      base nessas informações. Isso inclui o direito de obter uma cópia dos seus dados em formato
      legível.
  - locale: fil
    value: >-
      Ang karapatang humiling at tumanggap ng impormasyon tungkol sa kung anong personal na data ang
      nakolekta ng isang sistemang AI tungkol sa inyo, kung paano ginagamit ang data na ito, at kung
      anong mga desisyon ang ginawa gamit ang impormasyong ito. Kasama rito ang karapatang makakuha
      ng kopya ng inyong data sa format na nababasa.
  - locale: km
    value: >-
      សិទ្ធិស្នើសុំ និងទទួលបានព័ត៌មានអំពីទិន្នន័យផ្ទាល់ខ្លួនអ្វីខ្លះដែលប្រព័ន្ធ AI
      បានប្រមូលអំពីអ្នក, របៀបដែលទិន្នន័យនេះកំពុងត្រូវបានប្រើ,
      និងការសម្រេចចិត្តអ្វីខ្លះដែលបានធ្វើឡើងដោយប្រើព័ត៌មាននេះ។
      នេះរួមទាំងសិទ្ធិទទួលបានច្បាប់ចម្លងនៃទិន្នន័យរបស់អ្នកក្នុងទម្រង់ដែលអាចអានបាន។
  - locale: vi
    value: >-
      Quyền yêu cầu và nhận thông tin về việc một hệ thống AI đã thu thập những dữ liệu cá nhân nào
      về bạn, dữ liệu này đang được sử dụng ra sao, và những quyết định nào đã được đưa ra dựa trên
      thông tin đó. Quyền này bao gồm quyền nhận một bản sao dữ liệu của bạn ở định dạng đọc được.
  - locale: zh-Hans
    value: 有权要求并获得以下信息：AI系统收集了您的哪些个人数据、这些数据如何被使用，以及依据这些信息作出了哪些决定。这包括以可读格式获取您的数据副本的权利。
  - locale: zh-Hant
    value: 您有權要求並取得相關資訊，了解AI系統收集了哪些關於您的個人資料、這些資料如何被使用，以及曾依據這些資訊做出哪些決定。這包括以可閱讀的格式取得您的資料副本的權利。
symbol_id: eye
