id: spoken_announcement
category_id: manifestation
title:
  - locale: en
    value: A spoken announcement
  - locale: fr
    value: Une annonce sonore
description:
  - locale: en
    value: >-
      The output is played aloud in the place — a public-address announcement, a synthesized voice
      at a crossing or platform, an audible alarm. Reaches everyone present, including people who
      never looked at a screen.
  - locale: fr
    value: >-
      Le résultat est diffusé à voix haute dans le lieu — annonce par haut-parleur, voix de
      synthèse à un passage ou sur un quai, alarme sonore. Atteint toutes les personnes présentes,
      y compris celles qui n'ont jamais regardé d'écran.
symbol_id: loudspeaker
