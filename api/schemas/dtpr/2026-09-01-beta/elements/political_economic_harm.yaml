description:
  - locale: en
    value: >-
      The risk that the AI system manipulates political discourse, interferes with elections,
      concentrates market power, or damages public institutions. This includes risks of synthetic
      media targeting voters, opaque ad-targeting, competitive distortion from monopoly access to
      data and compute, and erosion of institutional trust. Mitigations may include disclosure of
      synthetic content, antitrust attention to AI markets, audit access for regulators, and
      political-ad transparency requirements.
  - locale: fr
    value: >-
      Le risque que le système d'IA manipule le discours politique, interfère avec les élections,
      concentre le pouvoir de marché ou porte atteinte aux institutions publiques. Cela inclut les
      risques liés aux médias synthétiques ciblant les électeurs, au ciblage publicitaire opaque, à
      la distorsion concurrentielle due à l'accès monopolistique aux données et au calcul, et à
      l'érosion de la confiance institutionnelle. Les mesures d'atténuation peuvent inclure la
      divulgation des contenus synthétiques, l'attention antitrust portée aux marchés de l'IA,
      l'accès d'audit pour les régulateurs et des obligations de transparence pour les publicités
      politiques.
  - locale: es
    value: >-
      El riesgo de que el sistema de IA manipule el debate político, interfiera en elecciones,
      concentre poder de mercado o dañe a las instituciones públicas. Esto incluye riesgos de
      contenido sintético dirigido a votantes, publicidad dirigida de forma opaca, distorsión de la
      competencia por el acceso monopólico a datos y capacidad de cómputo, y erosión de la confianza
      en las instituciones. Las medidas de mitigación pueden incluir la divulgación del contenido
      sintético, la vigilancia antimonopolio de los mercados de IA, el acceso de los organismos
      reguladores para auditar y requisitos de transparencia para la publicidad política.
  - locale: pt
    value: >-
      O risco de que o sistema de IA manipule o debate político, interfira em eleições, concentre
      poder de mercado ou prejudique instituições públicas. Isso inclui riscos de mídia sintética
      direcionada a eleitores, de direcionamento opaco de anúncios, de distorção da concorrência por
      acesso monopolista a dados e a capacidade computacional e de erosão da confiança nas
      instituições. As medidas de mitigação podem incluir a identificação de conteúdo sintético,
      atenção antitruste aos mercados de IA, acesso de auditoria para órgãos reguladores e
      exigências de transparência para anúncios políticos.
  - locale: fil
    value: >-
      Ang panganib na manipulahin ng sistemang AI ang talakayang pampolitika, makialam sa halalan,
      magtipon ng kapangyarihan sa merkado sa iilan, o makasira sa mga pampublikong institusyon.
      Kasama rito ang mga panganib ng synthetic media na nakatuon sa mga botante, di-malinaw na
      pagtutuon ng ad, pagkabaluktot ng kompetisyon dahil sa monopolyo sa access sa data at
      computing, at paghina ng tiwala sa mga institusyon. Maaaring kabilang sa mga hakbang para
      mabawasan ang panganib ang paglalantad kung sintetiko ang nilalaman, pagtutok ng mga awtoridad
      laban sa monopolyo sa mga merkado ng AI, access ng mga regulator para sa audit, at mga
      rekisito sa transparency ng mga political ad.
  - locale: km
    value: >-
      ហានិភ័យដែលប្រព័ន្ធ AI រៀបចំបំភ្លៃការពិភាក្សានយោបាយ, ជ្រៀតជ្រែកក្នុងការបោះឆ្នោត,
      ប្រមូលផ្តុំអំណាចទីផ្សារ, ឬធ្វើឱ្យខូចខាតស្ថាប័នសាធារណៈ។
      នេះរួមមានហានិភ័យពីខ្លឹមសារសិប្បនិម្មិតដែលតម្រង់ទៅអ្នកបោះឆ្នោត,
      ការកំណត់គោលដៅផ្សាយពាណិជ្ជកម្មដែលខ្វះតម្លាភាព,
      ការបង្ខូចការប្រកួតប្រជែងដោយសារការកាន់កាប់ផ្តាច់មុខលើទិន្នន័យនិងសមត្ថភាពគណនា,
      និងការធ្លាក់ចុះទំនុកចិត្តលើស្ថាប័ន។ វិធានការកាត់បន្ថយអាចរួមមាន
      ការបង្ហាញឱ្យដឹងអំពីខ្លឹមសារសិប្បនិម្មិត, ការយកចិត្តទុកដាក់ផ្នែកប្រឆាំងការផ្តាច់មុខលើទីផ្សារ
      AI, សិទ្ធិធ្វើសវនកម្មសម្រាប់និយ័តករ,
      និងលក្ខខណ្ឌតម្រូវតម្លាភាពសម្រាប់ការផ្សាយពាណិជ្ជកម្មនយោបាយ។
  - locale: vi
    value: >-
      Rủi ro hệ thống AI thao túng thảo luận chính trị, can thiệp vào bầu cử, tập trung quyền lực
      thị trường hoặc làm tổn hại các thể chế công. Điều này bao gồm rủi ro từ nội dung do AI tạo ra
      nhắm vào cử tri, quảng cáo nhắm mục tiêu thiếu minh bạch, cạnh tranh bị bóp méo do độc quyền
      tiếp cận dữ liệu và năng lực tính toán, và sự xói mòn lòng tin vào các thể chế. Biện pháp giảm
      thiểu có thể gồm công bố rõ nội dung do AI tạo ra, giám sát chống độc quyền đối với thị trường
      AI, quyền kiểm tra dành cho cơ quan quản lý, và yêu cầu minh bạch đối với quảng cáo chính trị.
  - locale: zh-Hans
    value: >-
      AI系统操纵政治讨论、干预选举、集中市场支配力或损害公共机构的风险。这包括针对选民的合成媒体、不透明的广告定向、因垄断数据和算力而造成的竞争扭曲，以及公众对机构的信任受到侵蚀等风险。缓解措施可包括披露合成内容、从反垄断角度关注AI市场、向监管机构开放审计权限，以及政治广告透明度要求。
  - locale: zh-Hant
    value: >-
      AI系統操縱政治論述、干預選舉、集中市場力量或損害公共機構的風險。包括針對選民的合成媒體、不透明的廣告投放、因獨占資料與運算資源而扭曲競爭，以及侵蝕對機構的信任等風險。因應措施可包括揭露合成內容、對AI市場進行反托拉斯監督、讓主管機關得以稽核，以及政治廣告透明度規定。
  - locale: nl
    value: >-
      Het risico dat het AI-systeem het politieke debat manipuleert, verkiezingen beïnvloedt,
      marktmacht concentreert of publieke instellingen schaadt. Hieronder vallen risico's door
      kunstmatig gemaakte media gericht op kiezers, ondoorzichtige gerichte advertenties, oneerlijke
      concurrentie door een monopolie op toegang tot gegevens en rekenkracht, en afnemend vertrouwen
      in instellingen. Mogelijke maatregelen zijn het melden van kunstmatig gemaakte content,
      aandacht van mededingingstoezicht voor AI-markten, toegang voor toezichthouders om audits te
      doen en transparantie-eisen voor politieke advertenties.
  - locale: de
    value: >-
      Das Risiko, dass das KI-System den politischen Diskurs manipuliert, in Wahlen eingreift,
      Marktmacht konzentriert oder öffentliche Institutionen beschädigt. Dazu gehören Risiken durch
      synthetische Medien, die auf Wahlberechtigte zielen, undurchsichtige gezielte Werbung,
      Wettbewerbsverzerrung durch monopolartigen Zugang zu Daten und Rechenleistung sowie
      schwindendes Vertrauen in Institutionen. Mögliche Gegenmaßnahmen sind die Kennzeichnung
      synthetischer Inhalte, kartellrechtliche Beobachtung der KI-Märkte, Prüfzugang für
      Aufsichtsbehörden und Transparenzpflichten für politische Werbung.
