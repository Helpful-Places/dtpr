  - locale: fil
    value: Pagkawala ng sariling pagpapasya
  - locale: km
    value: ការបាត់បង់ស្វ័យភាព
  - locale: vi
    value: Mất quyền tự chủ
  - locale: zh-Hans
    value: 自主权丧失
  - locale: zh-Hant
    value: 喪失自主權
