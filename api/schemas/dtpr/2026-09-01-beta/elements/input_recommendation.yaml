  - locale: en
    value: A recommendation or prediction
  - locale: fr
    value: Une recommandation ou prédiction
  - locale: es
    value: Una recomendación o predicción
  - locale: pt
    value: Uma recomendação ou previsão
  - locale: fil
    value: Rekomendasyon o hula
  - locale: km
    value: អនុសាសន៍ ឬការព្យាករណ៍
  - locale: vi
    value: Đề xuất hoặc dự đoán
  - locale: zh-Hans
    value: 推荐或预测
  - locale: zh-Hant
    value: 建議或預測
  - locale: nl
    value: Een aanbeveling of voorspelling
  - locale: de
    value: Empfehlung oder Vorhersage
description:
  - locale: en
    value: >-
      A suggestion, forecast, risk score, or ranking produced earlier by another system. The AI
      takes in this advisory output and uses it. Distinct from a binding decision because it advises
      rather than determines. Examples: a forecasted demand curve, a risk score from a prior model,
      a recommended route from a navigation service.
  - locale: fr
    value: >-
      Une suggestion, prévision, score de risque ou classement produit en amont par un autre
      système. L'IA reçoit cette sortie consultative et l'utilise. Distincte d'une décision
      contraignante parce qu'elle conseille sans trancher. Exemples : une courbe de demande prévue,
      un score de risque issu d'un modèle antérieur, un itinéraire recommandé par un service de
      navigation.
  - locale: es
    value: >-
      Una sugerencia, pronóstico, puntaje de riesgo o ranking que otro sistema produjo antes. La IA
      recibe este resultado orientativo y lo usa. Se distingue de una decisión vinculante porque
      aconseja en lugar de determinar. Ejemplos: una curva de demanda pronosticada, un puntaje de
      riesgo de un modelo anterior, una ruta recomendada por un servicio de navegación.
  - locale: pt
    value: >-
      Uma sugestão, previsão, pontuação de risco ou ranking produzido antes por outro sistema. A IA
      recebe essa saída de caráter consultivo e a utiliza. Diferente de uma decisão vinculante
      porque orienta em vez de determinar. Exemplos: uma curva de demanda prevista, uma pontuação de
      risco de um modelo anterior, uma rota recomendada por um serviço de navegação.
  - locale: fil
    value: >-
      Isang mungkahi, forecast, iskor ng panganib, o ranggo na nilikha na dati ng ibang sistema.
      Tinatanggap ng AI ang output na ito na nagpapayo at ginagamit ito. Iba sa desisyong dapat
      sundin dahil nagpapayo lang ito at hindi nagtatakda. Mga halimbawa: hinuhulaang kurba ng
      demand, iskor ng panganib mula sa naunang modelo, rutang inirekomenda ng isang serbisyo ng
      nabigasyon.
  - locale: km
    value: >-
      ការស្នើ, ការព្យាករណ៍, ពិន្ទុហានិភ័យ, ឬចំណាត់ថ្នាក់ដែលប្រព័ន្ធផ្សេងបានបង្កើតពីមុន។ AI
      ទទួលយកលទ្ធផលបែបផ្តល់យោបល់នេះ ហើយប្រើវា។ ខុសពីការសម្រេចចិត្តដែលមានកាតព្វកិច្ចអនុវត្ត
      ព្រោះវាផ្តល់យោបល់ មិនមែនកំណត់លទ្ធផលទេ។ ឧទាហរណ៍៖ ខ្សែកោងតម្រូវការដែលព្យាករណ៍,
      ពិន្ទុហានិភ័យពីម៉ូដែលមុន, ផ្លូវដែលសេវានាំផ្លូវផ្តល់អនុសាសន៍។
  - locale: vi
    value: >-
      Một gợi ý, dự báo, điểm rủi ro hoặc bảng xếp hạng do một hệ thống khác tạo ra trước đó. AI
      tiếp nhận kết quả mang tính tham khảo này và sử dụng nó. Khác với một quyết định có tính ràng
      buộc vì nó chỉ tư vấn chứ không định đoạt. Ví dụ: một đường cong nhu cầu được dự báo, điểm rủi
      ro từ một mô hình trước, một tuyến đường do dịch vụ dẫn đường đề xuất.
  - locale: zh-Hans
    value: >-
      另一个系统此前产生的建议、预报、风险评分或排名。AI接收这一参考性输出并加以使用。它有别于具有约束力的决定，因为它只提供建议而不作裁定。示例：预测的需求曲线、先前模型给出的风险评分、导航服务推荐的路线。
  - locale: zh-Hant
    value: >-
      另一個系統先前產生的建議、預測、風險評分或排名。AI接收這項參考性的輸出結果並加以使用。它與具約束力的決定不同，因為它只提供參考，而不做出裁定。例如：預測的需求曲線、先前模型產生的風險評分、導航服務建議的路線。
  - locale: nl
    value: >-
      Een voorstel, prognose, risicoscore of rangschikking die een ander systeem eerder heeft
      gemaakt. De AI krijgt deze adviserende uitvoer binnen en gebruikt die. Anders dan een bindende
      beslissing, omdat het adviseert en niet bepaalt. Voorbeelden: een voorspelde vraagcurve, een
      risicoscore van een eerder model, een aanbevolen route van een navigatiedienst.
  - locale: de
    value: >-
      Ein Vorschlag, eine Prognose, ein Risikowert oder eine Rangfolge, die ein anderes System zuvor
      erzeugt hat. Die KI nimmt dieses beratende Ergebnis auf und nutzt es. Anders als eine
      verbindliche Entscheidung berät es, statt festzulegen. Beispiele: eine prognostizierte
      Nachfragekurve, ein Risikowert aus einem früheren Modell, eine von einem Navigationsdienst
      empfohlene Route.
sources:
  - type: regulation
    title: EU AI Act Article 3(1) — output classes (predictions, content, recommendations, decisions)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    citation: Regulation (EU) 2024/1689, Article 3(1).
