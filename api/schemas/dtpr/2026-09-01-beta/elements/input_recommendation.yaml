id: input_recommendation
category_id: input_dataset
title:
  - locale: en
    value: A recommendation or prediction
  - locale: fr
    value: Une recommandation ou prédiction
description:
  - locale: en
    value: >-
      A suggestion, forecast, risk score, or ranking produced earlier by another system. The AI
      takes in this advisory output and uses it. Distinct from a binding decision because it advises
      rather than determines. Examples: a forecasted demand curve, a risk score from a prior model,
      a recommended route from a navigation service.
  - locale: fr
    value: >-
      Une suggestion, prévision, score de risque ou classement produit en amont par un autre
      système. L'IA reçoit cette sortie consultative et l'utilise. Distincte d'une décision
      contraignante parce qu'elle conseille sans trancher. Exemples : une courbe de demande prévue,
      un score de risque issu d'un modèle antérieur, un itinéraire recommandé par un service de
      navigation.
sources:
  - type: regulation
    title: EU AI Act Article 3(1) — output classes (predictions, content, recommendations, decisions)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    citation: Regulation (EU) 2024/1689, Article 3(1).
symbol_id: dm_priority-ranking
