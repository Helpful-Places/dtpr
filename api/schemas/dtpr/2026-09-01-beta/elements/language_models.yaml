title:
  - locale: en
    value: Language Models
  - locale: fr
    value: Modèles de langage
  - locale: es
    value: Modelos de lenguaje
  - locale: pt
    value: Modelos de linguagem
  - locale: fil
    value: Mga modelo ng wika
  - locale: km
    value: ម៉ូដែលភាសា
  - locale: vi
    value: Mô hình ngôn ngữ
  - locale: zh-Hans
    value: 语言模型
  - locale: zh-Hant
    value: 語言模型
description:
  - locale: en
    value: >-
      AI systems that read, write, summarize, translate, or hold a conversation in human language.
      Includes large language models (LLMs), chatbots, and generative-text systems. They work by
      predicting the most likely next tokens given the input and any prior context.
  - locale: fr
    value: >-
      Systèmes d'IA qui lisent, écrivent, résument, traduisent ou tiennent une conversation en
      langage humain. Cela inclut les grands modèles de langage (LLM), les chatbots et les systèmes
      de génération de texte. Ils fonctionnent en prédisant les jetons les plus probables à partir
      de l'entrée et du contexte antérieur.
  - locale: es
    value: >-
      Sistemas de IA que leen, escriben, resumen, traducen o mantienen una conversación en lenguaje
      humano. Incluye los modelos de lenguaje de gran tamaño (LLM), los chatbots y los sistemas que
      generan texto. Funcionan prediciendo los tokens siguientes más probables a partir de la
      entrada y de cualquier contexto previo.
  - locale: pt
    value: >-
      Sistemas de IA que leem, escrevem, resumem, traduzem ou mantêm uma conversa em linguagem
      humana. Incluem grandes modelos de linguagem (LLMs), chatbots e sistemas de geração de texto.
      Funcionam prevendo os próximos tokens mais prováveis a partir da entrada e de qualquer
      contexto anterior.
  - locale: fil
    value: >-
      Mga sistemang AI na bumabasa, sumusulat, nagbubuod, nagsasalin, o nakikipag-usap sa wika ng
      tao. Kasama ang mga large language model (LLM), chatbot, at sistemang lumilikha ng teksto.
      Gumagana ang mga ito sa pamamagitan ng paghula ng pinakamalamang na susunod na mga token batay
      sa input at anumang naunang konteksto.
  - locale: km
    value: >-
      ប្រព័ន្ធ AI ដែលអាន, សរសេរ, សង្ខេប, បកប្រែ, ឬសន្ទនាជាភាសាមនុស្ស។ រួមមានម៉ូដែលភាសាធំ (LLM),
      ឆាតបត, និងប្រព័ន្ធបង្កើតអត្ថបទ។ វាដំណើរការដោយព្យាករណ៍បំណែកពាក្យ (token) បន្ទាប់ដែលទំនងបំផុត
      ដោយផ្អែកលើទិន្នន័យបញ្ចូល និងបរិបទពីមុន។
  - locale: vi
    value: >-
      Các hệ thống AI đọc, viết, tóm tắt, dịch hoặc trò chuyện bằng ngôn ngữ của con người. Bao gồm
      mô hình ngôn ngữ lớn (LLM), chatbot và các hệ thống tạo văn bản. Chúng hoạt động bằng cách dự
      đoán những token tiếp theo có khả năng xuất hiện nhất, dựa trên đầu vào và ngữ cảnh trước đó.
  - locale: zh-Hans
    value: 能用人类语言阅读、写作、总结、翻译或对话的AI系统。包括大语言模型（LLM）、聊天机器人和文本生成系统。其工作原理是根据输入和已有上下文，预测最可能出现的后续词元。
  - locale: zh-Hant
    value: 能以人類語言閱讀、書寫、摘要、翻譯或進行對話的AI系統。包括大型語言模型（LLM）、聊天機器人及文字生成系統。其運作方式是根據輸入內容與先前的脈絡，預測最可能接續的詞元（token）。
symbol_id: processing_llm
