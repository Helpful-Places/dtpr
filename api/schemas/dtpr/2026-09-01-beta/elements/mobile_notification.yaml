id: mobile_notification
category_id: manifestation
title:
  - locale: en
    value: A mobile notification
  - locale: fr
    value: Une notification mobile
  - locale: es
    value: Una notificación móvil
  - locale: pt
    value: Uma notificação no celular
  - locale: fil
    value: Notipikasyon sa mobile
  - locale: km
    value: ការជូនដំណឹងលើទូរសព្ទ
  - locale: vi
    value: Thông báo trên điện thoại
  - locale: zh-Hans
    value: 手机通知
  - locale: zh-Hant
    value: 行動裝置通知
description:
  - locale: en
    value: >-
      The output reaches you on your own device — a push notification, text message, email, or
      in-app alert. The system finds you rather than waiting for you to look; whether you can turn
      it off is an Access and Rights question.
  - locale: fr
    value: >-
      Le résultat vous parvient sur votre propre appareil — notification push, SMS, courriel ou
      alerte dans l'appli. Le système vient vous trouver au lieu d'attendre que vous regardiez ;
      savoir si vous pouvez le désactiver relève de l'accès et des droits.
  - locale: es
    value: >-
      El resultado le llega a su propio dispositivo — una notificación push, un mensaje de texto, un
      correo electrónico o una alerta dentro de una aplicación. El sistema llega hasta usted en
      lugar de esperar a que usted mire; si puede desactivarlo es una cuestión de Acceso a datos y
      de Derechos.
  - locale: pt
    value: >-
      O resultado chega a você no seu próprio dispositivo — uma notificação push, uma mensagem de
      texto, um e-mail ou um alerta no aplicativo. O sistema vai até você em vez de esperar que você
      olhe; se você pode desativá-lo é uma questão de Acesso aos dados e de Direitos.
  - locale: fil
    value: >-
      Nakararating sa inyo ang output sa sarili ninyong device — push notification, text message,
      email, o alerto sa loob ng app. Ang sistema ang humahanap sa inyo sa halip na hintayin kayong
      tumingin; kung maaari ninyo itong i-off ay usapin ng Access sa data at Mga karapatan.
  - locale: km
    value: >-
      លទ្ធផលមកដល់អ្នកលើឧបករណ៍ផ្ទាល់ខ្លួនរបស់អ្នក — ការជូនដំណឹងលេចលើអេក្រង់, សារអក្សរ, អ៊ីមែល,
      ឬការជូនដំណឹងក្នុងកម្មវិធី។ ប្រព័ន្ធមករកអ្នក ជាជាងរង់ចាំឱ្យអ្នកមើល ចំណែកថាតើអ្នកអាចបិទវាបានឬទេ
      គឺជាសំណួរនៃ «ការចូលប្រើទិន្នន័យ» និង «សិទ្ធិ»។
  - locale: vi
    value: >-
      Kết quả đầu ra đến với bạn trên thiết bị của chính bạn — thông báo đẩy, tin nhắn, email hoặc
      cảnh báo trong ứng dụng. Hệ thống tìm đến bạn thay vì chờ bạn nhìn vào; việc bạn có tắt nó
      được hay không là vấn đề thuộc về Truy cập dữ liệu và Quyền.
  - locale: zh-Hans
    value: 输出发送到您自己的设备上——推送通知、短信、电子邮件或应用内提醒。系统主动找到您，而不是等您来看；能否关闭它，属于“数据访问”和“权利”方面的问题。
  - locale: zh-Hant
    value: 輸出結果傳送到您自己的裝置上：推播通知、簡訊、電子郵件或應用程式內的提醒。系統會主動找上您，而不是等您來查看；您能否關閉通知，屬於「資料存取」與「權利」的問題。
symbol_id: phone_notification
