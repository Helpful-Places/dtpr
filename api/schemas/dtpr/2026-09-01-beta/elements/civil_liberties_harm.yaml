description:
  - locale: en
    value: >-
      The risk that this system compromises fundamental human rights and civil liberties — speech,
      assembly, movement, due process, or freedom from arbitrary surveillance. This includes risks
      from mass facial recognition, predictive policing, censorship of lawful expression, and
      chilling effects on protest. Mitigations may include strict purpose limits, judicial or
      independent oversight, narrow data retention, and human-rights impact assessments before
      deployment.
  - locale: fr
    value: >-
      Le risque que ce système compromette les droits humains fondamentaux et les libertés civiles —
      expression, réunion, circulation, procédure équitable ou protection contre la surveillance
      arbitraire. Cela inclut les risques liés à la reconnaissance faciale de masse, à la police
      prédictive, à la censure de l'expression légale et aux effets dissuasifs sur la contestation.
      Les mesures d'atténuation peuvent inclure des limites strictes de finalité, une supervision
      judiciaire ou indépendante, une rétention de données restreinte et des évaluations d'impact
      sur les droits humains avant le déploiement.
  - locale: es
    value: >-
      El riesgo de que este sistema comprometa derechos humanos fundamentales y libertades civiles —
      expresión, reunión, libre circulación, debido proceso o la protección contra la vigilancia
      arbitraria. Esto incluye riesgos derivados del reconocimiento facial masivo, la vigilancia
      policial predictiva, la censura de expresiones lícitas y los efectos inhibidores sobre la
      protesta. Las medidas de mitigación pueden incluir límites estrictos de propósito, supervisión
      judicial o independiente, una conservación de datos acotada y evaluaciones de impacto en los
      derechos humanos antes de la implementación.
  - locale: pt
    value: >-
      O risco de que este sistema comprometa direitos humanos fundamentais e liberdades civis —
      expressão, reunião, circulação, devido processo legal ou proteção contra vigilância
      arbitrária. Isso inclui riscos decorrentes de reconhecimento facial em massa, policiamento
      preditivo, censura de expressão lícita e efeitos inibidores sobre protestos. As medidas de
      mitigação podem incluir limites rígidos de finalidade, supervisão judicial ou independente,
      retenção de dados restrita e avaliações de impacto sobre direitos humanos antes da
      implantação.
  - locale: fil
    value: >-
      Ang panganib na malagay sa alanganin ng sistemang ito ang mga batayang karapatang pantao at
      kalayaang sibil — pananalita, pagtitipon, paggalaw, tamang proseso ng batas, o kalayaan mula
      sa di-makatwirang pagmamanman. Kasama rito ang mga panganib mula sa malawakang pagkilala ng
      mukha, predictive policing, pagsensura sa legal na pagpapahayag, at pagkatakot ng mga tao na
      magprotesta. Maaaring kabilang sa mga hakbang para mabawasan ang panganib ang mahihigpit na
      limitasyon sa layunin, pagbabantay ng hukuman o ng independiyenteng lupon, limitadong
      pagpapanatili ng data, at pagtatasa ng epekto sa karapatang pantao bago ang pagpapatupad.
  - locale: km
    value: >-
      ហានិភ័យដែលប្រព័ន្ធនេះធ្វើឱ្យប៉ះពាល់ដល់សិទ្ធិមនុស្សជាមូលដ្ឋាន និងសេរីភាពពលរដ្ឋ — ការបញ្ចេញមតិ,
      ការជួបជុំ, ការធ្វើដំណើរ, នីតិវិធីត្រឹមត្រូវ, ឬសេរីភាពរួចផុតពីការឃ្លាំមើលតាមអំពើចិត្ត។
      នេះរួមមានហានិភ័យពីការសម្គាល់មុខទ្រង់ទ្រាយធំ, ការងារនគរបាលផ្អែកលើការព្យាករណ៍,
      ការត្រួតពិនិត្យបិទខ្ទប់ការបញ្ចេញមតិស្របច្បាប់, និងផលដែលធ្វើឱ្យមនុស្សមិនហ៊ានតវ៉ា។
      វិធានការកាត់បន្ថយអាចរួមមាន ការកំណត់គោលបំណងយ៉ាងតឹងរ៉ឹង, ការត្រួតពិនិត្យដោយតុលាការ
      ឬដោយស្ថាប័នឯករាជ្យ, ការរក្សាទុកទិន្នន័យក្នុងកម្រិតមានកំណត់,
      និងការវាយតម្លៃផលប៉ះពាល់លើសិទ្ធិមនុស្សមុនពេលដាក់ឱ្យប្រើប្រាស់។
  - locale: vi
    value: >-
      Rủi ro hệ thống này làm tổn hại các quyền con người cơ bản và quyền tự do dân sự — ngôn luận,
      hội họp, đi lại, thủ tục pháp lý công bằng, hoặc quyền không bị theo dõi tùy tiện. Điều này
      bao gồm rủi ro từ việc nhận diện khuôn mặt hàng loạt, hoạt động cảnh sát dựa trên dự đoán,
      kiểm duyệt phát ngôn hợp pháp, và tác động khiến người dân e ngại biểu tình. Biện pháp giảm
      thiểu có thể gồm giới hạn mục đích chặt chẽ, sự giám sát của tòa án hoặc cơ quan độc lập, lưu
      giữ dữ liệu ở mức tối thiểu, và đánh giá tác động đến quyền con người trước khi triển khai.
  - locale: zh-Hans
    value: >-
      本系统损害基本人权和公民自由的风险——言论、集会、行动、正当程序，或免受任意监控的自由。这包括大规模人脸识别、预测性警务、对合法言论的审查，以及对抗议活动的寒蝉效应所带来的风险。缓解措施可包括严格的目的限制、司法或独立监督、从严限定数据保留，以及在部署前进行人权影响评估。
  - locale: zh-Hant
    value: >-
      這個系統損及基本人權與公民自由的風險，包括言論、集會、遷徙、正當程序，或免於任意監控的自由。包括大規模臉部辨識、預測性警務、審查合法言論，以及對抗議活動造成寒蟬效應等風險。因應措施可包括嚴格的目的限制、司法或獨立監督、限縮資料保留，以及在部署前進行人權影響評估。
  - locale: nl
    value: >-
      Het risico dat dit systeem fundamentele mensenrechten en burgerlijke vrijheden aantast:
      vrijheid van meningsuiting en vergadering, bewegingsvrijheid, een eerlijke rechtsgang of
      bescherming tegen willekeurige surveillance. Hieronder vallen risico's door gezichtsherkenning
      op grote schaal, voorspellend politiewerk, censuur van wettige uitingen en een afschrikkende
      werking op protest. Mogelijke maatregelen zijn strikte beperking van het doel, toezicht door
      een rechter of onafhankelijke instantie, een korte bewaartermijn en een mensenrechtentoets
      vóór de inzet.
  - locale: de
    value: >-
      Das Risiko, dass dieses System grundlegende Menschenrechte und Freiheitsrechte beeinträchtigt
      – Meinungs-, Versammlungs- und Bewegungsfreiheit, faires Verfahren oder Freiheit von
      willkürlicher Überwachung. Dazu gehören Risiken durch massenhafte Gesichtserkennung,
      vorausschauende Polizeiarbeit, Zensur rechtmäßiger Äußerungen und Einschüchterungseffekte bei
      Protesten. Mögliche Gegenmaßnahmen sind strenge Zweckbindung, richterliche oder unabhängige
      Aufsicht, eng begrenzte Speicherdauer und menschenrechtliche Folgenabschätzungen vor dem
      Einsatz.
