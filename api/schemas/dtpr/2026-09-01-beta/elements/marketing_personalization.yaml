  - locale: km
    value: ការធ្វើទីផ្សារ និងការកំណត់តាមបុគ្គល
  - locale: vi
    value: Tiếp thị và cá nhân hóa
  - locale: zh-Hans
    value: 营销与个性化
  - locale: zh-Hant
