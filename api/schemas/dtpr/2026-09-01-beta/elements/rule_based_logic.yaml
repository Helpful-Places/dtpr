  - locale: fr
    value: Logique à base de règles
  - locale: es
    value: Lógica basada en reglas
  - locale: pt
    value: Lógica baseada em regras
  - locale: fil
    value: Lohikang batay sa patakaran
  - locale: km
    value: តក្កវិជ្ជាផ្អែកលើច្បាប់
  - locale: vi
    value: Logic dựa trên quy tắc
  - locale: zh-Hans
    value: 基于规则的逻辑
  - locale: zh-Hant
    value: 規則式邏輯
