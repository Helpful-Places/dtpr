  - locale: zh-Hans
    value: 针对本AI系统您可以做什么——如何查阅、提出申诉或选择退出。
  - locale: zh-Hant
    value: 您對這個AI系統可以採取的行動：如何查閱、提出異議或選擇退出。
  - locale: nl
