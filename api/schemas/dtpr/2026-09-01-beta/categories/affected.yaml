id: affected
name:
  - locale: en
    value: People affected
  - locale: fr
    value: Personnes concernées
description:
  - locale: en
    value: >-
      The people this system is used on, or whose lives its decisions affect —
      including those who never chose to interact with it.
  - locale: fr
    value: >-
      Les personnes sur lesquelles ce système est utilisé, ou dont ses décisions
      affectent la vie — y compris celles qui n’ont jamais choisi d’interagir avec lui.
prompt:
  - locale: en
    value: Who is this system used on?
  - locale: fr
    value: Sur qui ce système est-il utilisé ?
required: true
order: 3
datachain_type: dtpr
shape: hexagon
element_context:
  id: relationship
  name:
    - locale: en
      value: Relationship
    - locale: fr
      value: Relation
  description:
    - locale: en
      value: How this system touches this person or group.
    - locale: fr
      value: Comment ce système touche cette personne ou ce groupe.
  values:
    - id: subject
      name:
        - locale: en
          value: Decided about
        - locale: fr
          value: Objet d’une décision
      description:
        - locale: en
          value: The system produces an output about this person that affects them directly — a score, a match, an eligibility call.
        - locale: fr
          value: Le système produit un résultat sur cette personne qui l’affecte directement — un score, une correspondance, une décision d’admissibilité.
      color: null
    - id: bystander
      name:
        - locale: en
          value: Caught incidentally
        - locale: fr
          value: Capté incidemment
      description:
        - locale: en
          value: Swept into the system’s data even though it isn’t making a decision about them — a face in the background of a camera aimed elsewhere.
        - locale: fr
          value: Capté dans les données du système même s’il ne prend pas de décision à son sujet — un visage à l’arrière-plan d’une caméra visant ailleurs.
      color: null
    - id: community
      name:
        - locale: en
          value: Wider community
        - locale: fr
          value: Communauté au sens large
      description:
        - locale: en
          value: A place or group affected collectively, beyond the individuals the system processes — a neighbourhood under watch, a ranked workforce.
        - locale: fr
          value: Un lieu ou un groupe affecté collectivement, au-delà des individus que le système traite — un quartier surveillé, une main-d’œuvre classée.
      color: null
element_variables:
  - id: title
    label:
      - locale: en
        value: Title
      - locale: fr
        value: Titre
    required: true
  - id: description
    label:
      - locale: en
        value: Description
      - locale: fr
        value: Description
    required: true
