id: processing
name:
  - locale: en
    value: Algorithm or Model
  - locale: fr
    value: Algorithme ou modèle
  - locale: es
    value: Algoritmo o modelo
  - locale: pt
    value: Algoritmo ou modelo
  - locale: fil
    value: Algorithm o modelo
  - locale: km
    value: ក្បួនដោះស្រាយ ឬម៉ូដែល
  - locale: vi
    value: Thuật toán hoặc mô hình
  - locale: zh-Hans
    value: 算法或模型
  - locale: zh-Hant
    value: 演算法或模型
  - locale: nl
    value: Algoritme of model
  - locale: de
    value: Algorithmus oder Modell
description:
  - locale: en
    value: >-
      What processes the input — the algorithm family, model class, or technique used to turn
      inputs into outputs.
  - locale: fr
    value: >-
      Ce qui traite les entrées — la famille d’algorithmes, la classe de modèle ou la technique
      utilisée pour transformer les entrées en sorties.
  - locale: es
    value: >-
      Lo que procesa los datos de entrada — la familia de algoritmos, la clase de modelo o la
      técnica que se usa para convertir las entradas en resultados.
  - locale: pt
    value: >-
      O que processa os dados de entrada — a família de algoritmos, a classe de modelo ou a técnica
      usada para transformar entradas em saídas.
  - locale: fil
    value: >-
      Kung ano ang nagpoproseso ng input — ang pamilya ng algorithm, klase ng modelo, o teknik na
      ginagamit para gawing output ang mga input.
  - locale: km
    value: >-
      អ្វីដែលដំណើរការទិន្នន័យបញ្ចូល — ក្រុមក្បួនដោះស្រាយ, ប្រភេទម៉ូដែល,
      ឬបច្ចេកទេសដែលប្រើដើម្បីបំប្លែងទិន្នន័យបញ្ចូលទៅជាលទ្ធផល។
  - locale: vi
    value: >-
      Thứ xử lý đầu vào — nhóm thuật toán, loại mô hình hoặc kỹ thuật được dùng để biến đầu vào
      thành đầu ra.
  - locale: zh-Hans
    value: 由什么来处理输入——将输入转化为输出所使用的算法族、模型类别或技术。
  - locale: zh-Hant
    value: 處理輸入資料的方式：用來將輸入轉換為輸出的演算法類別、模型類型或技術。
  - locale: nl
    value: >-
      Wat de invoer verwerkt: het soort algoritme, het type model of de techniek waarmee invoer
      wordt omgezet in uitvoer.
  - locale: de
    value: >-
      Was die Eingabe verarbeitet – die Algorithmenfamilie, die Modellklasse oder das Verfahren, mit
      dem aus Eingaben Ergebnisse werden.
