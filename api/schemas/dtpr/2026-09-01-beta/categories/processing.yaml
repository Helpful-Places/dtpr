  - locale: pt
    value: Que algoritmo ou modelo processa os dados?
  - locale: fil
    value: Anong algorithm o modelo ang nagpoproseso ng data?
  - locale: km
    value: តើក្បួនដោះស្រាយ ឬម៉ូដែលអ្វីដំណើរការទិន្នន័យ?
  - locale: vi
    value: Thuật toán hoặc mô hình nào xử lý dữ liệu?
  - locale: zh-Hans
    value: 由什么算法或模型处理数据？
  - locale: zh-Hant
    value: 資料由什麼演算法或模型處理？
  - locale: nl
    value: Welk algoritme of model verwerkt de gegevens?
  - locale: de
    value: Welcher Algorithmus oder welches Modell verarbeitet die Daten?
