id: manifestation
name:
  - locale: en
    value: Manifestation
  - locale: fr
    value: Point de contact
  - locale: es
    value: Cómo se manifiesta
  - locale: pt
    value: Como se manifesta
  - locale: fil
    value: Anyo ng output
  - locale: km
    value: ទម្រង់បង្ហាញលទ្ធផល
  - locale: vi
    value: Hình thức thể hiện
  - locale: zh-Hans
    value: 呈现方式
  - locale: zh-Hant
    value: 呈現方式
description:
  - locale: en
    value: >-
      The form this system's output takes when it reaches the world — a screen or sign, a price, a
      notification, a gate opening, a spoken reply. How people meet the output, distinct from the
      output data itself.
  - locale: fr
    value: >-
      La forme que prend le résultat de ce système lorsqu'il atteint le monde — un écran ou un
      panneau, un prix, une notification, une barrière qui s'ouvre, une réponse vocale. La façon
      dont les gens rencontrent le résultat, distincte des données produites elles-mêmes.
  - locale: es
    value: >-
      La forma que toma el resultado de este sistema cuando llega al mundo — una pantalla o un
      letrero, un precio, una notificación, una barrera que se abre, una respuesta hablada. Es cómo
      las personas se encuentran con el resultado, algo distinto de los datos de salida en sí.
  - locale: pt
    value: >-
      A forma que o resultado deste sistema assume quando chega ao mundo — uma tela ou placa, um
      preço, uma notificação, um portão que se abre, uma resposta falada. É como as pessoas têm
      contato com o resultado, diferente dos dados de saída em si.
  - locale: fil
    value: >-
      Ang anyo ng output ng sistemang ito pagdating nito sa mundo — isang screen o karatula, isang
      presyo, isang notipikasyon, isang gate na bumubukas, isang sagot na binibigkas. Ito ang paraan
      kung paano nakakaharap ng mga tao ang output, iba sa output na data mismo.
  - locale: km
    value: >-
      ទម្រង់ដែលលទ្ធផលរបស់ប្រព័ន្ធនេះលេចឡើងនៅពេលវាចេញមកដល់ពិភពខាងក្រៅ — អេក្រង់ ឬផ្លាកសញ្ញា, តម្លៃ,
      ការជូនដំណឹង, ច្រកទ្វារបើក, ចម្លើយជាសំឡេង។ នេះជារបៀបដែលមនុស្សជួបនឹងលទ្ធផល
      ខុសពីទិន្នន័យលទ្ធផលផ្ទាល់។
  - locale: vi
    value: >-
      Hình thức mà kết quả đầu ra của hệ thống này có khi đến với thế giới bên ngoài — một màn hình
      hoặc biển báo, một mức giá, một thông báo, một cánh cổng mở ra, một câu trả lời bằng giọng
      nói. Đây là cách mọi người tiếp xúc với kết quả đầu ra, khác với chính dữ liệu đầu ra.
  - locale: zh-Hans
    value: 本系统的输出进入现实世界时所采取的形式——屏幕或标牌、价格、通知、开启的闸门、语音回复。这是人们接触输出的方式，有别于输出数据本身。
  - locale: zh-Hant
    value: 這個系統的輸出結果進入現實世界時的形式：螢幕或看板、價格、通知、開啟的閘門、語音回覆。指人們接觸到輸出結果的方式，有別於輸出資料本身。
prompt:
  - locale: en
    value: How do people encounter what this system produces?
  - locale: fr
    value: Comment les gens rencontrent-ils ce que ce système produit ?
  - locale: es
    value: ¿Cómo se encuentran las personas con lo que produce este sistema?
  - locale: pt
    value: Como as pessoas têm contato com o que este sistema produz?
  - locale: fil
    value: Paano nakakaharap ng mga tao ang nililikha ng sistemang ito?
  - locale: km
    value: តើមនុស្សជួបនឹងអ្វីដែលប្រព័ន្ធនេះបង្កើតដោយរបៀបណា?
  - locale: vi
    value: Mọi người tiếp xúc với những gì hệ thống này tạo ra bằng cách nào?
  - locale: zh-Hans
    value: 人们如何接触到本系统产生的结果？
  - locale: zh-Hant
    value: 人們如何接觸到這個系統產生的結果？
