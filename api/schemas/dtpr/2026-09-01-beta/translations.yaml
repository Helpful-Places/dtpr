    note: Long, but the short form would collide with "Data Access".

  # --- Vietnamese ---
  - id: vi-senses
    locale: vi
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/senses.yaml#title
    note: '"Cảm nhận" is slightly anthropomorphic for a machine.'
    alternatives:
      - Nhận biết
  - id: vi-pseudonymous
    locale: vi
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
