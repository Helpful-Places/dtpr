  - id: km-technical-terms
    locale: km
    kind: native_review
    status: open
    raised_by: translator
    keys:
      - elements/privacy_transformation.yaml#description
    note: >-
      k-anonymization is left in Latin, differential privacy is transliterated, and geofence is
      glossed with the English in parentheses; likely opaque to the public.
  - id: km-accessibility-length
    locale: km
    kind: layout
    status: open
    raised_by: translator
    keys:
