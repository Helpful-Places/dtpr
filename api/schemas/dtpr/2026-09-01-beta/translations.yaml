    note: >-
      操控 (Moves), 执行 (Acts), 生成 (Creates). 执行 is close to the "carries it out" badge;
      生成 deliberately echoes "generated content".
  - id: zh-Hans-triage
    locale: zh-Hans
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - elements/risk_assessment.yaml#title
    note: 风险评估与优先排序; 分诊 is kept only where the context is clinical.

  # --- Traditional Chinese ---
  - id: zh-Hant-short-titles
    locale: zh-Hant
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/entry.yaml#title
      - elements/mobility.yaml#title
      - elements/presence_motion_sensor.yaml#title
      - elements/person_acting_on_it.yaml#title
    note: >-
      Judgement calls about brevity, not errors: 進入驗證 (Entry), 交通移動 (Mobility),
      存在與動作感測器, 由人據以行動.
  - id: zh-Hant-personal-information
    locale: zh-Hant
    kind: term_choice
    status: open
    raised_by: reviewer
    keys:
      - categories/input_dataset.yaml#element_context.name
      - categories/output_dataset.yaml#element_context.name
    note: >-
      "Personal Information" is 個人資訊 while "personal data" is 個人資料, mirroring the
      English. Taiwan's legal term for both is 個人資料.
  - id: zh-Hant-accountable
    locale: zh-Hant
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - categories/accountable.yaml#name
    note: 負責組織; 負責單位 would sound more like a Taiwan agency.
    alternatives:
      - 負責單位
  - id: zh-Hant-action-verbs
    locale: zh-Hant
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - elements/moves.yaml#title
      - elements/acts.yaml#title
      - elements/creates.yaml#title
    note: >-
      驅動 (Moves) reads slightly technical; 行動 (Acts) is noun-like where the others are
      verbs; 創作 (Creates) carries an artistic nuance.
    alternatives:
      - 操控
      - 執行
      - 生成
  - id: zh-Hant-triage
    locale: zh-Hant
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - elements/risk_assessment.yaml#description
    note: 分流 is used for "triage" everywhere; hospital triage is formally 檢傷分類 in Taiwan.
  - id: zh-Hant-health-safety
    locale: zh-Hant
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - elements/health.yaml#title
      - elements/safety_security.yaml#title
      - elements/people.yaml#title
    note: >-
      環境衛生 can suggest sanitation (alt 環境健康); 保全 in 安全與保全 leans toward premises
      security; 人 (People) is a single character (alt 民眾).
  - id: zh-Hant-feed-length
    locale: zh-Hant
    kind: layout
    status: open
    raised_by: translator
    keys:
      - elements/feed_placement.yaml#title
    note: At 14 characters this is the longest title.
