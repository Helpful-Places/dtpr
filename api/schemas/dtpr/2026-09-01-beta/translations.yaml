  # --- Khmer ---
  - id: km-organization
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/organization.yaml#title
    note: >-
      អង្គភាព is used for "organization" everywhere but leans toward "unit / department". The
      choice between អង្គភាព, អង្គការ and ស្ថាប័ន is a policy call.
    alternatives:
      - អង្គការ
  - id: km-harm
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/physical_harm.yaml#title
      - elements/psychological_harm.yaml#title
      - elements/civil_liberties_harm.yaml#title
    note: >-
      The "harm" titles use ការខូចខាត, which leans toward material damage. ការប៉ះពាល់ is more
      idiomatic but collides with "affected".
  - id: km-computer-vision
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/computer_vision.yaml#title
      - elements/biometric_recognition.yaml#description
    note: ចក្ខុវិស័យកុំព្យូទ័រ is the usual calque, but ចក្ខុវិស័យ normally means "vision" as in a goal.
  - id: km-decided-about
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - categories/affected.yaml#element_context.values[0].name
    note: Reviewer replacement រងការសម្រេចចិត្ត ("subject to a decision") to confirm as natural badge wording.
  - id: km-eligibility
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - categories/affected.yaml#element_context.values[0].description
      - elements/input_decision.yaml#description
      - elements/output_decision.yaml#description
    note: ភាពមានសិទ្ធិទទួលបាន is used on its own for "eligibility"; the trailing "receive" has no object.
  - id: km-sexuality
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/input_sensitive_personal.yaml#description
      - elements/output_sensitive_personal.yaml#description
    note: ភេទភាព for "sexuality" may not be established; right_non_discrimination uses ទំនោរផ្លូវភេទ.
  - id: km-manipulation
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/financial_harm.yaml#description
      - elements/political_economic_harm.yaml#description
    note: រៀបចំបំភ្លៃ for "manipulation" is an odd compound.
  - id: km-ticket-letter
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/printed_output.yaml#title
    note: សំបុត្រ means both "ticket" and "letter", so the title may read as "letter or letter".
  - id: km-misc-terms
    locale: km
    kind: native_review
    status: open
    raised_by: reviewer
    keys:
      - elements/ecology.yaml#title
      - elements/employment.yaml#title
      - elements/right_algorithmic_transparency.yaml#description
      - categories/action.yaml#element_context.values[1].description
    note: >-
      អេកូឡូស៊ី is a transliteration (បរិស្ថានវិទ្យា is native); the employment title reads "work
      and hiring staff"; តក្កវិជ្ជា is the discipline of logic, used for "the logic involved";
      "collection routes" has no object.
  - id: km-pseudonymous
    locale: km
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - categories/input_dataset.yaml#element_context.values[1].name
      - categories/output_dataset.yaml#element_context.values[1].name
    note: No established term; rendered descriptively as "data using a code in place of a name".
  - id: km-forgotten
    locale: km
    kind: term_choice
    status: open
    raised_by: translator
    keys:
      - elements/right_be_forgotten.yaml#title
    note: សិទ្ធិត្រូវបានបំភ្លេច is a calque of "right to be forgotten".
    alternatives:
