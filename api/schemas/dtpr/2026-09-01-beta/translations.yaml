    note: '"Humuhula" is the plain word but can also mean "guesses".'
    alternatives:
      - Nagtataya
  - id: fil-english-kept
    locale: fil
    kind: native_review
    status: open
    raised_by: translator
    keys:
      - elements/computer_vision.yaml#title
      - elements/privacy_transformation.yaml#description
    note: >-
      "Computer vision" is kept in English, as are technical loanwords in example lists
      (tokenization, differential privacy, geofencing, surge pricing, HVAC).
  - id: fil-hispanized
    locale: fil
    kind: term_choice
    status: open
    raised_by: translator
