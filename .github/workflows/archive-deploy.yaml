name: Archive deploy
on:
  push:
    branches: [main]
    paths:
      - 'archive/sidewalk-labs/**'
      - '.github/workflows/archive-deploy.yaml'
  workflow_dispatch:

concurrency:
  group: archive-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy dtpr-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # vision/ is its own pnpm root with its own lockfile, so this installs
      # only its webpack 4 toolchain, not the monorepo.
      - run: ./archive/sidewalk-labs/scripts/build.sh

      - name: Deploy worker
        working-directory: archive/sidewalk-labs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.151.0 deploy
