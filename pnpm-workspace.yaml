packages:
  - 'app'
  - 'api'
  - 'docs-site'
  - 'figma-plugin'
  - 'dtpr-ai'
  - 'packages/*'
  - 'prototypes/canvas'
  - 'talks/*'
# sharp is intentionally NOT in allowBuilds. Its install script forces a
# from-source build whenever a global libvips is on PATH (e.g. Homebrew's
# `vips` on macOS), which then fails because node-gyp isn't a dep. The
# prebuilt platform binary from `@img/sharp-<platform>-<arch>` (pulled in
# via sharp's optionalDependencies) is what sharp loads at runtime, so
# skipping the install script is safe on darwin-arm64, darwin-x64, and
# Linux CI. Re-enable only if you genuinely need a custom libvips link.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  # Explicitly false (not omitted) so pnpm doesn't warn with
  # ERR_PNPM_IGNORED_BUILDS and exit non-zero on fresh installs.
  sharp: false
  vue-demi: true
  workerd: true
# @nuxtjs/i18n@10 aliases its @intlify/* deps by resolving them relative
# to @nuxt/kit's own location (no base override). Under pnpm's isolated
# node_modules those packages live only in the virtual store, so `nuxt
# dev`/`build` fails with "Cannot resolve module @intlify/shared" for
# every app using the i18n module (canvas, dtpr-ai). Publicly hoisting
# @intlify/* into the top-level node_modules makes them resolvable from
# @nuxt/kit. Real consumers still resolve their own pinned version via
# their package's own symlinks first.
publicHoistPattern:
  - '@intlify/*'
overrides:
  # Pin TypeScript to the version main's lockfile resolves. Adding the
  # talks/* workspace (slidev) widened some peer ranges enough for pnpm to
  # pull TypeScript 6.x, which fails the @dtpr/ui dts build (stricter Vue
  # `h()` prop + CSS side-effect import checks).
  typescript: 5.9.3
