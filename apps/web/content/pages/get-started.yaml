title: Get Started
description: What DTPR is and how it works, in one page. A taxonomy of questions, a methodology built with the public and a visual language, shown with two real systems.
sections:
  - type: Hero
    eyebrow: Get started
    heading: What is DTPR, and how does it work?
    subHeading: DTPR (Digital Trust for Places and Routines) is an open standard for describing how a technology works visually, and in plain language. Instead of dense technical specifications or terms of service, it helps answer the questions people have before they can trust how a technology is used.
    horizontal: false
    hasButton: true
    buttonText: Explore the taxonomy
    buttonLink: /taxonomy
    secondaryButtonText: Read the docs
    secondaryButtonLink: /docs
  - type: Ways In
    heading: How DTPR works
    subHeading: DTPR is a taxonomy that answers a set of questions describing a technology, a methodology for finding and asking those questions, and a visual language for displaying the answers.
    cards:
      - type: card
        icon: list-tree
        heading: A taxonomy
        subHeading: A shared set of questions about any technology, each with a list of possible answers.
      - type: card
        icon: users
        heading: A methodology
        subHeading: Methods and resources for building a shared understanding of any technology, built for audiences from internal teams to the public.
      - type: card
        icon: shapes
        heading: A visual language
        subHeading: Consistent icons and descriptions across languages and mediums contributed to shared vocabulary about technology.
  - type: Datachain Rows
    anchor: taxonomy
    heading: A taxonomy is a set of questions
    body: |
      When scientists describe an animal, they don't start from scratch. They ask whether it has fur. If it does, it's a mammal, and probably warm-blooded. They ask how many legs it has. If it has six, it's probably an insect, with a hard outer shell. Questions like these tell them what they're looking at.

      DTPR works the same way. It asks one set of questions about any technology, sorted into 14 categories. Three are always answered: what the system is for, who is accountable for it, and who it is used on. The rest are answered when they apply.

      Each question comes with a list of possible answers, called **elements**. Describing a technology means choosing the elements that fit it, and the finished description is a **datachain**. Here is one system, a street sensor in the fictional city of Port Alder, answering the three questions every datachain answers, followed by the rest of the questions DTPR can ask.
    datachains:
      - src: /data/port-alder-mobility-sensor.datachain.json
        label: An example
    categories:
      - purpose
      - accountable
      - affected
    hasButton: true
    buttonText: Explore the taxonomy
    buttonLink: /taxonomy
    secondaryButtonText: Read the concepts
    secondaryButtonLink: /docs/concepts
  - type: Question List
    anchor: methodology
    heading: A methodology built with the public
    body: |
      The questions didn't come from a committee. We read the academic literature, ran public workshops and talked with residents about the technology in their lives: what they wanted to know about it, and which answers felt missing or hidden. The questions they kept asking became the taxonomy's categories.

      That process of co-design continues. Organizations that use DTPR run community workshops to test whether it makes sense for the places people live in. The open-source project is a living thing, improving and growing as technologies and new community needs become apparent.
    items:
      - How does this technology make you feel?
      - Is this information helpful?
      - How easy was this information to understand?
      - Was getting to the information on this page easy?
      - How would you rate this experience?
      - Do you trust this organization to be transparent and accountable about data privacy practices?
    hasButton: true
    buttonText: Add the survey to a notice
    buttonLink: /docs/deployers/feedback-survey
    secondaryButtonText: Plan a workshop
    secondaryButtonLink: /docs/deployers/community-workshops
  - type: Icon Anatomy
    anchor: visual-language
    heading: A visual language
    body: |
      Visual languages are good at communicating complex information. Think of nutrition labels. Nutritional science can be complex. If every item in a grocery store came with a ten-page report, shopping would be a lot more burdensome. A nutrition label communicates the important facts in a simple, consistent layout, making information easy to find and understand.

      DTPR does the same for technology. The taxonomy structures information in a simple, consistent layout. One or more elements can be used to answer each question. Put together, these elements and categories form the datachain, creating a narrative of the technology.
    hasButton: true
    buttonText: See every icon in the taxonomy
    buttonLink: /taxonomy/all
