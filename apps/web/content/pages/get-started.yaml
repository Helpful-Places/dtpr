title: Get Started
description: What DTPR is and how it works, in one page. A taxonomy of questions, a visual language and a feedback channel, with two real systems as examples.
sections:
  - type: Hero
    eyebrow: Get started
    heading: What is DTPR, and how does it work?
    subHeading: DTPR (Digital Trust for Places and Routines) is an open standard for describing how a technology works, in plain language and icons. Instead of dense technical specifications or terms of service, it answers the questions our community research found people need answered before they can trust how a technology is used.
    horizontal: false
    hasButton: true
    buttonText: Explore the taxonomy
    buttonLink: /taxonomy
    secondaryButtonText: Read the docs
    secondaryButtonLink: /docs
  - type: Ways In
    heading: How DTPR works
    subHeading: DTPR combines a taxonomy of technology concepts, a visual language for describing a technology, and a way for the public to say what they think of it.
    cards:
      - type: card
        heading: A taxonomy
        subHeading: A shared set of questions about any technology, each with a list of possible answers.
      - type: card
        heading: A visual language
        subHeading: An icon and a plain description for every answer, with guidance on how to arrange them.
      - type: card
        heading: A feedback channel
        subHeading: A short survey that lets people tell the organization responsible how they feel about it.
  - type: Datachain Rows
    anchor: taxonomy
    heading: A taxonomy is a set of questions
    body: |
      When scientists describe an animal, they don't start from scratch. They ask whether it has fur. If it does, it's a mammal, and probably warm-blooded. They ask how many legs it has. If it has six, it's probably an insect, with a hard outer shell. Questions like these tell them what they're looking at.

      DTPR works the same way. We read the academic literature, ran public workshops and talked with residents to learn what they ask about the technology in their lives, and which answers they felt were missing or hidden. Then we sorted those questions into categories.

      The result is one taxonomy of 14 categories. Each category is a question, and the same questions apply to any technology. Three are always answered: what the system is for, who is accountable for it, and who it is used on. The rest are answered when they apply.

      Each question comes with a list of possible answers, called **elements**. Describing a technology means choosing the elements that fit it, and the finished description is a **datachain**. Here are two very different systems, a street sensor in Long Beach and facial recognition software in New York, answering the three questions every datachain answers.
    datachains:
      - src: /data/long-beach-numina-mobility-sensor.datachain.json
        label: Long Beach
      - src: /data/nypd-facial-recognition.datachain.json
        label: New York City
    categories:
      - purpose
      - accountable
      - affected
    hasButton: true
    buttonText: Explore the taxonomy
    buttonLink: /taxonomy
    secondaryButtonText: Read the concepts
    secondaryButtonLink: /docs/concepts
  - type: Icon Anatomy
    anchor: visual-language
    heading: A visual language
    body: |
      Visual languages are good at getting complex information across. Think of nutrition labels. Nutritional science is hard to follow, and if every item in a grocery store came with a ten-page report, nobody would get their shopping done. A nutrition label puts the most important facts in a simple layout that is the same on every package.

      DTPR does the same for technology. Every element in the taxonomy has an open-source icon and a plain-language description, and DTPR comes with guidance on how to arrange the icons. Each icon is built the same way: a symbol for the element, inside a shape set by its category, and for some categories a colour that adds context, such as how identifiable the data is.
    elementId: input_about_behaviour
    hasButton: true
    buttonText: See every icon in the taxonomy
    buttonLink: /taxonomy/all
    secondaryButtonText: Shapes, in Concepts
    secondaryButtonLink: /docs/concepts#shape
  - type: Question List
    anchor: feedback-channel
    heading: A feedback channel
    body: |
      Accountability goes both ways. People need a way to respond to a technology, and a sense that what they say can change how it's used. This has come up in nearly every piece of community research DTPR has done.

      So DTPR includes a short survey that can be attached to any DTPR notice. People rate the technology from 1 to 5 on questions about trust, clarity and usefulness. The questions were written for websites and other digital channels, but deployers have also used them in interviews and community workshops.
    items:
      - How does this technology make you feel?
      - Is this information helpful?
      - How easy was this information to understand?
      - Was getting to the information on this page easy?
      - How would you rate this experience?
      - Do you trust this organization to be transparent and accountable about data privacy practices?
    hasButton: true
    buttonText: Run the survey
    buttonLink: /docs/deployers/feedback-survey
  - type: Ways In
    anchor: ways-to-deploy
    heading: Ways to deploy
    subHeading: Deployers put DTPR where people meet the technology it describes.
    cards:
