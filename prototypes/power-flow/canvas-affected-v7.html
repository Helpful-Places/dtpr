<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DTPR Power Canvas — v7 · one flow (system + data merged)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f6f6f4; --card:#ffffff; --ink:#1b1b19; --muted:#72726c;
    --line:#e6e5e0; --line-strong:#d3d2cc; --chip:#f3f3ef;
    --signal:#c2410c;            /* the affected seat / process node */
    --alarm:#b42318;             /* missing rights / mitigation */
    --teal:#0f5153;              /* DTPR accent — eyebrow + links only */
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Public Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--teal);font-weight:600}
  a:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
  .wrap{max-width:920px;margin:0 auto;padding:48px 24px 90px;position:relative}

  /* ---- page header ---- */
  .eyebrow{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    color:var(--teal);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);
    padding:4px 11px;border-radius:999px;margin-bottom:18px;background:var(--card)}
  h1{font-size:2rem;font-weight:700;letter-spacing:-.015em;margin:0 0 8px}
  .sub{color:var(--muted);font-size:1rem;max-width:70ch;margin:0}
  .thesis{font-size:.95rem;max-width:76ch;margin:22px 0 0;padding:14px 18px;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:0 10px 10px 0}
  .thesis b{color:var(--ink)}
  code{font-family:var(--mono);font-size:.84em;background:var(--chip);border:1px solid var(--line);
    padding:1px 5px;border-radius:5px}

  /* ---- locale switcher ---- */
  .langswitch{position:absolute;top:44px;right:24px;display:flex;border:1px solid var(--line);
    border-radius:999px;overflow:hidden;background:var(--card)}
  .langbtn{border:0;background:transparent;font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.06em;
    color:var(--muted);padding:6px 14px;cursor:pointer;transition:background .12s,color .12s}
  .langbtn.on{background:var(--teal);color:#fff}

  h3.section{font-size:1.1rem;font-weight:700;margin:56px 0 4px}
  .section-sub{color:var(--muted);font-size:.9rem;margin:0 0 18px;max-width:74ch}

  /* ---- the board ---- */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 30px;
    box-shadow:0 1px 2px rgba(27,27,25,.04),0 16px 36px -30px rgba(27,27,25,.3)}
  .cell{background:var(--card);padding:18px 22px;min-width:0}
  .span2{grid-column:1/-1}
  .zl{font-size:.64rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

  .head{padding:20px 22px 18px}
  .head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .sysno{display:block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
  .head h2{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
  .read{margin:10px 0 0;font-size:.92rem;color:var(--muted);max-width:72ch}

  .chip{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;
    background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 8px;white-space:nowrap}
  .chip img,.chip svg{display:block}
  .chip .k{font-weight:600;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

  /* ---- the composition markers (U2) ---- */
  .mk{display:inline;padding:0 .12em;border-radius:2px;
    background:linear-gradient(180deg,transparent 0 52%,var(--mkfill) 52% 92%,transparent 92%);
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .mk-neutral{--mkfill:rgba(114,114,108,.28)}
  .mk-color{--mkfill:color-mix(in srgb,var(--mkc) 58%,transparent)}

  /* ---- piece: A stack ---- */
  .astack{min-width:0}
  .a-l1{font-weight:700;font-size:1rem;line-height:1.25}
  .a-l2{font-size:.9rem;margin-top:3px;line-height:1.35}
  .a-l2 .a-type{color:var(--ink);font-weight:600}
  .a-l3{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.35}
  .sep{color:var(--line-strong);margin:0 .5em}
  .risk-narr{color:var(--muted);font-weight:400;max-width:64ch}

  /* ============================================================
     v7 · THE ONE FLOW  (system sentence + data flow, merged)
     A single vertical spine. Input and Output are hollow nodes;
     the middle Process node is the "brain" — it carries the mode
     icons and the system sentence (autonomy is its coloured mark).
     ============================================================ */
  .flow{position:relative;padding-left:40px}
  /* the spine */
  .flow::before{content:'';position:absolute;left:15px;top:14px;bottom:14px;width:2px;
    background:linear-gradient(180deg,var(--line-strong),var(--line-strong))}
  .fstep{position:relative;min-width:0}
  /* the node dot on the spine */
  .fdot{position:absolute;left:-32px;top:2px;width:18px;height:18px;border-radius:50%;
    background:var(--card);border:2px solid var(--line-strong);z-index:1}
  .fdot.io{border-color:var(--muted)}
  .fdot.proc{width:22px;height:22px;left:-34px;top:0;border-color:var(--signal);
    background:color-mix(in srgb,var(--signal) 12%,var(--card));
    box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 10%,transparent)}
  /* the connective verb that sits on the spine between two nodes */
  .fverb{position:relative;display:block;margin:2px 0 2px -6px;font-size:.72rem;font-weight:600;
    color:var(--muted);letter-spacing:.02em;padding:6px 0 6px 0}
  .fverb::before{content:'↓';position:absolute;left:-31px;top:2px;font-size:1rem;color:var(--line-strong)}

  /* a node body — icon + stack, same A grammar as everywhere else */
  .fnode{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:2px 0}
  .fnode-ic{flex:none;display:block}

  /* the process node's "how it works" — modes + system sentence */
  .fproc{padding:12px 14px;margin-top:10px;background:color-mix(in srgb,var(--signal) 4%,var(--card));
    border:1px solid color-mix(in srgb,var(--signal) 22%,var(--line));border-radius:12px}
  .fproc-k{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--signal);margin-bottom:8px}
  .fproc-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mode-icons{display:flex;gap:8px;flex:none}
  .mode-icons img{display:block}
  .sys-sentence{margin:0;font-size:.98rem;color:var(--ink)}

  /* ---- risk (U5) ---- */
  .pc{min-width:0}
  .pc-a{display:flex;align-items:flex-start;gap:12px;min-width:0}
  .pc-ic{flex:none;display:block}
  .risk-list{display:flex;flex-direction:column;gap:20px}
  .mitig{margin-top:9px;font-size:.84rem}
  .mit-k{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:8px}
  .mit-alarm{margin-top:9px}
  .alarm{display:flex;align-items:center;gap:10px;font-size:.86rem;font-weight:600;color:var(--alarm);
    border:1.5px dashed color-mix(in srgb,var(--alarm) 45%,transparent);border-radius:10px;padding:10px 14px;
    background:color-mix(in srgb,var(--alarm) 4%,var(--card))}
  .bang{flex:none;width:18px;height:18px;border-radius:50%;background:var(--alarm);color:#fff;
    font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

  /* ---- rights ---- */
  .rights{display:flex;flex-direction:column;gap:13px}
  .right{display:flex;align-items:flex-start;gap:10px;font-size:.85rem}
  .right img{flex:none}
  .right .rn{font-weight:600}
  .right .rs{color:var(--muted);font-weight:400}
  .racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  a.act{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--teal);
    text-decoration:none;background:var(--card);border:1px solid color-mix(in srgb,var(--teal) 34%,transparent);
    border-radius:999px;padding:3px 11px;transition:background .12s,color .12s,border-color .12s}
  a.act:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  a.act svg{flex:none}
  .esc{padding-top:12px;border-top:1px dashed var(--line);margin-top:2px}
  .esc .ek{display:block;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  /* ---- relationship legend ---- */
  .rel-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .rel-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;min-width:0}
  .rel-card .rc-head{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .rel-card .rc-name{font-weight:700;font-size:.98rem}
  .rel-card .rc-id{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;color:var(--signal)}
  .rel-card .rc-desc{font-size:.84rem;color:var(--muted)}

  footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;max-width:80ch}

  /* ---- immediate hover tooltip on every icon ---- */
  [data-tip]{cursor:help}
  .tip{position:fixed;z-index:1000;display:none;background:var(--ink);color:#fff;font-size:.75rem;font-weight:600;
    line-height:1.3;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;
    max-width:280px;box-shadow:0 6px 20px -6px rgba(27,27,25,.45)}
  .tip::after{content:'';position:absolute;left:var(--tipx,50%);transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--ink);top:100%}
  .tip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}

  @media (max-width:680px){
    .board{grid-template-columns:1fr}
    .span2{grid-column:auto}
    .rel-legend{grid-template-columns:1fr}
    .langswitch{position:static;display:inline-flex;margin-bottom:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="langswitch">
    <button class="langbtn on" data-loc="en">EN</button>
    <button class="langbtn" data-loc="fr">FR</button>
  </div>
  <span class="eyebrow" id="eyebrow"></span>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="thesis" id="thesis"></div>

  <h3 class="section" id="secSystems"></h3>
  <p class="section-sub" id="secSystemsSub"></p>
  <div id="systems"></div>

  <h3 class="section" id="secRel"></h3>
  <p class="section-sub" id="secRelSub"></p>
  <div class="rel-legend" id="rellegend"></div>

  <footer id="foot"></footer>
</div>

<script>
/* ============================================================================
   v7 · One flow. The "system" and "data flow" seats are merged into a single
   vertical spine — Input → (the system's process) → Output. The functional
   modes and the autonomy phrase dock onto the middle Process node, because
   that is literally where sensing and deciding happen. The whole board now
   reads as one sentence.
   ========================================================================== */

/* ---- i18n primitives ---- */
const t=(en,fr)=>({en,fr});
const tr=(v,loc)=> (v&&typeof v==='object'&&'en'in v) ? v[loc] : (v==null?'':v);
const listF=loc=>new Intl.ListFormat(loc,{type:'conjunction'});
const compact=(n,loc)=>new Intl.NumberFormat(loc,{notation:'compact',maximumFractionDigits:1}).format(n);

/* ---- real DTPR icons, composed by the API ---- */
const API='https://api.dtpr.io/api/v2/schemas/ai@2026-05-06-beta/elements/';
const attr=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const ic=(id,s=44,tip='')=>`<img src="${API}${id}/icon.svg" width="${s}" height="${s}" alt="" loading="lazy" style="object-fit:contain"${tip?` data-tip="${attr(tip)}"`:''}>`;
const icT=(m,s,loc)=>`<img src="${API}${m.id}/icon.svg" width="${s}" height="${s}" alt="${tr(m.t,loc)} (${tr(m.s,loc)})" data-tip="${attr(tr(m.t,loc)+' ('+tr(m.s,loc)+')')}" loading="lazy" style="object-fit:contain">`;

/* people (affected) — composed in-page like the API: hexagon frame + people symbol */
const HEXPATH='M31.8564 8.8453L19 1.42265C18.3812 1.06538 17.6188 1.06538 17 1.42265L4.14359 8.8453C3.52479 9.20257 3.14359 9.86282 3.14359 10.5774V25.4226C3.14359 26.1372 3.52479 26.7974 4.14359 27.1547L17 34.5774C17.6188 34.9346 18.3812 34.9346 19 34.5774L31.8564 27.1547C32.4752 26.7974 32.8564 26.1372 32.8564 25.4226V10.5774C32.8564 9.86282 32.4752 9.20256 31.8564 8.8453Z';
const PEOPLE='<path d="M13.5 10.6667C15.1569 10.6667 16.5 12.0098 16.5 13.6667C16.5 15.3235 15.1569 16.6667 13.5 16.6667C11.8431 16.6667 10.5 15.3235 10.5 13.6667C10.5 12.0098 11.8431 10.6667 13.5 10.6667Z"/><path d="M22.5 10.6667C24.1569 10.6667 25.5 12.0098 25.5 13.6667C25.5 15.3235 24.1569 16.6667 22.5 16.6667C20.8431 16.6667 19.5 15.3235 19.5 13.6667C19.5 12.0098 20.8431 10.6667 22.5 10.6667Z"/><path d="M13.5 18C10.1863 18 7.5 20.6863 7.5 24V25.3333H19.5V24C19.5 20.6863 16.8137 18 13.5 18Z"/><path d="M22.5 18C21.9316 18 21.3818 18.0791 20.8608 18.2266C22.1863 19.7061 23 21.6589 23 24V25.3333H28.5V24C28.5 20.6863 25.8137 18 22.5 18Z"/>';
const peopleIc=(s=44,tip='')=>`<svg width="${s}" height="${s}" viewBox="0 0 36 36" aria-hidden="true"${tip?` data-tip="${attr(tip)}"`:''}><path d="${HEXPATH}" fill="none" stroke="#000" stroke-width="2"/><g fill="#000">${PEOPLE}</g></svg>`;

/* ============================================================================
   MARKERS + COLOUR
   ========================================================================== */
const CLASSIFICATION_COLOR={
  identifiable:'#FFD700', de_identified:'#4A90D9', pseudonymous:'#9575CD',   // input/output · pii
  autonomous:'#E76F51',   human_decides:'#2A9D8F', human_executes:'#6A1B7A', // functional_modes · autonomy
};
const mk=(text,key)=>{
  const c=CLASSIFICATION_COLOR[key];
  return c ? `<span class="mk mk-color" style="--mkc:${c}">${text}</span>`
           : `<span class="mk mk-neutral">${text}</span>`;
};
const clsMarker=(cls,loc,variant)=> cls ? mk(tr(cls[variant]||cls.a,loc), cls.key) : '';

/* ---- classification vocabularies ---- */
const PII={
  identifiable:  {key:'identifiable',  a:t('Identifiable','Données identifiables'),   c:t('identifiable','données identifiables')},
  de_identified: {key:'de_identified', a:t('De-identified','Données anonymisées'),     c:t('de-identified','anonymisées')},
  pseudonymous:  {key:'pseudonymous',  a:t('Pseudonymous','Données pseudonymisées'),   c:t('pseudonymous','pseudonymisées')},
};
const REL={
  subject:{key:null,
    a:t('Decided about','Décidé à son sujet'),
    legend:t('The system produces an output about this person that affects them directly — a score, a match, an eligibility call.','Le système produit un résultat sur cette personne qui l’affecte directement — un score, une correspondance, une décision d’admissibilité.')},
  bystander:{key:null,
    a:t('Caught incidentally','Pris de façon incidente'),
    legend:t('Swept into the system’s data even though it isn’t making a decision about them — a face in the background of a camera aimed elsewhere.','Intégrés aux données du système sans qu’aucune décision ne les concerne — un visage à l’arrière-plan d’une caméra visant ailleurs.')},
  community:{key:null,
    a:t('Wider community','Communauté élargie'),
    legend:t('A place or group affected collectively, beyond the individuals the system processes — a neighbourhood under watch, a ranked workforce.','Un lieu ou un groupe affecté collectivement, au-delà des individus traités — un quartier surveillé, un effectif classé.')},
};
const MIT_LABEL=t('Mitigation','Atténuation');
const NO_MIT=t('No mitigation provided','Aucune atténuation');

/* ============================================================================
   THE SYSTEM SENTENCE — unchanged; it now lives INSIDE the flow, docked to
   the process node. Autonomy is a coloured marker.
   ========================================================================== */
const VERBS={
  perceptive_mode:{d:t('senses','détecte')},
  semantic_mode:{d:t('understands','comprend')},
  analytical_mode:{d:t('decides','décide'), human_decides:t('recommends','recommande')},
  generative_mode:{d:t('creates','génère'), human_decides:t('drafts','rédige')},
  agentic_mode:{d:t('acts','agit'), human_executes:t('plans actions','planifie des actions'), human_decides:t('proposes actions','propose des actions')},
  physical_mode:{d:t('moves','se déplace'), human_executes:t('plans movements','planifie des mouvements'), human_decides:t('proposes movements','propose des mouvements')},
};
const TEMPLATES={
  autonomous:     t('It {verbs} *on its own*.','Il {verbs} *tout seul*.'),
  human_executes: t('It {verbs}, and *a person carries out the result*.','Il {verbs}, et *une personne exécute le résultat*.'),
  human_decides:  t('It {verbs}, and *a person decides what to do next*.','Il {verbs}, et *une personne décide de la suite*.'),
};
function sentence(sy,loc){
  const a=sy.autonomy.id;
  const verbs=listF(loc).format(sy.modes.map(m=>tr((VERBS[m.id]&&(VERBS[m.id][a]||VERBS[m.id].d)),loc) || tr(m.t,loc).toLowerCase()));
  return tr(TEMPLATES[a],loc).replace('{verbs}',verbs)
    .replace(/\*(.+?)\*/,(_,txt)=>mk(txt,a));
}

/* ============================================================================
   DATA A-STACK — the specific value leads; PII is the coloured classification
   ========================================================================== */
function dataStack(p,loc){
  const l1=`<div class="a-l1">${tr(p.instance,loc)}</div>`;
  const parts=[`<span class="a-type">${tr(p.type,loc)}</span>`];
  if(p.pii) parts.push(clsMarker(PII[p.pii],loc,'a'));
  const l2=`<div class="a-l2">${parts.join('<span class="sep">·</span>')}</div>`;
  const facts=(p.facts||[]).map(f=>tr(f,loc));
  const l3=facts.length?`<div class="a-l3">${facts.join('<span class="sep">·</span>')}</div>`:'';
  return l1+l2+l3;
}

/* ============================================================================
   ★ THE ONE FLOW (v7) ★
   Input node → connective verb → Process node (modes + sentence) →
   connective verb → Output node. One spine, one story.
   ========================================================================== */
const FLOW_RUN=t('runs through','passe par');
const FLOW_OUT=t('to produce','pour produire');
const PROC_K   =t('the system','le système');

function flowNode(p,loc,dotClass){
  return `<div class="fstep">
    <span class="fdot ${dotClass}"></span>
    <div class="fnode"><div class="fnode-ic">${ic(p.id,40,tr(p.type,loc))}</div>
      <div class="astack">${dataStack(p,loc)}</div></div>
  </div>`;
}
function flowVerb(label,loc){
  return `<div class="fstep"><span class="fverb">${tr(label,loc)}</span></div>`;
}
function processNode(sy,loc){
  return `<div class="fstep">
    <span class="fdot proc"></span>
    <div class="fnode"><div class="fnode-ic">${ic(sy.processing.id,40,tr(sy.processing.type,loc))}</div>
      <div class="astack">${dataStack(sy.processing,loc)}</div></div>
    <div class="fproc">
      <div class="fproc-k">${tr(PROC_K,loc)}</div>
      <div class="fproc-row">
        <div class="mode-icons">${sy.modes.map(m=>icT(m,34,loc)).join('')}</div>
        <p class="sys-sentence">${sentence(sy,loc)}</p>
      </div>
    </div>
  </div>`;
}
function flow(sy,loc){
  return `<div class="flow">
    ${flowNode(sy.input,loc,'io')}
    ${flowVerb(FLOW_RUN,loc)}
    ${processNode(sy,loc)}
    ${flowVerb(FLOW_OUT,loc)}
    ${flowNode(sy.output,loc,'io')}
  </div>`;
}

/* ============================================================================
   RISK — harm type leads, narrative describes, mitigation pairs (A-only)
   ========================================================================== */
function riskPiece(r,loc){
  const l1=`<div class="a-l1">${tr(r.title,loc)}</div>`;
  const l2=`<div class="a-l2 risk-narr">${tr(r.narrative,loc)}</div>`;
  const resp=r.mitigation
    ? `<div class="mitig"><span class="mit-k">${tr(MIT_LABEL,loc)}</span>${tr(r.mitigation,loc)}</div>`
    : `<div class="alarm mit-alarm"><span class="bang">!</span>${tr(NO_MIT,loc)}</div>`;
  return `<div class="pc"><div class="pc-a"><div class="pc-ic">${ic(r.harm,40,tr(r.title,loc))}</div>
    <div class="astack">${l1+l2+resp}</div></div></div>`;
}

/* ---- affected ---- */
const scaleText=(p,loc)=> p.count!=null
  ? `~${compact(p.count,loc)} ${tr(p.noun,loc)}${p.per?' '+tr(p.per,loc):''}`
  : tr(p.scale,loc);
function peoplePiece(u,loc){
  const r=REL[u.rel];
  const l1=`<div class="a-l1">${tr(u.who,loc)}</div>`;
  const l2=`<div class="a-l2">${clsMarker(r,loc,'a')}</div>`;
  const sc=scaleText(u,loc);
  const l3=sc?`<div class="a-l3">${sc}</div>`:'';
  return `<div class="pc"><div class="pc-a"><div class="pc-ic">${peopleIc(40,tr(r.a,loc))}</div>
    <div class="astack">${l1+l2+l3}</div></div></div>`;
}
/* ---- accountable ---- */
function orgPiece(o,loc){
  return `<div class="pc"><div class="pc-a"><div class="pc-ic">${ic(o.el,44,tr(o.role,loc))}</div>
    <div class="astack"><div class="a-l1">${o.name}</div><div class="a-l2"><span class="a-type">${tr(o.role,loc)}</span></div></div></div></div>`;
}

const mailBody=(sy,right,loc)=> loc==='fr'
? `Madame, Monsieur,\n\nJe fais valoir mon « ${right} » au titre de la divulgation DTPR pour :\n\n  Système : ${tr(sy.name,loc)} (réf ${sy.ref})\n  Exploité par : ${tr(sy.runby.name,loc)}\n\nDétails de ma demande :\n\n`
: `To whom it may concern,\n\nI am exercising my "${right}" under the DTPR disclosure for:\n\n  System: ${tr(sy.name,loc)} (ref ${sy.ref})\n  Operated by: ${tr(sy.runby.name,loc)}\n\nDetails of my request:\n\n`;
const actHref=(a,sy,right,loc)=>{
  if(a.type==='email')return `mailto:${a.target}?subject=${encodeURIComponent(`[${sy.ref}] ${right} — ${tr(sy.name,loc)}`)}&body=${encodeURIComponent(mailBody(sy,right,loc))}`;
  if(a.type==='phone')return `tel:${a.target}`;
  return a.target;
};
const actBtn=(a,sy,right,loc)=>`<a class="act" href="${actHref(a,sy,right,loc)}"${a.type==='url'||a.type==='form'?' target="_blank" rel="noopener"':''}>${G[a.type]||''}${tr(a.label,loc)}</a>`;

/* ============================================================================
   BOARD ASSEMBLY
   ========================================================================== */
function board(sy,i,loc){
  const actsRow=(acts,right)=>acts&&acts.length?`<div class="racts">${acts.map(a=>actBtn(a,sy,right,loc)).join('')}</div>`:'';
  const escHtml=sy.escalate?`<div class="esc"><span class="ek">${tr(sy.escalate.k,loc)}</span><div class="racts" style="margin-top:0">${sy.escalate.acts.map(a=>actBtn(a,sy,tr(UI.complaint,loc),loc)).join('')}</div></div>`:'';
  const rightsHtml=(sy.rights.length
    ? `<div class="rights">${sy.rights.map(r=>`<div class="right">${ic(r.id,26,tr(r.t,loc))}<div><span class="rn">${tr(r.t,loc)}</span>${r.s?` <span class="rs">— ${tr(r.s,loc)}</span>`:''}${actsRow(r.acts,tr(r.t,loc))}</div></div>`).join('')}`
    : `<div class="rights"><div class="alarm"><span class="bang">!</span>${tr(UI.noRights,loc)}</div>`)
    + escHtml + `</div>`;

  const risks=sy.risks||[];
  const riskCell=risks.length
    ? `<div class="cell span2"><div class="zl">${tr(UI.zRisk,loc)}</div><div class="risk-list">${risks.map(r=>riskPiece(r,loc)).join('')}</div></div>`
    : '';

  return `<div class="board">
    <div class="cell span2 head">
      <div class="head-top">
        <div><span class="sysno">${tr(UI.sysOf,loc).replace('{n}',i+1)} · ${sy.ref}</span><h2>${tr(sy.name,loc)}</h2></div>
        <span class="chip">${ic(sy.purpose.id,22,tr(sy.purpose.t,loc))}<span><span class="k">${tr(UI.for,loc)}</span> ${tr(sy.purpose.t,loc)}</span></span>
      </div>
      <p class="read">${tr(sy.read,loc)}</p>
    </div>
    <div class="cell"><div class="zl">${tr(UI.zRun,loc)}</div>${orgPiece(sy.runby,loc)}</div>
    <div class="cell"><div class="zl">${tr(UI.zBuilt,loc)}</div>${orgPiece(sy.builtby,loc)}</div>

    <div class="cell span2"><div class="zl">${tr(UI.zFlow,loc)}</div>${flow(sy,loc)}</div>

    ${riskCell}
    <div class="cell"><div class="zl">${tr(UI.zUsed,loc)}</div>${peoplePiece(sy.usedon,loc)}</div>
    <div class="cell"><div class="zl">${tr(UI.zYou,loc)}</div>${rightsHtml}</div>
  </div>`;
}

/* ============================================================================

   ========================================================================== */
function render(loc){
  document.documentElement.lang=loc;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v;};
  set('eyebrow',tr(UI.eyebrow,loc));
  set('h1',tr(UI.h1,loc));
  set('sub',tr(UI.sub,loc));
  set('thesis',tr(UI.thesis,loc));
  set('secSystems',tr(UI.secSystems,loc));
  set('secSystemsSub',tr(UI.secSystemsSub,loc));
  set('secRel',tr(UI.secRel,loc));
  set('secRelSub',tr(UI.secRelSub,loc));

  set('systems',SYSTEMS.map((sy,i)=>board(sy,i,loc)).join(''));

  set('rellegend',Object.entries(REL).map(([id,r])=>`
    <div class="rel-card">
      <div class="rc-head">${peopleIc(34,tr(r.a,loc))}
        <div class="rc-name">${tr(r.a,loc)}<span class="rc-id">affected · ${id}</span></div></div>
      <div class="rc-desc">${tr(r.legend,loc)}</div>
    </div>`).join(''));

  set('foot',tr(UI.foot,loc));

  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.loc===loc));
}
document.querySelectorAll('.langbtn').forEach(b=>b.addEventListener('click',()=>render(b.dataset.loc)));
render('en');

/* ---- immediate icon tooltip (delegated, survives every re-render) ---- */
const tipEl=document.createElement('div');
tipEl.className='tip'; tipEl.setAttribute('role','tooltip');
document.body.appendChild(tipEl);
function placeTip(el){
  const txt=el.getAttribute('data-tip'); if(!txt) return;
  tipEl.textContent=txt; tipEl.style.display='block'; tipEl.classList.remove('below');
  const r=el.getBoundingClientRect(), b=tipEl.getBoundingClientRect();
  const cx=r.left+r.width/2;
  let x=cx-b.width/2, y=r.top-b.height-9;
  if(y<4){ y=r.bottom+9; tipEl.classList.add('below'); }
  x=Math.max(6,Math.min(x,window.innerWidth-b.width-6));
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  tipEl.style.setProperty('--tipx',(cx-x)+'px');
}
const hideTip=()=>{tipEl.style.display='none';};
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]'); if(el) placeTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]'); if(el&&!el.contains(e.relatedTarget)) hideTip();});
window.addEventListener('scroll',hideTip,true);
