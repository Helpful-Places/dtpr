  - type: Centered Content
    heading: How We Began
    body: |
      In 2019, Sidewalk Labs brought over 100 experts to answer a central question, how could we create a standard for open communication about how data is used in the public realm?

      In 2020, the first draft of what would eventually become DTPR. Conveners held usability tests, expert interviews, and community codesign sessions to understand if what they’d created was actually useful. The response was a resounding yes. The original prototype draft standard as well as all the co-design activities and materials used to generate it, are publicly and freely available . Today, DTPR kept its letters but has a new name - Digital Trust for Places and Routines. It also has a new steward, Helpful Places, and continues to evolve into a more comprehensive framework for digital transparency. 

      Helpful Places continues to develop and expand DTPR in collaboration with a growing coalition of partners, ensuring it remains an evolving resource for fostering transparency in the public realm.

  
