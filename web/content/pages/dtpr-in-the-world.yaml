  - type: Two Columns
    headingLeft: Fostering digital trust for smarter places.
    bodyLeft: Sydney Olympic Park is advancing a model of responsible innovation. With DTPR, the Park introduced transparent communication about its use of CCTV, public WiFi, crowd measurement, and smart irrigation systems—establishing a new standard for accountability and public trust in urban technology.
